var D={"t": ["شروط الاستخدام", "Terms of Use", "Conditions d’utilisation"], "s": [[["القبول والغرض", "Acceptance and purpose", "Acceptation et objet"], ["باستعمالك «نور الفرقان» توافق على هذه الشروط وعلى سياسة الخصوصية. التطبيق مجاني وللتعلّم العام ولا يغني عن العلماء والمدارس والمساجد. من هم دون 18 سنة يستعملونه بمرافقة وليّ الأمر.", "By using “Nur al-Furqan” you accept these terms and the privacy policy. The app is free, for general learning, and does not replace scholars, schools or mosques. Users under 18 should use it with a parent or guardian.", "En utilisant « Nur al-Furqan », vous acceptez ces conditions et la politique de confidentialité. L’application est gratuite, destinée à l’apprentissage général, et ne remplace ni les savants, ni les écoles, ni les mosquées. Les moins de 18 ans l’utilisent avec un parent ou tuteur."]], [["ليس فتوى", "Not a fatwa", "Pas une fatwa"], ["المحتوى والمساعد تعليميّان. للمسائل الخاصة والخلافية راجع عالمًا موثوقًا أو جهة الإفتاء الرسمية في بلدك. نبذل جهدنا في الدقة ولا نضمن خلوّ المحتوى من الخطأ؛ وللإبلاغ عن خطأ استعمل صفحة الدعم وسنصحّحه.", "Content and the assistant are educational. For personal or disputed matters consult a trusted scholar or your country’s official fatwa authority. We strive for accuracy but cannot guarantee the content is error-free; report errors via the support page and we will correct them.", "Le contenu et l’assistant sont éducatifs. Pour les questions personnelles ou controversées, consultez un savant de confiance ou l’autorité officielle de fatwa de votre pays. Nous visons l’exactitude sans garantir l’absence d’erreurs ; signalez-les via la page d’assistance et nous les corrigerons."]], [["القرآن والمحتوى والصوت", "Quran, content and audio", "Coran, contenus et audio"], ["نص المصحف والتفاسير والترجمات والتلاوات ملك لأصحابها أو متاح بتراخيصه الموضحة في صفحة «المصادر والتراخيص»، ولا يجوز استعماله تجاريًا خارج تلك التراخيص. التلاوات تُبثّ من مواقع أصحابها ولا تُخزَّن هنا. تعليم الدروس والأسئلة وتصميم التطبيق محفوظ لمنشئه، ويجوز الاستعمال الشخصي والتعليمي غير التجاري. تُعامَل آيات القرآن بالتوقير: لا تُستعمل في ما يسيء إليها.", "The Quran text, commentaries, translations and recitations belong to their owners or are available under the licences listed on the “Sources and licences” page, and may not be used commercially outside them. Recitations are streamed from their owners’ sites and are not stored here. Lessons, questions and app design are reserved to the creator; personal and non-commercial educational use is welcome. Quranic verses must be treated with reverence.", "Le texte du Coran, les exégèses, traductions et récitations appartiennent à leurs ayants droit ou sont disponibles selon les licences indiquées sur la page « Sources et licences » ; tout usage commercial hors de ces licences est interdit. Les récitations sont diffusées depuis les sites de leurs propriétaires et ne sont pas stockées ici. Leçons, questions et conception de l’application sont réservées au créateur ; l’usage personnel et éducatif non commercial est bienvenu. Les versets coraniques doivent être traités avec respect."]], [["النقاط والمتجر الافتراضي", "Points and virtual shop", "Points et boutique virtuelle"], ["النقاط والقلوب والعناصر مكافآت افتراضية داخل التطبيق ولا قيمة نقدية لها ولا تُستبدل بمال، ولا يوجد شراء بمال حقيقي. قد نعدّل نظامها لتحسين التجربة.", "Points, hearts and items are virtual in-app rewards with no cash value, not exchangeable for money; there are no real-money purchases. We may adjust the system to improve the experience.", "Points, cœurs et objets sont des récompenses virtuelles sans valeur monétaire, non échangeables contre de l’argent ; il n’y a aucun achat en argent réel. Nous pouvons ajuster le système pour améliorer l’expérience."]], [["الاستعمال المقبول", "Acceptable use", "Utilisation acceptable"], ["يُمنع انتحال الآخرين، أو كتابة أسماء مسيئة في اللوحة، أو محاولة اختراق الخدمة أو التلاعب بالنقاط، أو استعمال التطبيق لإساءة أو كراهية. نحتفظ بحق إزالة المحتوى المخالف وإيقاف الوصول إلى ميزات السحابة.", "You must not impersonate others, use offensive names on the leaderboard, try to hack the service or cheat with points, or use the app for abuse or hate. We may remove offending content and suspend access to cloud features.", "Il est interdit d’usurper une identité, d’utiliser des noms offensants au classement, de tenter de pirater le service ou de tricher sur les points, ou d’utiliser l’application pour des abus ou de la haine. Nous pouvons retirer les contenus fautifs et suspendre l’accès aux fonctions cloud."]], [["المسؤولية", "Liability", "Responsabilité"], ["يُقدَّم التطبيق «كما هو» دون ضمانات، وفي الحدود التي يسمح بها القانون لا نتحمل مسؤولية أضرار غير مباشرة أو انقطاع الخدمة. لا يُقيَّد أي حق إلزامي تمنحه لك قوانين حماية المستهلك في بلدك.", "The app is provided “as is” without warranties and, to the extent the law permits, we are not liable for indirect damages or service interruptions. Nothing limits any mandatory right you have under consumer law in your country.", "L’application est fournie « en l’état » sans garantie et, dans les limites de la loi, nous déclinons toute responsabilité pour les dommages indirects ou interruptions. Rien ne limite les droits impératifs dont vous bénéficiez en droit de la consommation dans votre pays."]], [["القانون والتواصل", "Governing law and contact", "Droit applicable et contact"], ["تخضع هذه الشروط للقانون الجزائري، مع بقاء الحقوق الإلزامية للمقيمين في فرنسا والمملكة المتحدة وحقهم في اللجوء إلى محاكم بلدهم. لأي استفسار: [contact email]. قد نعدّل الشروط وننبّه إلى ذلك في التطبيق.", "These terms are governed by Algerian law, without affecting mandatory rights of residents of France and the UK, including the right to go to their local courts. Questions: [contact email]. We may update the terms and will notify you in the app.", "Ces conditions sont régies par le droit algérien, sans préjudice des droits impératifs des résidents de France et du Royaume-Uni, y compris la saisine des tribunaux de leur pays. Questions : [contact email]. Nous pouvons modifier les conditions et vous en informerons dans l’application."]]]};
