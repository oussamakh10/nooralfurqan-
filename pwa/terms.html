@media(prefers-color-scheme:dark){:root{--bg:#0b1d1a;--card:#122824;--fg:#f1e8cc;--mut:#b9b79b;--g:#0a2a28;--g2:#3fbf8a;--gold:#e2b94e;--line:#2c4a43}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1.02rem/1.95 "Segoe UI","Noto Naskh Arabic",Tahoma,system-ui,sans-serif}
.top{background:linear-gradient(180deg,#0f3b3a,#0a2a28);color:#f6e9c0;border-bottom:3px solid var(--gold);padding:18px 16px 22px}

.lang{display:inline-flex;border:1px solid rgba(246,233,192,.4);border-radius:999px;overflow:hidden}

.id{display:flex;align-items:center;gap:14px;margin-top:16px}
.id img{width:60px;height:60px;border-radius:16px;border:2px solid var(--gold);background:#0a2a28}
.id small{display:block;color:#e2b94e;letter-spacing:.04em;font-size:.88rem}
h1{margin:0;font-size:1.65rem;line-height:1.35;font-weight:800}
.meta{margin-top:12px;font-size:.88rem;color:#d8cfa6}
main{max-width:780px;margin:0 auto;padding:18px 16px 40px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 16px}
.tabs a{padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--fg);text-decoration:none;font-size:.9rem;background:var(--card)}
.tabs a[aria-current=page]{background:var(--g);color:#f6e9c0;border-color:var(--g)}
.toc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:18px}
.toc b{display:block;margin-bottom:4px;color:var(--g2)}
.toc ol{margin:0;padding-inline-start:22px;columns:2;column-gap:28px;font-size:.95rem;line-height:1.8}
@media(max-width:560px){.toc ol{columns:1}}
.toc a{color:var(--fg);text-decoration:none}.toc a:hover{text-decoration:underline}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 18px 14px;margin:0 0 14px}
h2{display:flex;align-items:center;gap:10px;margin:14px 0 4px;font-size:1.12rem;line-height:1.5;color:var(--g2)}
.no{flex:0 0 auto;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1c1503;font-size:.85rem;font-weight:800}
section p{margin:4px 0 0;text-align:justify;text-justify:inter-word;white-space:pre-line}
a{color:var(--g2)}
footer{max-width:780px;margin:0 auto;padding:0 16px 40px;color:var(--mut);font-size:.88rem;text-align:center;line-height:1.8}
footer .links{display:flex;gap:6px 16px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
footer hr{border:0;border-top:1px solid var(--line);margin:0 0 14px}
.em{direction:ltr;unicode-bidi:isolate;display:inline-block}
@media print{.top .bar,.tabs,.toc{display:none}body{background:#fff;color:#000}.top{background:none;color:#000;border-bottom:2px solid #000}.top .meta,.id small{color:#333}section{border:0;padding:0;break-inside:avoid}}</style></head><body>

لمخالف وإيقاف الوصول إلى ميزات السحابة.", "You must not impersonate others, use offensive names on the leaderboard, try to hack the service or cheat with points, or use the app for abuse or hate. We may remove offending content and suspend access to cloud features.", "Il est interdit d’usurper une identité, d’utiliser des noms offensants au classement, de tenter de pirater le service ou de tricher sur les points, ou d’utiliser l’application pour des abus ou de la haine. Nous pouvons retirer les contenus fautifs et suspendre l’accès aux fonctions cloud."]], [["المحتوى الذي تكتبه وطلبات الإزالة", "Content you write and takedown requests", "Contenu que vous rédigez et demandes de retrait"], ["الاسم الذي تكتبه ويظهر في اللوحة الأسبوعية يراه مستخدمون آخرون؛ تمنحنا إذنًا بعرضه داخل التطبيق فقط. نرشّح الأسماء المسيئة آليًا، ويمكن لأي مستخدم الإبلاغ عن اسم من اللوحة. إن كنت صاحب حق في نص أو تلاوة أو ترجمة أو أي محتوى في التطبيق وترى أنه يُستعمل دون إذن، فراسلنا على okheloufi30@gmail.com بذكر المحتوى وصفتك وسبب الاعتراض، ونراجع الطلب ونزيل المحتوى أو نوقف عرضه سريعًا ريثما يُبتّ فيه.", "The name you enter appears on the weekly leaderboard and is visible to other users; you grant us permission to show it inside the app only. Offensive names are filtered automatically and any user can report a name from the leaderboard. If you own rights in any text, recitation, translation or other content in the app and believe it is used without permission, write to okheloufi30@gmail.com with the content, your capacity and the reason for your objection; we review the request and remove or suspend the content promptly while it is examined.", "Le nom que vous saisissez apparaît au classement hebdomadaire et est visible des autres utilisateurs ; vous nous autorisez à l’afficher dans l’application uniquement. Les noms offensants sont filtrés automatiquement et tout utilisateur peut signaler un nom depuis le classement. Si vous détenez des droits sur un texte, une récitation, une traduction ou un autre contenu de l’application et estimez qu’il est utilisé sans autorisation, écrivez à okheloufi30@gmail.com en indiquant le contenu, votre qualité et le motif de votre objection ; nous examinons la demande et retirons ou suspendons rapidement le contenu pendant l’examen."]], [["المسؤولية", "Liability", "Responsabilité"], ["يُقدَّم التطبيق «كما هو» دون ضمانات، وفي الحدود التي يسمح بها القانون لا نتحمل مسؤولية أضرار غير مباشرة أو انقطاع الخدمة. لا يُقيَّد أي حق إلزامي تمنحه لك قوانين حماية المستهلك في بلدك.", "The app is provided “as is” without warranties and, to the extent the law permits, we are not liable for indirect damages or service interruptions. Nothing limits any mandatory right you have under consumer law in your country.", "L’application est fournie « en l’état » sans garantie et, dans les limites de la loi, nous déclinons toute responsabilité pour les dommages indirects ou interruptions. Rien ne limite les droits impératifs dont vous bénéficiez en droit de la consommation dans votre pays."]], [["القانون والتواصل", "Governing law and contact", "Droit applicable et contact"], ["تخضع هذه الشروط للقانون الجزائري، مع بقاء الحقوق الإلزامية للمقيمين في فرنسا والمملكة المتحدة وحقهم في اللجوء إلى محاكم بلدهم. لأي استفسار: okheloufi30@gmail.com. قد نعدّل الشروط وننبّه إلى ذلك في التطبيق.", "These terms are governed by Algerian law, without affecting mandatory rights of residents of France and the UK, including the right to go to their local courts. Questions: okheloufi30@gmail.com. We may update the terms and will notify you in the app.", "Ces conditions sont régies par le droit algérien, sans préjudice des droits impératifs des résidents de France et du Royaume-Uni, y compris la saisine des tribunaux de leur pays. Questions : okheloufi30@gmail.com. Nous pouvons modifier les conditions et vous en informerons dans l’application."]]]};
