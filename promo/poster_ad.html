<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><style>
@font-face{font-family:T;src:url(tajawal-800.woff);font-weight:800}
@font-face{font-family:T;src:url(tajawal-700.woff);font-weight:700}
@font-face{font-family:T;src:url(tajawal-500.woff);font-weight:500}
@font-face{font-family:Q;src:url(amiriquran-400.woff)}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;overflow:hidden;font-family:T,sans-serif;color:#f6efd6;position:relative;
background:radial-gradient(90% 60% at 50% 0,#1d6a58 0,#0e3a31 45%,#071a16 100%)}
body::before{content:"";position:absolute;inset:0;opacity:.9;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96' viewBox='0 0 96 96'><g fill='none' stroke='%23e6c473' stroke-opacity='.09' stroke-width='1.5'><rect x='20' y='20' width='56' height='56'/><rect x='20' y='20' width='56' height='56' transform='rotate(45 48 48)'/></g></svg>")}
.top{position:absolute;top:56px;inset-inline:0;display:flex;align-items:center;justify-content:center;gap:18px}
.top img{width:84px;height:84px;border-radius:22px;box-shadow:0 0 0 3px #e6c473}
.top b{font:800 44px T;color:#f0d68a}
h1{position:absolute;top:150px;inset-inline:60px;text-align:center;font:400 100px/1.3 Q;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.25)}
h1 em{font-style:normal;color:#f0d68a;display:block}
.sub{position:absolute;top:484px;inset-inline:90px;text-align:center;font:500 33px/1.55 T;color:#cfe3da}
.phones{position:absolute;top:610px;inset-inline:0;height:620px}
.ph{position:absolute;width:280px;height:600px;border-radius:44px;padding:9px;background:#05100d;box-shadow:0 0 0 3px #e6c473,0 30px 60px rgba(0,0,0,.55);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:36px;display:block}
.p1{left:80px;top:50px;transform:rotate(-7deg)}
.p2{left:390px;top:0;z-index:2;width:300px;height:640px}
.p3{right:80px;top:50px;transform:rotate(7deg)}
.cap{position:absolute;z-index:3;font:800 28px T;color:#0e3a31;background:linear-gradient(#f6e3a6,#e0b94f);padding:6px 22px;border-radius:999px;box-shadow:0 4px 0 #a07a1c;white-space:nowrap}
.c1{left:100px;top:700px}.c2{left:410px;top:670px}.c3{right:100px;top:700px}
.foot{position:absolute;bottom:34px;inset-inline:0;display:flex;justify-content:center;gap:16px;font:700 28px T}
.foot span{padding:10px 26px;border:2px solid rgba(230,196,115,.6);border-radius:999px;background:rgba(7,26,22,.7)}
</style><body>
<div class="top"><b>نور الفرقان</b><img src="logo.png"></div>
<h1>اقرأ القرآن بهدوء<em>وتعلّم دينك بمرح</em></h1>
<p class="sub">قراءة صامتة بحسناتٍ تُحسب لك، وعدّاد حسنات للآيات، ودروس وألعاب مع الهدهد</p>
<div class="phones">
<div class="ph p1"><img src="read.png"></div>
<div class="ph p3"><img src="home.png"></div>
<div class="ph p2"><img src="silent.png"></div>
</div>
<div class="foot"><span>مجاني</span><span>عربي · English · Français</span></div>
</body></html>
