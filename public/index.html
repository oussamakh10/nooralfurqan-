<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f3b3a"><link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"></head><body>
<title>نور الفرقان</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Reem+Kufi:wght@600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar + one scrolling page + fixed bottom tab bar (6 tabs) + mini audio player; lessons and games open as full-screen overlays. Background: fixed khatam (8-point star) lattice in green, black and pale gold. */
:root{
  --bg:#E6D3A0; --surface:#F8EDC8; --fg:#0B1E15; --muted:#46563E; --line:#C4A964;
  --accent:#0F7A4C; --accent-d:#0A5A37; --accent-soft:#CDE2B4; --on-accent:#FFFFFF;
  --gold:#D9A21B; --gold-d:#A87608; --flame:#E8661A;
  --ok-bg:#DCF2D8; --ok-fg:#0A5A37; --bad-bg:#FBE1DC; --bad-fg:#A92B2B; --bad:#D9443F; --bad-d:#A92E2A;
  --lock:#D8C88C; --lock-d:#BFAC6C;
  --pat:rgba(8,86,52,.34); --pat2:rgba(150,104,6,.52); --arch:#0A6A40; --arch2:#06382A;
  --c1:#0F7A4C; --c1d:#0A5A37; --c2:#1C7E9E; --c2d:#12607A; --c3:#B87310; --c3d:#8C5508; --c4:#6F52C4; --c4d:#523C99;
  --hp-body:#D8702A; --hp-belly:#F7DDAE; --hp-dark:#17110F; --hp-beak:#3A2B25; --hp-feet:#C4601C;
  --display:'Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;
  --kufi:'Reem Kufi','Baloo Bhaijaan 2','Segoe UI',Tahoma,sans-serif;
  --quran:'Amiri Quran','Traditional Arabic','Scheherazade New',serif;
  --text:'Tajawal','Segoe UI',Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#040B07; --surface:#0C1A12; --fg:#F3EBC6; --muted:#A3B49E; --line:#1D3727;
  --accent:#3BC88A; --accent-d:#1F8F5E; --accent-soft:#17382A; --on-accent:#06261A;
  --gold:#F2C14A; --gold-d:#B98615; --flame:#FF8A3D;
  --ok-bg:#173A2A; --ok-fg:#7DE0B0; --bad-bg:#40201F; --bad-fg:#FF9C98; --bad:#FF6B66; --bad-d:#B8423D;
  --lock:#1F3329; --lock-d:#2B4538;
  --pat:rgba(59,200,138,.24); --pat2:rgba(242,193,74,.34); --arch:#0F4A31; --arch2:#071F15;
  --c1:#3BC88A; --c1d:#1F8F5E; --c2:#4DB8D8; --c2d:#2A86A3; --c3:#F0A93E; --c3d:#B97C1F; --c4:#A18BF0; --c4d:#7560C4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#040B07; --surface:#0C1A12; --fg:#F3EBC6; --muted:#A3B49E; --line:#1D3727;
  --accent:#3BC88A; --accent-d:#1F8F5E; --accent-soft:#17382A; --on-accent:#06261A;
  --gold:#F2C14A; --gold-d:#B98615; --flame:#FF8A3D;
  --ok-bg:#173A2A; --ok-fg:#7DE0B0; --bad-bg:#40201F; --bad-fg:#FF9C98; --bad:#FF6B66; --bad-d:#B8423D;
  --lock:#1F3329; --lock-d:#2B4538;
  --pat:rgba(59,200,138,.24); --pat2:rgba(242,193,74,.34); --arch:#0F4A31; --arch2:#071F15;
  --c1:#3BC88A; --c1d:#1F8F5E; --c2:#4DB8D8; --c2d:#2A86A3; --c3:#F0A93E; --c3d:#B97C1F; --c4:#A18BF0; --c4d:#7560C4;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:400 16px/1.7 var(--text);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
html.lock,html.lock body{overflow:hidden}
button,select,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance}
a{color:var(--accent-d)}
.bgpat{position:fixed;inset:0;z-index:0;pointer-events:none}
.bgpat svg{width:100%;height:100%;display:block}
.pl{fill:none;stroke:var(--pat);stroke-width:1.4}
.pg{fill:var(--pat2);stroke:none}
.wrap{position:relative;z-index:1;max-width:560px;margin-inline:auto;padding-bottom:150px}
.muted{color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:2px solid var(--line);max-width:560px;margin-inline:auto}
.topwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font:700 1.55rem/1 var(--kufi)}
.brand svg{width:36px;height:36px}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:6px;font:700 1rem var(--display);font-variant-numeric:tabular-nums;padding:2px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line)}
.chip svg{width:20px;height:20px}

/* tab bar */
#nav{position:fixed;z-index:8;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border-top:2px solid var(--line);
  padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-right,0px))}
#nav button{background:none;border:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;color:var(--muted);font:700 .66rem/1.3 var(--text);min-width:0}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#nav button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

/* mini player + toast */
#mini{position:fixed;z-index:7;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));padding:0 max(10px,env(safe-area-inset-left,0px)) 0 max(10px,env(safe-area-inset-right,0px))}
#mini[hidden]{display:none}
.mini{max-width:540px;margin-inline:auto;background:var(--arch2);color:#F6EFCB;border:2px solid var(--gold);border-radius:18px;padding:8px 12px;display:grid;gap:4px}
.mini .r1{display:flex;align-items:center;gap:8px}
.mini .tt{flex:1;min-width:0}
.mini b{display:block;font:700 .98rem/1.3 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{display:block;opacity:.85;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini button{background:none;border:0;color:inherit;display:grid;place-items:center;padding:4px;border-radius:10px}
.mini button svg{width:26px;height:26px;fill:currentColor}
.mini .pp{background:var(--gold);color:#2B2000;border-radius:50%;width:40px;height:40px}
.mini input[type=range]{width:100%;accent-color:var(--gold);margin:0;height:14px}
.mini .err{font-size:.82rem;color:#FFD9A8}
.mini .err a{color:#fff}
#toast{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:14px;font-weight:700;max-width:88vw;text-align:center}
#toast[hidden]{display:none}

/* shared bits */
.sec{margin-top:26px;display:grid;gap:12px}
.sec>h2{font-size:1.35rem;display:flex;align-items:center;gap:10px}
.sec>h2::after{content:"";flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,transparent 6px 12px);opacity:.7}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.btn{display:block;width:100%;background:var(--accent);color:var(--on-accent);border:0;border-bottom:5px solid var(--accent-d);border-radius:16px;padding:10px 20px;font:700 1.1rem/1.5 var(--display);text-align:center;text-decoration:none}
.btn:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{background:var(--lock);color:var(--muted);border-bottom-color:var(--lock-d);cursor:not-allowed}
.btn.bad{background:var(--bad);border-bottom-color:var(--bad-d);color:#fff}
.btn.gold{background:var(--gold);border-bottom-color:var(--gold-d);color:#2B2000}
.btn.ghost{background:var(--surface);color:var(--fg);border:2px solid var(--line);border-bottom-width:5px}
.btn.sm{padding:4px 14px;font-size:.95rem;border-radius:12px;border-bottom-width:4px;width:auto;display:inline-block}
.pill{display:inline-block;padding:0 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent-d);font-weight:700;font-size:.82rem}
:root[data-theme="dark"] .pill{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill{color:var(--accent)}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--lock);padding:4px;border-radius:16px}
.seg button{background:none;border:0;border-radius:12px;padding:6px 4px;font:700 .92rem/1.3 var(--text);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line)}
.opts2{display:flex;flex-wrap:wrap;gap:8px}
.tag{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:2px 14px;font:700 .95rem var(--text)}
.tag[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.field{display:grid;gap:6px}
.field label,.lbl{font:700 .95rem var(--display)}
select,input[type=text],input[type=search]{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:1rem}

/* hero */
.hero{margin-top:18px;text-align:center;display:grid;justify-items:center;gap:10px}
.arch{width:min(100%,320px);padding:28px 18px 18px;border-radius:999px 999px 28px 28px;background:linear-gradient(180deg,var(--arch),var(--arch2));border:3px solid var(--gold);box-shadow:0 0 0 6px var(--bg),0 0 0 8px var(--gold);display:grid;justify-items:center;gap:2px;color:#F6EFCB}
.arch h1{font:700 3rem/1.1 var(--kufi);color:#FFE9A0}
.arch p{font-size:.95rem;opacity:.92}
.hero .lead{max-width:34ch;font-size:1.05rem}
.hero .cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:380px}
.feat{display:grid;gap:4px}
.feat b{font:700 1.05rem var(--display)}
.feat span{font-size:.92rem;color:var(--muted);line-height:1.6}
.feat .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-d)}
.feat .ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:root[data-theme="dark"] .feat .ic{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .feat .ic{color:var(--accent)}}
.steps{display:grid;gap:10px;counter-reset:s}
.steps li{list-style:none;display:flex;gap:12px;align-items:flex-start}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:34px;height:34px;display:grid;place-items:center;background:var(--gold);color:#2B2000;font:800 1rem var(--display);clip-path:polygon(50% 0,62% 18%,82% 18%,82% 38%,100% 50%,82% 62%,82% 82%,62% 82%,50% 100%,38% 82%,18% 82%,18% 62%,0 50%,18% 38%,18% 18%,38% 18%)}
.steps{padding:0;margin:0}
.src{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:.93rem}
.creator{display:flex;align-items:center;gap:14px}
.creator .nm{font:700 1.5rem var(--kufi)}

/* learn path */
.say{display:flex;align-items:center;gap:12px;margin:18px 0 8px}
.say .mas{flex:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:500;min-width:0}
.bubble::before{content:"";position:absolute;top:50%;right:-9px;width:14px;height:14px;background:var(--surface);border-top:2px solid var(--line);border-right:2px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.mas svg{display:block}
.unit{margin-top:26px}
.banner{border-radius:20px;padding:14px 18px;background:var(--uc);color:var(--on-accent);border-bottom:5px solid var(--ucd)}
.banner small{display:block;font-weight:700;opacity:.9;letter-spacing:.02em}
.banner h2{font-size:1.35rem;line-height:1.3;margin-top:2px}
.banner p{font-size:.95rem;opacity:.95;margin-top:2px}
.u1{--uc:var(--c1);--ucd:var(--c1d)}.u2{--uc:var(--c2);--ucd:var(--c2d)}.u3{--uc:var(--c3);--ucd:var(--c3d)}.u4{--uc:var(--c4);--ucd:var(--c4d)}
.path{display:flex;flex-direction:column;align-items:center;gap:20px;padding:26px 0 4px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;transform:translateX(var(--off,0px));position:relative}
.node{width:76px;height:76px;border-radius:50%;border:0;background:var(--uc);color:var(--on-accent);border-bottom:7px solid var(--ucd);display:grid;place-items:center;transition:transform .12s}
.node:active{transform:translateY(4px);border-bottom-width:3px}
.node svg{width:34px;height:34px}
.node.lock{background:var(--lock);border-bottom-color:var(--lock-d);color:var(--muted);cursor:not-allowed}
.node.cur{animation:pulse 1.8s ease-in-out infinite;box-shadow:0 0 0 8px color-mix(in srgb,var(--uc) 25%,transparent)}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--uc) 10%,transparent)}}
.nlabel{font:700 .95rem/1.3 var(--display);text-align:center;max-width:150px}
.start{position:absolute;top:-34px;font:800 .9rem var(--display);background:var(--surface);color:var(--uc);border:2px solid var(--line);border-radius:12px;padding:0 12px;white-space:nowrap}
.fine{margin-top:30px;color:var(--muted);font-size:.88rem;text-align:center}

/* reading */
.slist{display:grid;gap:8px}
.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:8px 12px}
.num{flex:none;width:44px;height:44px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-d);font:700 .95rem var(--display);clip-path:polygon(50% 0,62% 18%,82% 18%,82% 38%,100% 50%,82% 62%,82% 82%,62% 82%,50% 100%,38% 82%,18% 82%,18% 62%,0 50%,18% 38%,18% 18%,38% 18%)}
:root[data-theme="dark"] .num{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .num{color:var(--accent)}}
.srow b{display:block;font:700 1.25rem/1.4 var(--quran)}
.srow small{color:var(--muted)}
.rhead{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.rhead h2{flex:1;font:700 1.9rem/1.3 var(--quran);text-align:center}
.iconbtn{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:6px 10px;display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bsm{text-align:center;font:400 1.7rem/2 var(--quran);margin:6px 0 10px}
.ay{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.ay.on{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 35%,transparent)}
.ayt{font:400 1.75rem/2.3 var(--quran);text-align:justify;text-wrap:pretty}
.no{padding:0;cursor:pointer;display:inline-grid;place-items:center;min-width:2.1rem;height:2.1rem;margin-inline:.35rem;font:700 .85rem var(--display);color:var(--gold-d);border:2px solid var(--gold);border-radius:50%;vertical-align:middle;background:transparent}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.acts button{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:0 12px;font:700 .88rem/2 var(--text)}
.acts button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tf{margin-top:10px;padding:10px 12px;border-radius:14px;background:var(--accent-soft);border:2px dashed var(--line);font-size:1rem;line-height:1.9}
.tf h4{font-size:.95rem;margin-bottom:4px;color:var(--accent-d)}
:root[data-theme="dark"] .tf h4{color:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tf h4{color:var(--accent)}}
.tf p{white-space:pre-line}

/* listening */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.rc{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:6px 10px;text-align:start;font:700 .9rem/1.4 var(--text)}
.rc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rc i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 .75rem var(--display);font-style:normal}
.lv{max-height:340px;overflow-y:auto;display:grid;gap:6px;padding:2px}
.lv button{text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:4px 12px;font:400 1.35rem/2 var(--quran)}
.lv button.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--surface))}
.had{display:grid;gap:8px}
.had p.t{font:400 1.45rem/2.1 var(--quran)}
.had small{color:var(--muted)}

/* achievements */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{border:2px solid var(--line);border-radius:16px;background:var(--surface);padding:8px 14px;text-align:center}
.stat b{display:block;font:800 1.55rem var(--display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.85rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:grid;gap:2px;justify-items:center;font:700 .8rem var(--text);color:var(--muted)}
.week i{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent}
.week i svg{width:18px;height:18px}
.week .on i{background:var(--flame);border-color:var(--flame);color:#fff}
.week .now i{outline:3px solid var(--gold);outline-offset:2px}
.ch{display:grid;gap:6px}
.ch .row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ch b{font:700 1rem/1.4 var(--display)}
.pbar{height:12px;border-radius:99px;background:var(--lock);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pbar.gold i{background:var(--gold)}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.bd{text-align:center;display:grid;justify-items:center;gap:4px;padding:10px 6px;border-radius:16px;border:2px solid var(--line);background:var(--surface)}
.bd .med{width:58px;height:58px;display:grid;place-items:center;background:var(--gold);color:#2B2000;clip-path:polygon(50% 0,62% 18%,82% 18%,82% 38%,100% 50%,82% 62%,82% 82%,62% 82%,50% 100%,38% 82%,18% 82%,18% 62%,0 50%,18% 38%,18% 18%,38% 18%)}
.bd .med svg{width:26px;height:26px}
.bd.off .med{background:var(--lock);color:var(--muted)}
.bd.off{opacity:.8}
.bd b{font:700 .95rem/1.3 var(--display)}
.bd small{color:var(--muted);font-size:.78rem;line-height:1.4}

/* lesson + game overlay */
#lesson{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#lesson[hidden]{display:none}
.ltop{display:flex;align-items:center;gap:14px;max-width:560px;width:100%;margin-inline:auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-right,0px))}

  {q:'ماذا يعني اسم الله «البصير»؟',c:'يرى كل شيء ولا يخفى عليه شيء',w:['يرى في النهار دون الليل','يرى الأعمال الظاهرة فقط','يرى الكبائر دون الصغائر'],n:'الله يرى كل شيء، حتى النملة السوداء في الليلة الظلماء.'},
  {q:'ما الذي نتعلمه من إيماننا بأن الله «الرزاق»؟',c:'نسعى بالأسباب ونعتمد على الله',w:['نترك العمل ونجلس','نعتمد على أنفسنا فقط','نقلق دائمًا من الفقر'],n:'الرزق بيد الله، ونُؤمر بالسعي والأخذ بالأسباب مع التوكل عليه.'},
  {q:'ما اسم الله الذي يعني «القريب من عباده بعلمه وإجابته»؟',c:'القريب',w:['البعيد','المتعالي','الباطن فقط'],n:'قال تعالى: ﴿فَإِنِّي قَرِيبٌ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ﴾.'},
  {q:'اسم الله «المجيب» يدل على أنه سبحانه',c:'يستجيب دعاء من دعاه',w:['يجيب العلماء فقط','لا يجيب إلا في رمضان','يرد على كل الأسئلة بالكلام'],n:'الله يجيب الداعي بما فيه الخير له، إما بتحقيق المطلوب أو صرف السوء أو الادخار للآخرة.'},
  {q:'ما اسم الله الذي يعني الرقيب الذي يراقب أعمال العباد؟',c:'الرقيب',w:['الوهاب','الرزاق','الغفور'],n:'الرقيب هو الحفيظ العليم بأحوال خلقه، فيستحي المسلم من معصية ربه.'},
  {q:'من يملك خزائن الرزق؟',c:'الله وحده',w:['الملوك والأغنياء','الملائكة','الأسباب وحدها'],n:'الله هو الرزاق، وما الأسباب إلا وسائل بإذنه.'},
  {q:'إذا آمنت أن الله «السميع» فما أثر ذلك عليك؟',c:'أحفظ لساني وأدعو ربي بثقة',w:['لا أحتاج للدعاء','أرفع صوتي بالدعاء دائمًا','أتكلم بما أشاء بلا حساب'],n:'من علم أن الله يسمعه حفظ لسانه وأحسن دعاءه.'},
  {q:'ما اسم الله الذي يعني الوهّاب؟',c:'كثير العطاء والهبات بلا مقابل',w:['كثير المنع والحجب','الذي يأخذ ما أعطى','الذي يحاسب على كل عطية'],n:'الوهاب هو الذي يعطي عباده عطايا كثيرة بلا عوض.'}
 ]},
 {id:'A03',title:'الحكيم العليم العزيز الجبار',qs:[
  {q:'ما معنى اسم الله «العليم»؟',c:'الذي أحاط علمه بكل شيء',w:['الذي يعلم الظاهر فقط','الذي علّم الملائكة فقط','الذي يعلم ما مضى دون ما سيأتي'],n:'علم الله محيط بالماضي والحاضر والمستقبل وبالظاهر والباطن.'},
  {q:'ماذا يعني اسم الله «الحكيم»؟',c:'يضع الأشياء في مواضعها وله الحكمة في أمره وخلقه',w:['يفعل ما يشاء بلا سبب','يحكم بين الناس فقط','لا يخلق شيئًا عبثًا إلا قليلًا'],n:'كل ما يقدّره الله وما يشرّعه له حكمة بالغة، عرفناها أو لم نعرفها.'},
  {q:'اسم الله «العزيز» يعني',c:'الغالب الذي لا يُغلب',w:['الغالي الثمن','القليل الوجود','الذي يحتاج إلى مساعدة'],n:'العزة لله جميعًا، فهو القوي الغالب الذي لا يغلبه أحد.'},
  {q:'ما معنى اسم الله «الجبار»؟',c:'القاهر الذي يجبر الكسر ويصلح الأحوال',w:['الذي لا يرحم أحدًا','الذي يتكبر على الفقراء','الذي يجبر الناس على الإيمان'],n:'الجبار من أسمائه سبحانه ومن معانيه جبر كسر القلوب وقهر الخلق بعزّته.'},
  {q:'أي الأسماء التالية يدل على قوة الله؟',c:'القوي المتين',w:['الودود الشكور','الحليم الصبور','الكريم الستار'],n:'قال تعالى: ﴿إِنَّ اللَّهَ هُوَ الرَّزَّاقُ ذُو الْقُوَّةِ الْمَتِينُ﴾.'},
  {q:'اسم الله «الخبير» يعني',c:'العالم ببواطن الأمور ودقائقها',w:['الذي يخبر الناس بالغيب','الذي يعمل بيده','الذي يعلم الظاهر فقط'],n:'الخبير هو الذي لا تخفى عليه خافية، ويقترن غالبًا بـ«اللطيف».'},
  {q:'ما اسم الله الذي يدل على أنه مالك الملك كله؟',c:'الملك',w:['المخلّد','الودود','الحميد'],n:'الله هو الملك الحق الذي له الملك كله وبيده كل شيء.'},
  {q:'ماذا يعني اسم الله «السلام»؟',c:'السالم من كل عيب ونقص',w:['الذي يتكلم بالسلام فقط','الذي يعطي المال للناس','الذي لا يغضب أبدًا'],n:'السلام يدل على كمال الله وتنزّهه عن كل عيب ونقص.'},
  {q:'كيف نعرف أن الله «اللطيف»؟',c:'يوصل الخير لعباده بطرق خفية دقيقة',w:['يعاقب الناس دون علم','لا يظهر خلقه لأحد','يخلق الأشياء الضعيفة فقط'],n:'اللطيف هو الرفيق بعباده يوصل إليهم مصالحهم من حيث لا يشعرون.'},
  {t:'ord',q:'رتّب هذه الأسماء من الإيمان بعلم الله إلى الإيمان بقدرته (كما وردت في السؤال)',items:['العليم','الخبير','القدير','القهار'],n:'هذه الأسماء كلها من أسماء الله الحسنى، فمنها ما يتعلق بالعلم ومنها ما يتعلق بالقدرة.'}
 ]},
 {id:'A04',title:'التوحيد: الربوبية والألوهية',qs:[
  {q:'ما معنى التوحيد؟',c:'إفراد الله بالعبادة وأنه لا شريك له',w:['الاعتقاد بأن لله ولدًا','عبادة الله والأنبياء معًا','الإيمان بالقرآن فقط'],n:'التوحيد هو أصل الدين وأساس دعوة جميع الرسل.'},
  {q:'توحيد الربوبية معناه الإيمان بأن',c:'الله وحده الخالق الرازق المدبّر',w:['الله وحده يُعبد دون سواه','لله أسماء حسنى فقط','القرآن كلام الله فقط'],n:'الربوبية تتعلق بأفعال الله من الخلق والرزق والتدبير.'},
  {q:'توحيد الألوهية معناه',c:'إفراد الله بجميع أنواع العبادة',w:['الإيمان بأن الله هو الخالق فقط','تسمية الله بأسمائه فقط','الاعتقاد بأن الكون قديم'],n:'الألوهية تتعلق بأفعال العباد، كالدعاء والصلاة والذبح والتوكل، فتكون لله وحده.'},
  {q:'أي مما يلي من توحيد الألوهية؟',c:'أن ندعو الله وحده ونتوكل عليه',w:['أن نؤمن بأن الله خلق الشمس','أن نعلم أن الله يرزقنا','أن نؤمن أن الله يحيي ويميت'],n:'الدعاء والتوكل عبادة لا تُصرف إلا لله.'},
  {q:'ما أول ما دعا إليه جميع الرسل؟',c:'عبادة الله وحده',w:['بناء المدن','قتال الأمم','جمع الأموال'],n:'قال تعالى: ﴿وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ﴾.'},
  {q:'ما الآية التي تنفي المثيل عن الله؟',c:'﴿لَيْسَ كَمِثْلِهِ شَيْءٌ﴾',w:['﴿كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ﴾','﴿إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ﴾','﴿وَاعْتَصِمُوا بِحَبْلِ اللَّهِ﴾'],n:'الآية من سورة الشورى (11).'},
  {q:'أي سورة تُسمّى سورة الإخلاص وتبيّن التوحيد؟',c:'سورة الإخلاص',w:['سورة الكافرون','سورة الفلق','سورة المسد'],n:'تبدأ بقوله تعالى: ﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾.'},
  {q:'كان مشركو مكة يقرّون بأن',c:'الله هو الخالق لكنهم عبدوا معه غيره',w:['الله لا وجود له','الله له شريك في الخلق','لا خالق لهذا الكون'],n:'أقرّوا بالربوبية ولم يوحّدوا الله في العبادة، فلم يدخلوا في الإسلام.'},
  {q:'ما الجملة التي تُعبّر عن التوحيد؟',c:'لا إله إلا الله',w:['سبحان الله وبحمده','الله أكبر كبيرًا','لا حول ولا قوة إلا بالله'],n:'معناها: لا معبود بحق إلا الله، وهي كلمة التوحيد.'},
  {q:'من أنواع التوحيد أيضًا توحيد الأسماء والصفات، ومعناه',c:'إثبات ما أثبته الله لنفسه من الأسماء والصفات دون تشبيه',w:['تسمية الله بأسماء من عندنا','تشبيه الله بخلقه','إنكار أسماء الله'],n:'نثبت ما ورد في القرآن والسنة مع تنزيه الله عن مشابهة المخلوقين.'}
 ]},
 {id:'A05',title:'الشرك وأنواعه',qs:[
  {q:'ما هو الشرك؟',c:'أن يُجعل لله شريك في ربوبيته أو عبادته',w:['الإكثار من الصلاة','الخوف من عذاب الله','الدعاء لله بصوت خفيض'],n:'الشرك أعظم الذنوب وهو ضد التوحيد.'},
  {q:'ما أعظم الذنوب عند الله؟',c:'الشرك بالله',w:['الكذب في المزاح','تأخير الصلاة نسيانًا','الغضب'],n:'سُئل النبي ﷺ: أي الذنب أعظم؟ قال: «أن تجعل لله ندًّا وهو خلقك» رواه البخاري ومسلم.'},
  {q:'قال لقمان لابنه: ﴿إِنَّ الشِّرْكَ لَظُلْمٌ …﴾ ما تتمة الآية؟',c:'عَظِيمٌ',w:['صَغِيرٌ','قَلِيلٌ','يَسِيرٌ'],n:'الآية من سورة لقمان (13)، فالشرك ظلم عظيم لأن فيه صرف حق الله لغيره.'},
  {q:'من أنواع الشرك الأصغر',c:'الرياء، وهو العمل ليراه الناس',w:['عبادة الأصنام','الاستغفار','الإحسان إلى الجار'],n:'الرياء أن يعمل المسلم الطاعة ليمدحه الناس، وهو يُفسد العمل.'},
  {q:'مثال على الشرك الأكبر',c:'دعاء غير الله والاستغاثة به كما يُستغاث بالله',w:['الحلف بالله صادقًا','التوكل على الله مع الأخذ بالأسباب','طلب الدعاء من أخ مسلم حي'],n:'الدعاء عبادة، من صرفها لغير الله فقد أشرك.'},
  {q:'هل يغفر الله الشرك لمن مات عليه دون توبة؟',c:'لا يغفره',w:['يغفره في الآخرة دائمًا','يغفره إن صلى كثيرًا','يغفره إن كان قليلًا'],n:'قال تعالى إن الله لا يغفر أن يُشرك به ويغفر ما دون ذلك لمن يشاء (سورة النساء).'},
  {q:'أي مما يلي يُنافي التوحيد؟',c:'عبادة الأصنام والأحجار',w:['الاستعانة بالأطباء','العمل للرزق','الدعاء للوالدين'],n:'العبادة حق خالص لله، وعبادة غيره شرك أكبر.'},
  {q:'كيف نحمي أنفسنا من الشرك؟',c:'بتعلّم التوحيد والإخلاص لله في كل عمل',w:['بالابتعاد عن العلم','بتقليد الناس','بترك السؤال عن الدين'],n:'العلم بالتوحيد والإخلاص يحميان المسلم من الشرك.'},
  {q:'ما معنى الإخلاص في العمل؟',c:'أن يكون العمل لوجه الله وحده',w:['أن يكون العمل كثيرًا','أن يراه الناس','أن يكون سريعًا'],n:'قال النبي ﷺ: «إنما الأعمال بالنيات» متفق عليه.'},
  {t:'ord',q:'رتّب الأعمال من الأقل ضررًا على التوحيد إلى الأعظم',items:['الرياء في بعض الأعمال','الاعتماد على الأسباب دون النظر إلى الله','دعاء غير الله من دونه','عبادة صنم'],n:'الرياء شرك أصغر وهو أقل من الشرك الأكبر الذي هو دعاء غير الله وعبادة الأصنام، والاعتماد على الأسباب وحدها قادح في التوكل.'}
 ]},
 {id:'A06',title:'من آثار رحمة الله',qs:[
  {q:'ما أعظم مظاهر رحمة الله بالعباد؟',c:'إرسال الرسل وإنزال الكتب',w:['كثرة الأموال','طول العمر','سرعة السفر'],n:'قال تعالى عن النبي ﷺ: ﴿وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِلْعَالَمِينَ﴾.'},
  {q:'ماذا قال الله في الحديث القدسي عن رحمته وغضبه؟',c:'إن رحمتي سبقت غضبي',w:['إن غضبي سبق رحمتي','إن رحمتي لا تشمل الجميع','إن غضبي يساوي رحمتي'],n:'رواه البخاري ومسلم عن أبي هريرة.'},
  {q:'كم جزءًا من الرحمة أنزل الله إلى الأرض؟',c:'جزءًا واحدًا من مئة جزء',w:['نصفها','عشرة أجزاء','تسعة وتسعين جزءًا'],n:'جاء في الصحيحين أن الله خلق مئة رحمة، فأنزل منها واحدة، بها يتراحم الخلق.'},
  {q:'ما مثال على رحمة الله في الدنيا؟',c:'رحمة الأم بولدها',w:['شدّة الجبار','طول الأمل','كثرة النسيان'],n:'الرحمة بين الخلق من أثر رحمة الله.'},
  {q:'ما الآية التي تنهى عن اليأس من رحمة الله؟',c:'﴿لَا تَقْنَطُوا مِنْ رَحْمَةِ اللَّهِ﴾',w:['﴿فَلَا تَخَافُوا الْعَقَابَ﴾','﴿وَلَا تَرْحَمُوا الظَّالِمِينَ﴾','﴿لَا تَدْعُوا رَبَّكُمْ﴾'],n:'الآية في سورة الزمر (53).'},
  {q:'من مظاهر رحمة الله بنا أنه',c:'يضاعف الحسنات ويقبل التوبة',w:['يحاسب على النوايا فقط','يعاقب على كل خطأ فورًا','لا يقبل العمل القليل'],n:'الحسنة تُضاعف إلى عشر أمثالها وأكثر، والتوبة تمحو السيئات.'},
  {q:'ما أثر معرفة رحمة الله في سلوكنا؟',c:'نرحم الخلق ونرجو ربنا ونخاف عذابه',w:['نترك العمل اتكالًا','نقسو على الناس','نيأس من أنفسنا'],n:'قال النبي ﷺ: «الراحمون يرحمهم الرحمن» رواه أبو داود والترمذي.'},
  {q:'هل رحمة الله للمؤمنين فقط في الدنيا؟',c:'لا، تشمل الخلق كلهم في الدنيا',w:['نعم، للمؤمنين فقط','نعم، للمتقين فقط','لا، تشمل الإنس فقط'],n:'الله يرزق الكافر والمؤمن في الدنيا، والرحمة الخاصة في الآخرة للمؤمنين.'},
  {q:'ما الذي يجمع بين الخوف والرجاء عند المسلم؟',c:'يخاف عقاب الله ويرجو رحمته',w:['يخاف فقط','يرجو فقط','لا يخاف ولا يرجو'],n:'العبد كالطائر بجناحين: الخوف والرجاء، فيعمل ويحسن الظن بربه.'},
  {q:'متى تظهر رحمة الله العظمى بعباده؟',c:'يوم القيامة بدخول الجنة',w:['عند أول ذنب','في الدنيا فقط','عند الموت فقط'],n:'قال النبي ﷺ: «لن يدخل أحدًا عملُه الجنة...» قالوا ولا أنت؟ قال: «ولا أنا إلا أن يتغمدني الله برحمة» متفق عليه.'}
 ]}
]},
{title:'تفصيل أركان الإيمان',sub:'الإيمان بالله وملائكته وكتبه ورسله',lessons:[
 {id:'A07',title:'الإيمان بالملائكة',qs:[
  {q:'مم خُلقت الملائكة؟',c:'من نور',w:['من طين','من نار','من ماء'],n:'قال النبي ﷺ: «خُلقت الملائكة من نور...» رواه مسلم.'},
  {q:'من الملَك الموكّل بنقل الوحي إلى الأنبياء؟',c:'جبريل عليه السلام',w:['ميكائيل','إسرافيل','مالك'],n:'جبريل هو الروح الأمين الذي نزل بالقرآن على النبي ﷺ.'},
  {q:'من الملَك الموكّل بالنفخ في الصور؟',c:'إسرافيل',w:['جبريل','ميكائيل','عزرائيل فقط بحسب القرآن'],n:'ورد في الأحاديث أن إسرافيل ينفخ في الصور، وهو من الملائكة المقرّبين.'},
  {q:'من الملك الذي يتوفى الأرواح؟',c:'ملك الموت',w:['مالك','رضوان','ميكائيل'],n:'قال تعالى: ﴿قُلْ يَتَوَفَّاكُمْ مَلَكُ الْمَوْتِ الَّذِي وُكِّلَ بِكُمْ﴾.'},
  {q:'ماذا يكتب الكرام الكاتبون؟',c:'أعمال العباد من خير وشر',w:['الأرزاق فقط','الأحلام','الأخبار العامة'],n:'قال تعالى: ﴿وَإِنَّ عَلَيْكُمْ لَحَافِظِينَ كِرَامًا كَاتِبِينَ﴾.'},
  {q:'ما صفة الملائكة في طاعة الله؟',c:'لا يعصون الله ما أمرهم ويفعلون ما يؤمرون',w:['يعصون أحيانًا','يختارون ما يُطاعون فيه','يأكلون ويشربون كالبشر'],n:'قال تعالى: ﴿لَا يَعْصُونَ اللَّهَ مَا أَمَرَهُمْ وَيَفْعَلُونَ مَا يُؤْمَرُونَ﴾.'},

  {q:'كيف وُصف الرجل السائل في أول الحديث؟',c:'شديد بياض الثياب شديد سواد الشعر لا يُرى عليه أثر السفر ولا يعرفه منا أحد',w:['عليه أثر السفر ويعرفه الصحابة','أشعث الرأس عليه ثياب رثة','كبير السن ظاهر الضعف'],n:'وهذا مما أشكل على الصحابة حتى أخبرهم النبي بحقيقته.'},

  {q:'إذا اجتمع لفظا الإسلام والإيمان في نص واحد فالمشهور عند العلماء أن:',c:'الإسلام يُفسَّر بالأعمال الظاهرة والإيمان بالأمور الباطنة',w:['الإيمان للأعمال الظاهرة والإسلام للباطنة','الإسلام لغير العرب والإيمان للعرب','معناهما واحد دائمًا'],n:'ويُقال: إذا اجتمعا افترقا، وإذا افترقا اجتمعا، كما في حديث جبريل.'}
 ]},

  {q:'في أي شيء نزلت آية «يُثَبِّتُ اللَّهُ الَّذِينَ آمَنُوا بِالْقَوْلِ الثَّابِتِ» كما في الصحيحين؟',c:'في عذاب القبر وسؤال الملكين',w:['في الميزان','في الصراط','في الحوض'],n:'سورة إبراهيم 27.'},

  {q:'ما الصراط؟',c:'جسر منصوب على متن جهنم يمر عليه الناس',w:['ميزان توزن به الأعمال','ممر بين الجنة والبرزخ','سور بين الجنة والنار فقط'],n:'ثبت وصفه في حديث أبي سعيد الخدري المتفق عليه.'},
  {q:'ما المقام المحمود الذي وُعد به النبي صلى الله عليه وسلم في قوله «عَسَىٰ أَن يَبْعَثَكَ رَبُّكَ مَقَامًا مَّحْمُودًا»؟',c:'الشفاعة العظمى في أهل الموقف',w:['الشفاعة لأهل الكبائر فقط','الوسيلة في الجنة فقط','الحوض'],n:'هذا تفسير جمهور المفسرين، سورة الإسراء 79.'}
 ]}
]},

  {q:'من تيقّن الطهارة ثم شكّ هل أحدث، فبناءً على قاعدة «اليقين لا يزول بالشك» فإنه:',c:'يبني على أنه متطهر',w:['يعيد الوضوء وجوبًا','يترك الصلاة','يصلي ثم يعيد احتياطًا'],n:'«لا ينصرف حتى يسمع صوتًا أو يجد ريحًا» (متفق عليه).'},

 ]},

 ]}
]}

{title:'علوم الحديث',sub:'مصطلحات الحديث وأقسامه وكتبه ورواته',lv:'a',lessons:[
 {id:'v2_1',title:'المصطلحات الأساسية',qs:[
  {q:'ما تعريف «الحديث» عند المحدثين؟',c:'ما أُضيف إلى النبي صلى الله عليه وسلم من قول أو فعل أو تقرير أو صفة',w:['ما رواه الصحابة عن بعضهم من أقوال وأفعال','ما نزل به الوحي من القرآن خاصة','ما أُضيف إلى النبي صلى الله عليه وسلم من قول فقط'],n:'هذا هو التعريف المشهور في كتب مصطلح الحديث، ويدخل فيه الصفات الخَلقية والخُلُقية.'},
  {q:'ما المراد بـ«السنة» في اصطلاح المحدثين؟',c:'ما أُثر عن النبي صلى الله عليه وسلم من قول أو فعل أو تقرير أو صفة خَلقية أو خُلقية',w:['ما يثاب فاعله ولا يعاقب تاركه فحسب','ما أجمع عليه علماء المدينة','ما رواه الصحابة عن الخلفاء الراشدين'],n:'وللفقهاء والأصوليين اصطلاح آخر، فهي عندهم الحكم الشرعي المندوب أو الدليل الشرعي غير القرآن.'},
  {q:'أي المصطلحات يُطلق على ما جاء عن النبي صلى الله عليه وسلم وعن غيره من الصحابة والتابعين، وهو أعمّ في الاستعمال من الحديث عند بعضهم؟',c:'الخبر',w:['المتن','الإسناد','التخريج'],n:'يرى بعض العلماء أن الخبر أعم من الحديث، ويرى آخرون أنهما مترادفان.'},
  {q:'ما «الأثر» عند كثير من المحدثين؟',c:'ما رُوي عن الصحابة والتابعين من أقوال وأفعال',w:['ما رُوي بإسناد متصل إلى النبي صلى الله عليه وسلم فقط','ما أجمع على صحته أهل الحديث','ما رواه راوٍ واحد وانفرد به'],n:'ومنهم من يطلق الأثر على المرفوع أيضًا، والمسألة اصطلاحية.'},
  {q:'ما «السند» أو «الإسناد»؟',c:'سلسلة الرواة الموصلة إلى المتن',w:['ألفاظ الحديث التي تقوم بها المعاني','كتاب جمع فيه المؤلف أحاديث الصحابي الواحد','الحكم على الحديث بالصحة أو الضعف'],n:'سمي سندًا لاعتماد الحفاظ عليه في معرفة صحة الحديث، وقال ابن المبارك: الإسناد من الدين، ولولا الإسناد لقال من شاء ما شاء (مقدمة صحيح مسلم).'},
  {q:'ما «المتن» في الحديث؟',c:'ألفاظ الحديث التي تتقوم بها المعاني',w:['اسم الراوي الأول للحديث','سلسلة الرواة من المصنف إلى الصحابي','شرح العلماء للحديث وبيان غريبه'],n:'المتن هو ما ينتهي إليه السند من الكلام.'},
  {q:'من «المخرِّج» للحديث؟',c:'من ذكر الحديث في كتابه بإسناده',w:['من حكم على الحديث بالصحة','من سمع الحديث مباشرة من النبي صلى الله عليه وسلم','من شرح متن الحديث وبيّن غريبه'],n:'كقولهم: «رواه البخاري» أو «أخرجه مسلم»، والتخريج عزو الحديث إلى مصادره.'},
  {q:'ما تعريف «الصحابي» عند جمهور المحدثين؟',c:'من لقي النبي صلى الله عليه وسلم مؤمنًا به ومات على الإسلام',w:['من عاصر النبي صلى الله عليه وسلم ولم يره','من أسلم قبل الهجرة وهاجر إلى المدينة','من روى عن النبي صلى الله عليه وسلم عشرة أحاديث فأكثر'],n:'هذا تعريف ابن حجر في «نخبة الفكر» وغيره، ويشمل من رآه ولو لم يطل مجالسته.'},
  {q:'من «التابعي»؟',c:'من لقي صحابيًا مؤمنًا به ومات على الإسلام',w:['من عاصر النبي صلى الله عليه وسلم وأسلم بعد وفاته','من روى عن تابعي آخر','من حفظ القرآن في عهد الصحابة'],n:'ومن أدرك الجاهلية والإسلام ولم يلقَ النبي صلى الله عليه وسلم كأبي عثمان النهدي يسمى مخضرمًا.'},
  {q:'ما اسم الحديث الذي يُنسب إلى الصحابي من قوله أو فعله؟',c:'الموقوف',w:['المرفوع','المقطوع','المرسل'],n:'المرفوع ما أُضيف إلى النبي صلى الله عليه وسلم، والموقوف ما أُضيف إلى الصحابي، والمقطوع ما أُضيف إلى التابعي فمن دونه.'}
 ]},
 {id:'v2_2',title:'أقسام الخبر والصحيح والحسن',qs:[
  {q:'ما المتواتر؟',c:'ما رواه جمع تحيل العادة تواطؤهم على الكذب عن مثلهم إلى منتهاه',w:['ما رواه ثلاثة فأكثر في كل طبقة دون بلوغ التواتر','ما رواه راوٍ واحد في طبقة من طبقات السند','ما رواه اثنان فقط في كل طبقة'],n:'يفيد العلم الضروري عند جمهور العلماء، وهو غير مشروط بعدد معين على الراجح.'},
  {q:'ما حديث الآحاد؟',c:'ما لم تتوفر فيه شروط التواتر',w:['ما رواه راوٍ واحد فقط في كل طبقة','ما كان ضعيفًا لا يُحتج به','ما رواه الصحابة جميعًا'],n:'قد يرويه جمع من الرواة ويبقى آحادًا ما لم يبلغ حد التواتر، فيشمل المشهور والعزيز والغريب.'},
  {q:'ما حكم العمل بخبر الآحاد الصحيح عند جمهور العلماء؟',c:'حجة يجب العمل بها',w:['لا يُعمل به إلا إذا بلغ التواتر','يُعمل به في فضائل الأعمال فقط','يُعمل به إذا وافق عمل أهل المدينة فقط'],n:'عمل الصحابة والأئمة على الاحتجاج بأخبار الآحاد في الأحكام، وهو مذهب الجمهور.'},
  {q:'ما «المشهور» (المستفيض) عند كثير من المحدثين؟',c:'ما رواه ثلاثة فأكثر في كل طبقة ولم يبلغ حد التواتر',w:['ما انتشر على ألسنة العامة ولو لم يصح','ما رواه اثنان في كل طبقة','ما اتفق عليه الشيخان'],n:'والمشهور اصطلاحًا قد يكون صحيحًا أو ضعيفًا، وهو غير المشهور على ألسنة الناس.'},
  {q:'ما «العزيز»؟',c:'ما لا يقل رواته عن اثنين في جميع طبقات السند',w:['ما رواه راوٍ واحد في أي طبقة','ما كثرت طرقه حتى بلغ التواتر','ما ثبتت صحته بإجماع المحدثين'],n:'سمي عزيزًا لقلة وجوده أو لقوته بمجيئه من طريق آخر.'},
  {q:'ما «الغريب» في اصطلاح المحدثين؟',c:'ما انفرد بروايته راوٍ واحد',w:['ما كان في ألفاظه كلمات غير مألوفة فقط','ما رواه ضعيف لا يتابعه غيره','ما سقط من سنده راوٍ'],n:'ويسمى أيضًا الفرد، وقد يكون صحيحًا كحديث «إنما الأعمال بالنيات» فقد تفرد به يحيى بن سعيد الأنصاري عن محمد بن إبراهيم التيمي عن علقمة عن عمر في أول طبقاته.'},
  {q:'أي هذه ليست من شروط الحديث الصحيح الخمسة؟',c:'كثرة طرق الحديث',w:['اتصال السند','تمام ضبط الرواة','السلامة من الشذوذ'],n:'الشروط: اتصال السند، وعدالة الرواة، وتمام ضبطهم، والسلامة من الشذوذ، والسلامة من العلة القادحة.'},
  {q:'ما «الشذوذ» في الحديث؟',c:'مخالفة الراوي المقبول لمن هو أولى منه',w:['انفراد الراوي بحديث لم يروه غيره مطلقًا','سقوط راوٍ من وسط السند','اختلاط الراوي في آخر عمره'],n:'مخالفة الثقة لمن هو أوثق منه أو أكثر عددًا، وليس مجرد التفرد.'},
  {q:'ما «العلة» عند المحدثين؟',c:'سبب خفي غامض يقدح في صحة الحديث مع أن ظاهره السلامة',w:['ظاهر الضعف في الراوي كالكذب','كل مخالفة للقياس في المتن','انقطاع ظاهر في السند'],n:'ولا يدركها إلا الحفاظ الجهابذة، ولهم فيها كتب «العلل» كعلل ابن أبي حاتم وعلل الدارقطني.'},
  {q:'ما «الحسن لغيره»؟',c:'حديث ضعيف ضعفًا يسيرًا ارتقى بتعدد طرقه',w:['حديث صحيح خف ضبط راويه','حديث رواه البخاري خارج صحيحه','حديث شهد له الإجماع دون إسناد'],n:'يشترط ألا يكون ضعفه شديدًا كالكذب، وأن تتعدد طرقه المعتبرة.'}
 ]},
 {id:'v2_3',title:'المرسل والمنقطع والموضوع والتدليس والجرح',qs:[
  {q:'ما «المرسل» في اصطلاح المحدثين؟',c:'ما رفعه التابعي إلى النبي صلى الله عليه وسلم بإسقاط الصحابي',w:['ما سقط من إسناده راويان فأكثر على التوالي','ما حُذف من أول إسناده راوٍ فأكثر','ما رواه الصحابي عن صحابي آخر'],n:'كقول سعيد بن المسيب: قال رسول الله صلى الله عليه وسلم. وهو من الضعيف عند الجمهور لجهالة الساقط.'},
  {q:'ما «المنقطع»؟',c:'ما سقط من وسط إسناده راوٍ أو أكثر مع عدم التوالي',w:['ما رواه التابعي عن النبي صلى الله عليه وسلم مباشرة','ما حُذف مبدأ إسناده كله','ما انفرد به راوٍ ضعيف'],n:'وللمنقطع إطلاقات أخرى عند المتقدمين، والمشهور عند المتأخرين ما ذكر.'},
  {q:'ما «المعضل»؟',c:'ما سقط من إسناده راويان فأكثر على التوالي',w:['ما سقط منه راوٍ واحد من أول السند','ما سقط منه الصحابي فقط','ما فيه راوٍ مدلس'],n:'سمي معضلًا من «أعضله» إذا أعياه؛ فهو أشد ضعفًا من المرسل والمنقطع.'},
  {q:'ما «المعلَّق» من الحديث؟',c:'ما حُذف من مبدأ إسناده راوٍ فأكثر',w:['ما سقط من وسط إسناده راوٍ','ما اختلف فيه الرواة في المتن','ما تفرد به راوٍ من غير متابع'],n:'وكثير من التعليقات في صحيح البخاري، وما جزم به منها فهو صحيح غالبًا عند ابن حجر.'},
  {q:'ما «الحديث الموضوع»؟',c:'الكذب المختلق المنسوب إلى النبي صلى الله عليه وسلم',w:['الحديث الضعيف الذي رواه راوٍ سيئ الحفظ','الحديث الذي لا إسناد له','حديث انفرد به راوٍ واحد'],n:'وهو شر الأحاديث الضعيفة، ولا تحل روايته إلا مع بيان وضعه.'},
  {q:'أي مما يلي ليس من الدوافع المعروفة للوضع في الحديث عند العلماء؟',c:'اختلاف القراءات القرآنية',w:['نصرة المذاهب والفرق','الزندقة والكيد للدين','الترغيب والترهيب بغير علم من بعض المتعبدين'],n:'ذكر العلماء أسبابًا منها الزندقة والعصبية المذهبية والقصص والتقرب إلى الحكام والتزهيد بجهل.'},
  {q:'ما «التدليس»؟',c:'إخفاء عيب في الإسناد وتحسين لظاهره',w:['رواية الحديث بالمعنى دون اللفظ','نسبة الحديث إلى غير قائله عمدًا','جمع الأحاديث في كتاب واحد'],n:'ومنه أن يروي عمن عاصره ما لم يسمعه منه بلفظ يوهم السماع كـ«عن».'},
  {q:'ما حكم رواية المدلِّس بصيغة محتملة كـ«عن» عند جمهور المحدثين؟',c:'لا تُقبل حتى يصرح بالسماع',w:['تُقبل مطلقًا إذا كان ثقة','تُرد دائمًا ولو صرح بالسماع','تُقبل إذا كان صحابيًا فقط'],n:'فإذا قال: «حدثنا» أو «سمعت» اتصل السند وزال احتمال التدليس.'},
  {q:'إذا تعارض جرح مفسَّر وتعديل في راوٍ، فما القاعدة المشهورة عند جمهور العلماء؟',c:'يُقدَّم الجرح المفسَّر على التعديل',w:['يُقدَّم التعديل دائمًا لأن الأصل العدالة','يُرد الحديث دون نظر','يُقدَّم قول الأقدم وفاة مطلقًا'],n:'لأن الجارح اطلع على ما خفي على المعدِّل، بشرط أن يبيّن سبب الجرح.'},
  {q:'ما «علم الجرح والتعديل» بإجمال؟',c:'علم يُعنى ببيان أحوال الرواة من حيث قبول روايتهم أو ردها',w:['علم يُعنى بجمع الأحاديث وتبويبها فقط','علم يبحث في ألفاظ الحديث الغريبة','علم يُعنى بتاريخ جمع الصحف'],n:'ومن أئمته يحيى بن معين وأحمد بن حنبل وابن أبي حاتم صاحب «الجرح والتعديل».'}
 ]},
 {id:'v2_4',title:'الكتب الستة والموطأ والمسند والمكثرون',qs:[
  {q:'ما سنة وفاة الإمام البخاري صاحب «الجامع الصحيح»؟',c:'256 هـ',w:['261 هـ','241 هـ','275 هـ'],n:'هو محمد بن إسماعيل البخاري، توفي في خرتنك قرب سمرقند ليلة عيد الفطر.'},
  {q:'ما الاسم الكامل لصحيح البخاري؟',c:'الجامع المسند الصحيح المختصر من أمور رسول الله صلى الله عليه وسلم وسننه وأيامه',w:['المسند الصحيح المختصر من السنن بنقل العدل عن العدل','الجامع الصحيح المبوب على أبواب الفقه','الموطأ الصحيح من أحاديث رسول الله صلى الله عليه وسلم'],n:'أما مسلم فاسم كتابه «المسند الصحيح المختصر من السنن بنقل العدل عن العدل إلى رسول الله صلى الله عليه وسلم».'},
  {q:'من صاحب الصحيح الذي توفي سنة 261 هـ بنيسابور؟',c:'مسلم بن الحجاج القشيري',w:['أبو داود السجستاني','أبو عيسى الترمذي','أبو عبد الرحمن النسائي'],n:'وهو تلميذ البخاري وقرينه، ويُعرف الكتابان معًا بـ«الصحيحين».'},
  {q:'من مؤلف «السنن» المشهور الذي كان سجستانيَّ النسب وتوفي سنة 275 هـ؟',c:'أبو داود',w:['ابن ماجه','النسائي','الدارمي'],n:'وهو سليمان بن الأشعث السجستاني، واشتهرت سننه بكثرة أحاديث الأحكام.'},
  {q:'أي كتب الستة اشتُهر بتقسيم الحديث إلى صحيح وحسن وغريب وبكتاب «العلل» في آخره؟',c:'الجامع للترمذي',w:['سنن أبي داود','سنن النسائي','سنن ابن ماجه'],n:'وتوفي الترمذي سنة 279 هـ، ويُعد كتابه من أوائل ما أشاع مصطلح «الحسن».'},
  {q:'ما اسم الكتاب الذي هو المجتبى من «السنن الكبرى» للنسائي؟',c:'السنن الصغرى',w:['الجامع الصغير','المسند الصحيح','الموطأ الصغير'],n:'توفي النسائي سنة 303 هـ، وكتابه «المجتبى» أقل الكتب الستة ضعفًا بعد الصحيحين على قول.'},
  {q:'أي هذه الكتب ليس من «السنن الأربعة»؟',c:'صحيح مسلم',w:['سنن أبي داود','جامع الترمذي','سنن ابن ماجه'],n:'السنن الأربعة: أبو داود والترمذي والنسائي وابن ماجه، والستة مع الصحيحين.'},
  {q:'من مؤلف «الموطأ» وإلى أي مدينة تنسب مدرسته؟',c:'مالك بن أنس، إمام دار الهجرة',w:['الشافعي، إمام مصر','أحمد بن حنبل، إمام بغداد','أبو حنيفة، إمام الكوفة'],n:'توفي الإمام مالك بالمدينة سنة 179 هـ، والموطأ من أقدم المصنفات الحديثية الفقهية الباقية.'},
  {q:'ما «مسند أحمد»؟',c:'كتاب رتب فيه أحمد بن حنبل الأحاديث على أسماء الصحابة',w:['كتاب رتب فيه أحاديثه على أبواب الفقه','كتاب اقتصر فيه على الصحيح المتفق عليه','كتاب جمع فيه علل الأحاديث'],n:'توفي الإمام أحمد سنة 241 هـ، والمسند فيه الصحيح والحسن والضعيف.'},
  {q:'من أكثر الصحابة رواية للحديث عن النبي صلى الله عليه وسلم؟',c:'أبو هريرة رضي الله عنه',w:['عبد الله بن عمر','أنس بن مالك','عائشة رضي الله عنها'],n:'روى نحو خمسة آلاف حديث وثلاثمئة على المشهور، ثم عبد الله بن عمر وأنس وعائشة وابن عباس وجابر وأبو سعيد الخدري.'}
 ]}
]},
{title:'علوم القرآن والتفسير',sub:'نزول القرآن وجمعه وقراءاته وأشهر مفسريه',lv:'a',lessons:[
 {id:'v2_5',title:'نزول القرآن وأسبابه والمكي والمدني',qs:[
  {q:'ما معنى نزول القرآن «منجَّمًا»؟',c:'نزوله مفرَّقًا على مدى نحو ثلاث وعشرين سنة',w:['نزوله جملة واحدة في ليلة القدر على النبي صلى الله عليه وسلم','نزوله في الليل دون النهار','نزوله على ترتيب المصحف الحالي'],n:'وروي عن ابن عباس أنه نزل جملة إلى بيت العزة من السماء الدنيا ثم نزل مفرقًا.'},
  {q:'ما أول ما نزل من القرآن على النبي صلى الله عليه وسلم؟',c:'صدر سورة العلق',w:['صدر سورة المدثر','سورة الفاتحة','صدر سورة المزمل'],n:'ثبت في حديث عائشة رضي الله عنها في بدء الوحي (صحيح البخاري)، أما المدثر فهي أول ما نزل بعد فترة الوحي في حديث جابر.'},
  {q:'أي الآيات تدل على نزول القرآن في ليلة القدر؟',c:'﴿إِنَّا أَنزَلْنَاهُ فِي لَيْلَةِ الْقَدْرِ﴾',w:['﴿وَقُرْآنًا فَرَقْنَاهُ لِتَقْرَأَهُ عَلَى النَّاسِ عَلَىٰ مُكْثٍ﴾','﴿وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ﴾','﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ﴾'],n:'سورة القدر، وهي موافقة لقوله تعالى في البقرة أنه أُنزل في شهر رمضان.'},
  {q:'كم استغرق نزول القرآن تقريبًا؟',c:'ثلاثًا وعشرين سنة',w:['عشر سنوات','ثلاثين سنة','ثلاث عشرة سنة'],n:'منها نحو ثلاث عشرة سنة بمكة ونحو عشر بالمدينة.'},
  {q:'ما الحكمة من تنجيم القرآن التي نص عليها قوله تعالى: ﴿لِنُثَبِّتَ بِهِ فُؤَادَكَ﴾؟',c:'تثبيت فؤاد النبي صلى الله عليه وسلم والتدرج في التشريع',w:['إظهار عجز العرب عن حفظه جملة','إتاحة الوقت للصحابة لتأليف السور','مراعاة اختلاف لهجات القبائل فقط'],n:'الآية 32 من سورة الفرقان، ومن حكمه تيسير حفظه وفهمه ومواكبة الوقائع.'},
  {q:'ما القاعدة الأصولية المشهورة في أسباب النزول؟',c:'العبرة بعموم اللفظ لا بخصوص السبب',w:['العبرة بخصوص السبب لا بعموم اللفظ','لا يُستدل بآية لها سبب نزول','كل آية لها سبب نزول واحد لا غير'],n:'وهذا مذهب الجمهور، فتنسحب الأحكام على كل من وقع في مثل السبب.'},
  {q:'أي هذه الأمور من خصائص السور المكية في الغالب؟',c:'الحديث عن التوحيد والبعث وقصص الأنبياء والآيات القصيرة',w:['تفصيل أحكام المواريث والحدود','الحديث عن المنافقين وأحكام الجهاد','تفصيل أحكام الأسرة والمعاملات'],n:'وتغلب الأحكام التشريعية والحديث عن المنافقين وأهل الكتاب على المدني.'},
  {q:'ما ضابط «المدني» عند أكثر العلماء؟',c:'ما نزل بعد الهجرة ولو نزل بمكة',w:['ما نزل في المدينة المنورة فقط','ما خاطب أهل الكتاب','ما نزل بعد غزوة بدر فقط'],n:'كالآيات التي نزلت يوم الفتح أو في حجة الوداع، فهي مدنية باعتبار الزمان.'},
  {q:'أي هذه السور مدنية؟',c:'البقرة',w:['الأنعام','يس','الكهف'],n:'البقرة أول سورة نزلت بالمدينة بعد الهجرة على المشهور، والأنعام ويس والكهف مكيات.'},
  {q:'في أي مما يلي وافق القرآن رأي عمر بن الخطاب رضي الله عنه كما في صحيح البخاري؟',c:'اتخاذ مقام إبراهيم مصلى',w:['تحويل القبلة إلى الكعبة','فرض الزكاة','تحريم الربا'],n:'قال عمر: وافقت ربي في ثلاث: في مقام إبراهيم وفي الحجاب وفي أسارى بدر.'}
 ]},
 {id:'v2_6',title:'جمع القرآن والقراءات والأحرف السبعة',qs:[
  {q:'من الصحابي الذي أشار على أبي بكر بجمع القرآن بعد معركة اليمامة؟',c:'عمر بن الخطاب',w:['زيد بن ثابت','عثمان بن عفان','علي بن أبي طالب'],n:'خشي عمر ذهاب القرآن بموت القراء، فأقنع أبا بكر (صحيح البخاري).'},
  {q:'من كلَّفه أبو بكر بجمع القرآن في الصحف؟',c:'زيد بن ثابت',w:['أبي بن كعب','عبد الله بن مسعود','معاذ بن جبل'],n:'وكان شابًا عاقلًا لا يُتهم، وكان يكتب الوحي للنبي صلى الله عليه وسلم.'},
  {q:'عند من حُفظت الصحف بعد وفاة عمر رضي الله عنه؟',c:'حفصة بنت عمر',w:['عثمان بن عفان','أبي بن كعب','عائشة رضي الله عنها'],n:'كانت عند أبي بكر ثم عمر ثم عند حفصة أم المؤمنين (صحيح البخاري).'},
  {q:'من الصحابي الذي أفزعه اختلاف الناس في القراءة فأشار على عثمان بجمعهم على مصحف واحد؟',c:'حذيفة بن اليمان',w:['زيد بن ثابت','سعيد بن العاص','أبو موسى الأشعري'],n:'رأى الاختلاف في غزوة أرمينية وأذربيجان (صحيح البخاري).'},
  {q:'بأي لسان أمر عثمان اللجنة بالكتابة إذا اختلفوا مع زيد بن ثابت؟',c:'بلسان قريش',w:['بلسان تميم','بلسان هذيل','بلسان الأنصار'],n:'قال عثمان للرهط القرشيين: فإنما نزل بلسانهم (صحيح البخاري).'},
  {q:'ماذا فعل عثمان رضي الله عنه بما سوى المصاحف العثمانية من الصحف والمصاحف؟',c:'أمر بإحراقها',w:['أمر بدفنها في المدينة','أبقاها عند القراء','أمر بتوزيعها على الأمصار'],n:'ورد الصحف إلى حفصة (صحيح البخاري)، وكان ذلك بإقرار الصحابة.'},
  {q:'قراءة ورش مروية عن أي إمام من القراء السبعة؟',c:'نافع المدني',w:['عاصم الكوفي','أبو عمرو البصري','ابن كثير المكي'],n:'وهي الرواية الشائعة في المغرب العربي وغرب إفريقيا.'},
  {q:'من الراوي عن نافع المدني من بين هؤلاء؟',c:'قالون',w:['حفص','الدوري','خلف'],n:'والراويان المشهوران عن نافع: قالون وورش، وحفص هو راوي عاصم.'},
  {q:'قراءة حفص عن عاصم هي الأكثر انتشارًا اليوم، فعن أي إمام روى حفص؟',c:'عاصم بن أبي النجود الكوفي',w:['حمزة الزيات','الكسائي','ابن عامر الشامي'],n:'وعاصم من التابعين، وانتشرت روايته في الدولة العثمانية ثم في المصاحف المطبوعة.'},
  {q:'ما صحة القول بأن «الأحرف السبعة» هي القراءات السبع المشهورة؟',c:'غير صحيح؛ فالقراءات السبع اختارها ابن مجاهد وهي غير الأحرف',w:['صحيح؛ فكل قراءة منها حرف','صحيح؛ فقد جمعها عثمان في سبعة مصاحف','صحيح؛ فالأحرف السبعة سبع لغات فقط'],n:'ثبت قوله صلى الله عليه وسلم: «إن هذا القرآن أنزل على سبعة أحرف فاقرؤوا ما تيسر منه» (متفق عليه)، وفسره العلماء بتعدد أوجه التيسير في الأداء، واختلفوا في تحديدها.'}
 ]},
 {id:'v2_7',title:'المحكم والمتشابه والنسخ والتفسير وأسماء القرآن',qs:[
  {q:'في أي سورة ذُكر قوله تعالى: ﴿مِنْهُ آيَاتٌ مُّحْكَمَاتٌ هُنَّ أُمُّ الْكِتَابِ وَأُخَرُ مُتَشَابِهَاتٌ﴾؟',c:'آل عمران',w:['النساء','البقرة','المائدة'],n:'الآية 7 من آل عمران.'},
  {q:'كيف وصف الله الراسخين في العلم حين يتعاملون مع المتشابه؟',c:'يقولون آمنا به كلٌّ من عند ربنا',w:['يتبعونه ابتغاء الفتنة','يؤولونه بما يشاؤون','يتركونه دون إيمان به'],n:'قال تعالى: ﴿وَالرَّاسِخُونَ فِي الْعِلْمِ يَقُولُونَ آمَنَّا بِهِ كُلٌّ مِّنْ عِندِ رَبِّنَا﴾، وفي الوقف والابتداء خلاف معروف في ﴿إِلَّا اللَّهُ﴾.'},
  {q:'ما تعريف «النسخ» عند الأصوليين؟',c:'رفع حكم شرعي بدليل شرعي متأخر',w:['رفع حكم شرعي بالعقل','تخصيص عام بدليل متصل','تقييد مطلق بدليل منفصل'],n:'ويشترط تعارض الدليلين وتعذر الجمع بينهما ومعرفة المتقدم والمتأخر.'},
  {q:'في أي سورة وردت آية: ﴿مَا نَنسَخْ مِنْ آيَةٍ أَوْ نُنسِهَا نَأْتِ بِخَيْرٍ مِّنْهَا أَوْ مِثْلِهَا﴾؟',c:'البقرة',w:['النحل','الرعد','آل عمران'],n:'الآية 106 من البقرة، وفي النحل ﴿وَإِذَا بَدَّلْنَا آيَةً مَّكَانَ آيَةٍ﴾.'},
  {q:'أي هذه الأمثلة من النسخ في القرآن (نسخ الحكم مع بقاء التلاوة)؟',c:'عدة المتوفى عنها زوجها حولًا نُسخت بأربعة أشهر وعشر',w:['وجوب الصلاة على المسلمين','تحريم الميتة والدم ولحم الخنزير','إباحة الطيبات من الرزق'],n:'الحول في البقرة 240 والأربعة أشهر وعشر في البقرة 234 (قول ابن عباس في صحيح البخاري).'},
  {q:'أشهر مثال على النسخ في الشريعة هو:',c:'تحويل القبلة من بيت المقدس إلى الكعبة',w:['تحريم الزنا','وجوب الإيمان بالله','تحريم أكل الميتة'],n:'قال تعالى: ﴿فَوَلِّ وَجْهَكَ شَطْرَ الْمَسْجِدِ الْحَرَامِ﴾ (البقرة 144).'},
  {q:'ما أفضل طرق التفسير عند العلماء مرتبةً؟',c:'القرآن بالقرآن ثم السنة ثم أقوال الصحابة ثم التابعين ثم اللغة والاجتهاد',w:['اللغة ثم أقوال الصحابة ثم السنة ثم القرآن','الرأي المجرد ثم السنة ثم القرآن','السنة ثم أقوال المتأخرين ثم القرآن'],n:'نص عليه ابن تيمية في مقدمة أصول التفسير، وسار عليه ابن كثير في مقدمة تفسيره.'},
  {q:'ما شرط قبول التفسير بالرأي (الاجتهاد) عند العلماء؟',c:'أن يكون مستندًا إلى علم باللغة والشريعة وأصول التفسير',w:['أن يوافق هوى المفسر وفهمه الخاص','أن يخالف ما ورد عن السلف','أن يقتصر على ظاهر اللفظ دون سياق'],n:'أما التفسير بمجرد الرأي والهوى فمذموم، ومنه تفاسير الفرق التي تحمل الآيات على مذاهبها.'},
  {q:'أي هذه ليس اسمًا للقرآن ورد في القرآن نفسه؟',c:'المصحف',w:['الفرقان','الذكر','التنزيل'],n:'ورد: ﴿تَبَارَكَ الَّذِي نَزَّلَ الْفُرْقَانَ﴾ و﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ﴾ و﴿وَإِنَّهُ لَتَنزِيلُ رَبِّ الْعَالَمِينَ﴾، والمصحف اسم للمكتوب بين الدفتين.'},
  {q:'لماذا سُمّي القرآن «الفرقان»؟',c:'لأنه يفرق بين الحق والباطل',w:['لأنه فُرّق في نزوله على مراحل فقط','لأنه فرّق العرب إلى قبائل','لأنه فصّل بين المكي والمدني'],n:'قال تعالى: ﴿تَبَارَكَ الَّذِي نَزَّلَ الْفُرْقَانَ عَلَىٰ عَبْدِهِ لِيَكُونَ لِلْعَالَمِينَ نَذِيرًا﴾ (الفرقان 1).'}
 ]},
 {id:'v2_8',title:'المفسرون ومؤلفاتهم وعدد السور والأجزاء',qs:[
  {q:'من مؤلف «جامع البيان عن تأويل آي القرآن» الملقب بشيخ المفسرين؟',c:'ابن جرير الطبري',w:['ابن كثير الدمشقي','أبو عبد الله القرطبي','الزمخشري'],n:'توفي الطبري ببغداد سنة 310 هـ، وهو أعظم تفاسير المأثور.'},
  {q:'ما الكتاب الذي ألّفه ابن كثير الدمشقي في التفسير؟',c:'تفسير القرآن العظيم',w:['الكشاف عن حقائق غوامض التنزيل','التحرير والتنوير','معالم التنزيل'],n:'وهو من أشهر تفاسير المأثور، وتوفي المؤلف سنة 774 هـ.'},
  {q:'من صاحب «الجامع لأحكام القرآن» الذي اهتم بآيات الأحكام ويُعرف بتفسير القرطبي؟',c:'محمد بن أحمد القرطبي',w:['ابن العربي المالكي','البغوي','السعدي'],n:'مالكي من الأندلس، سكن مصر وتوفي بها سنة 671 هـ.'},
  {q:'من مؤلف «تيسير الكريم الرحمن في تفسير كلام المنان»؟',c:'عبد الرحمن بن ناصر السعدي',w:['محمد الطاهر بن عاشور','محمد بن صالح العثيمين','الشنقيطي'],n:'عالم من القصيم بنجد، توفي سنة 1376 هـ، وتفسيره مختصر واضح العبارة.'},
  {q:'من صاحب «معالم التنزيل» في التفسير ويلقب بمحيي السنة؟',c:'الحسين بن مسعود البغوي',w:['الزمخشري','ابن الجوزي','الفخر الرازي'],n:'وهو شافعي المذهب، وتفسيره من كتب المأثور المختصرة.'},
  {q:'«الكشاف عن حقائق غوامض التنزيل» من تأليف:',c:'الزمخشري، وهو معتزلي',w:['الطبري، وهو سني','ابن كثير، وهو أشعري','البغوي، وهو معتزلي'],n:'اشتهر الكشاف بجودته البلاغية، وقد نبّه العلماء على ما فيه من اعتزال.'},
  {q:'«التحرير والتنوير» تفسير لعالم من أي بلد؟',c:'محمد الطاهر ابن عاشور، من تونس',w:['محمد رشيد رضا، من لبنان','سيد قطب، من مصر','محمد عبده، من مصر'],n:'وهو من أبرز تفاسير العصر الحديث، ويعتني بالبلاغة ومقاصد القرآن.'},
  {q:'كم عدد أحزاب القرآن الكريم على التقسيم المشهور؟',c:'60 حزبًا',w:['30 حزبًا','114 حزبًا','120 حزبًا'],n:'والقرآن 30 جزءًا و114 سورة، ولكل جزء حزبان.'},
  {q:'ما أطول سورة في القرآن الكريم؟',c:'البقرة',w:['آل عمران','النساء','الأعراف'],n:'وآياتها 286، وفيها أطول آية وهي آية الدَّين.'},
  {q:'ما أقصر سورة في القرآن الكريم من حيث عدد الآيات؟',c:'الكوثر',w:['الإخلاص','العصر','النصر'],n:'ثلاث آيات، ويشاركها في العدد سورتا العصر والنصر.'}
 ]}
]}
];

/* ترجمة تركيبية للجمل القصيرة: كل كلمة أو عبارة لها ترجمة في القاموس، وإلا تبقى الجملة كما هي */
function wordsFB(t){
  if(t.length>140)return undefined;
  const nm=(S.prof&&S.prof.name)||'';
  const toks=t.split(/(\s+|[:·،؛؟.,!()«»\-–—+×%°\n•]|§|\d+(?:[.,]\d+)?)/).filter(function(x){return x!==''});
  const out=[];let i=0,any=false;
  const isW=function(x){return AR_RE.test(x)};
  const punct={'،':',','؟':'?','؛':';'};
  while(i<toks.length){
    const x=toks[i];
    if(!isW(x)){out.push(punct[x]!==undefined?punct[x]:x);i++;continue}
    if(nm&&x===nm){out.push(x);i++;continue}
    let k=i,ws=[],idx=[];
    while(k<toks.length&&k<i+14){if(isW(toks[k])){ws.push(toks[k]);idx.push(k)}else if(!/^\s$/.test(toks[k])||(k+1<toks.length&&!isW(toks[k+1])))break;k++}
    let done=false;
    for(let n=Math.min(ws.length,6);n>=1&&!done;n--){
      const ph=ws.slice(0,n).join(' '),v=I18[ph];
      if(v!==undefined){out.push(v);i=idx[n-1]+1;done=true;any=true}
    }
    if(!done)return undefined;
  }
  return any?out.join('').replace(/\s+/g,' ').replace(/ ([,.:;!?])/g,'$1'):undefined;
}

let AC=null,MG=null;
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();
  // سلسلة ماستر: ضاغط يمنع التشويه + فلتر ناعم + مستوى صوت قابل للضبط
  const cp=AC.createDynamicsCompressor();cp.threshold.value=-18;cp.ratio.value=6;cp.attack.value=.003;cp.release.value=.2;
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=7000;lp.Q.value=.4;
  MG=AC.createGain();MG.connect(lp);lp.connect(cp);cp.connect(AC.destination)}
  MG.gain.value=volLevel();
  if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
function volLevel(){const v=(typeof S!=='undefined'&&S.vol!=null)?S.vol:100;return Math.max(0,Math.min(100,+v||0))/100}

function tone(f,t0,d,type,vol,f2){
  if(S.mute)return;const c=ac();if(!c)return;
  try{
    const t=c.currentTime+t0,g=c.createGain();
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    g.connect(MG||c.destination);
    // مذبذبان بانحراف طفيف لصوت أدفأ وأغنى
    [-4,4].forEach(function(dt){
      const o=c.createOscillator();o.type=type||'sine';o.detune.value=dt;o.frequency.setValueAtTime(f,t);
      if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
      const h=c.createGain();h.gain.value=.5;o.connect(h);h.connect(g);o.start(t);o.stop(t+d+.03);
    });
  }catch(e){}
}

function prep(q){
  if(q.t==='ord'){if(!q.pool){let p;do{p=shuffle(q.items)}while(p.join('|')===q.items.join('|')&&q.items.length>1);q.pool=p}}
  else if(q.t==='match'){if(!q.st)q.st={right:shuffle(q.pairs.map(function(p){return p[1]})),sel:null,map:{}}}
  else if(q.t==='type'){}
  else if(q.t==='multi'){if(!q.opts)q.opts=shuffle(q.c.concat(q.w))}
  else if(!q.opts){q.opts=shuffle([q.c].concat(q.w))}
}
function renderLesson(){

  if(q.t==='ord'){
    h+='<div class="ans" aria-label="الترتيب الحالي">'+L.ans.map(function(t,i){return '<button class="tile" data-un="'+i+'" '+(checked?'disabled':'')+'>'+t+'</button>'}).join('')+'</div>'+

  }
  h+='</div>';

    const canHint=(!q.t||q.t==='fill')&&!q.hid&&q.opts&&q.opts.length>=4;

  }else{

      (L.ok?'<h3>'+pick(PRAISE)+'</h3>':'<h3>الإجابة الصحيحة</h3><p><b>'+ans+'</b></p>')+
      (q.n?'<p>'+q.n+'</p>':'')+'</div><button class="btn '+(L.ok?'':'bad')+'" data-act="next">متابعة</button></div></div>';
  }

function checkLesson(){
  const q=L.queue[0];let ok;
  if(L.force)ok=false;
  else if(q.t==='ord')ok=L.ans.join('|')===q.items.join('|');
  else if(QT[q.t])ok=QT[q.t].check(q);
  else ok=q.opts[L.sel]===q.c;
  L.force=false;qtStop();
  L.ok=ok;L.state='checked';S.q++;
  if(!q.missed){if(q.f)fsRec(q.f,ok);if(L.placement&&ok)L.pc++}
  if((!q.t||q.t==='fill')&&!q.missed&&!L.placement)srUpdate(q,ok);
  if(ok){
    S.qc++;if(!q.missed)L.combo++;L.best=Math.max(L.best,L.combo);
    if(L.combo>=3){L.mood='wow';L.say='تتابع ×'+N(L.combo)+'! ما شاء الله!';SND.combo(L.combo)}
    else{L.mood='cheer';L.say=pick(OKSAY);SND.correct()}
  }else{
    L.hearts--;L.wrongs++;L.combo=0;L.mood='sad';L.say=pick(NOSAY);SND.wrong();
  }
  act('q');renderLesson();
}
function nextLesson(){
  const q=L.queue[0];
  if(L.placement){L.queue.shift();L.solved++;if(L.queue.length===0)return placementResult();L.state='ask';L.sel=null;L.ans=[];L.ms=[];L.tv='';L.force=false;L.mood='happy';return renderLesson()}
  if(L.ok){L.gain+=(q.missed?5:10)+(L.combo>=3?2:0);L.solved++;L.queue.shift()}
  else{q.missed=true;q.opts=null;q.pool=null;q.st=null;q.hid=null;q.dl=null;L.queue.push(L.queue.shift())}
  if(L.hearts<=0&&!L.ok)return failLesson();
  if(L.queue.length===0)return finishLesson();
  L.state='ask';L.sel=null;L.ans=[];L.ms=[];L.tv='';L.force=false;L.mood='happy';renderLesson();
}

let FRC={};

  if(FRC[n])return Promise.resolve(FRC[n]);

  return fetch('https://api.alquran.cloud/v1/surah/'+n+'/fr.hamidullah').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    const arr=j.data.ayahs.map(function(x){return x.text});if(!arr.length)throw 0;FRC[n]=arr;try{localStorage.setItem('nf-fr-'+n,JSON.stringify(arr))}catch(e){}return arr});

/* ================= أسئلة «أكمل الآية» (تُولَّد من نص المصحف) ================= */
function genAyat(level,n,surahs){
  const pool=surahs&&surahs.length?surahs:(level==='e'?range(78,114):level==='m'?range(50,114):range(2,114));
  const out=[];let guard=0;
  while(out.length<n&&guard++<n*40){
    const s=pick(pool),vs=Q.v[s-1],a=Math.floor(Math.random()*vs.length),w=vs[a].split(' ');
    const tail=Math.min(level==='h'?4:3,w.length-2);
    if(tail<1||w.length<3)continue;
    const c=w.slice(-tail).join(' '),head=w.slice(0,-tail).join(' ');
    const others=[];
    vs.forEach(function(v,i){if(i===a)return;const x=v.split(' ');if(x.length>=tail+1){const t=x.slice(-tail).join(' ');if(t!==c&&!others.includes(t))others.push(t)}});
    let tries=0;
    while(others.length<3&&tries++<60){const s2=1+Math.floor(Math.random()*114),v2=Q.v[s2-1],x=v2[Math.floor(Math.random()*v2.length)].split(' ');if(x.length>=tail+1){const t=x.slice(-tail).join(' ');if(t!==c&&!others.includes(t))others.push(t)}}
    if(others.length<3)continue;
    const q='أكمل الآية من سورة '+SN[s-1]+': ﴿'+head+' …﴾';
    if(out.some(function(o){return o.q===q}))continue;
    out.push({f:'ayat',l:level,q:q,c:c,w:shuffle(others).slice(0,3),n:'الآية '+N(a+1)+' من سورة '+SN[s-1]+'.'});
  }
  return out;
}

function prayerTimes(lat,lng,date,tz,mk){

  function T(ang){const x=(-Math.sin(rad(ang))-Math.sin(rad(lat))*Math.sin(rad(decl)))/(Math.cos(rad(lat))*Math.cos(rad(decl)));if(x>1||x<-1)return NaN;return deg(Math.acos(x))/15}
  function A(f){const a=-deg(Math.atan(1/(f+Math.tan(rad(Math.abs(lat-decl))))));return T(a)}

    if(k==='acct'||!(k in S))return;
    if(typeof b==='number'){S[k]=Math.max(a||0,b);return}
    if(b&&typeof b==='object'&&!Array.isArray(b)){
      if(a&&typeof a==='object'&&!Array.isArray(a)){
        if(k==='has'){S.has.t=Math.max(a.t||0,b.t||0);for(const d in b.d)S.has.d[d]=Math.max(S.has.d[d]||0,b.d[d]);return}
        if(k==='khat'){S.khat.n=Math.max(a.n||0,b.n||0);S.khat.read=Math.max(a.read||0,b.read||0);S.khat.days=a.days||b.days;return}
        if(k==='daily'||k==='adk'||k==='prof'){if(k==='prof'&&!a)S[k]=b;return}
        for(const kk in b){
          if(a[kk]===undefined)a[kk]=b[kk];
          else if(typeof b[kk]==='number'&&typeof a[kk]==='number')a[kk]=Math.max(a[kk],b[kk]);
          else if(k==='fsd'&&b[kk]&&a[kk]){a[kk].n=Math.max(a[kk].n,b[kk].n);a[kk].c=Math.max(a[kk].c,b[kk].c)}
        }
      }else if(!a||(typeof a==='object'&&!Object.keys(a).length))S[k]=b;
    }else if((a===''||a===null||a===undefined||a===false)&&b)S[k]=b;
  });
  S.max=Math.max(S.max||0,r.max||0);
}

    if(!x||typeof x.q!=='string'||typeof x.c!=='string'||!Array.isArray(x.o)||x.o.length<2||x.o.length>6)return null;
    if(x.o.some(function(o){return typeof o!=='string'||o.length>300})||x.q.length>400||x.c.length>300||x.o.indexOf(x.c)<0)return null;
    out.push({q:x.q,c:x.c,o:x.o.slice()});
  }
  return out;
}
function duelStart(qs){qs=duelValid(qs);if(!qs){toast('بيانات التحدي غير صالحة');return}DU.qs=qs;DU.i=0;DU.sc=0;DU.state='play';DU.sel=null;DU.room.presence({n:duelName(),sc:0,dn:0}).catch(function(){});SND.nav();renderDuel()}
function duelHostStart(){
  let pool=[];F.forEach(function(f){if(f.id==='order'||f.id==='ayat')return;['e','m'].forEach(function(l){((B[f.id]||{})[l]||[]).forEach(function(x){pool.push({q:x[0],c:x[1],o:shuffle(x.slice(1,5))})})})});
  const qs=shuffle(pool).slice(0,8);
  DU.room.emit('duel',{qs:qs}).catch(function(){});
  duelStart(qs);
}
function duelRank(){
  const r=DU.room.peers().map(function(p){return {n:(p.presence&&p.presence.n)||'لاعب',sc:(p.presence&&p.presence.sc)||0,dn:(p.presence&&p.presence.dn)||0,me:p.isMe}});
  return r.sort(function(a,b){return b.sc-a.sc});
}
function renderDuel(){

  if(DU.state==='lobby'){
    h+='<div class="say"><div class="mas">'+hoopoe('happy',80)+'</div><div class="bubble"><p>تنافس مع صديق على جهاز آخر في اللحظة نفسها. يحتاج كلاكما أن يفتح الصفحة من حساب claude.ai.</p></div></div>'+
     '<button class="btn" data-act="duel-new">إنشاء غرفة</button><div class="field"><label for="ducode">أو انضم برمز</label><input type="text" id="ducode" maxlength="8" dir="ltr" placeholder="الرمز"><button class="btn ghost" data-act="duel-join">انضم</button></div>';
  }else if(DU.state==='wait'){
    const rk=duelRank();
    h+='<div class="center"><h2>رمز الغرفة</h2><div class="bigs" dir="ltr">'+esc(DU.code)+'</div><p class="muted">أعطِ الرمز لصديقك. اللاعبون الآن:</p><div class="lb" style="width:100%">'+rk.map(function(p){return '<div'+(p.me?' class="me"':'')+'><span>'+esc(p.n)+(p.me?' (أنت)':'')+'</span></div>'}).join('')+'</div>'+
     (DU.host?'<button class="btn" data-act="duel-go" '+(rk.length<2?'disabled':'')+'>ابدأ التحدي</button>':'<p class="muted">بانتظار صاحب الغرفة ليبدأ…</p>')+'</div>';
  }else if(DU.state==='play'){
    const q=DU.qs[DU.i],ans=DU.sel!==null;
    h+='<div class="gmeta"><span class="pill">'+N(DU.i+1)+' / '+N(DU.qs.length)+'</span><span class="pill">نقاطك '+N(DU.sc)+'</span></div><h2 class="qtext">'+esc(q.q)+'</h2><div class="opts">'+q.o.map(function(o,i){let c='';if(ans){if(o===q.c)c=' right';else if(i===DU.sel)c=' wrong'}return '<button class="opt'+c+'" data-duopt="'+i+'" '+(ans?'disabled':'')+'><span class="k">'+N(i+1)+'</span><span>'+esc(o)+'</span></button>'}).join('')+'</div>';
    if(ans)h+='<button class="btn" style="margin-top:12px" data-act="duel-next">'+(DU.i+1>=DU.qs.length?'النتيجة':'التالي')+'</button>';
    h+='<div class="lb" style="margin-top:12px">'+duelRank().map(function(p){return '<div'+(p.me?' class="me"':'')+'><span>'+esc(p.n)+'</span><span>'+N(p.sc)+'</span></div>'}).join('')+'</div>';
  }else{
    const rk=duelRank();
    h+='<div class="center"><div class="mas">'+hoopoe(rk[0]&&rk[0].me?'cheer':'happy',120)+'</div><h2>'+(rk[0]&&rk[0].me?'فزت!':'انتهى التحدي')+'</h2><div class="rank" style="width:100%">'+rk.map(function(p,i){return '<div><span>'+N(i+1)+'</span><span>'+esc(p.n)+(p.me?' (أنت)':'')+(p.dn?'':' …')+'</span><span>'+N(p.sc)+' نقطة</span></div>'}).join('')+'</div><button class="btn ghost" data-act="duel-close">إغلاق</button></div>';
  }
  h+='</div>';$('#lesson').innerHTML=h;
}
function duelAnswer(i){
  const q=DU.qs[DU.i];if(DU.sel!==null)return;
  DU.sel=i;const ok=q.o[i]===q.c;
  if(ok){DU.sc+=10;SND.correct()}else SND.wrong();
  S.q++;if(ok)S.qc++;act('q');
  DU.room.presence({n:duelName(),sc:DU.sc,dn:0}).catch(function(){});
  renderDuel();
}
function duelNext(){
  DU.i++;DU.sel=null;
  if(DU.i>=DU.qs.length){DU.state='end';DU.room.presence({n:duelName(),sc:DU.sc,dn:1}).catch(function(){});act('game');S.games++;addXP(Math.round(DU.sc/2));SND.win();confetti()}
  renderDuel();
}

/* ---------- التلاوة بالصوت (تجريبي) ---------- */
function voiceCheck(s,a,btn){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('متصفحك لا يدعم التعرّف على الصوت. جرّب Chrome.');return}
  const tx=Q.v[s-1][a-1],rec=new SR();rec.lang='ar-SA';rec.interimResults=false;rec.maxAlternatives=3;
  btn.textContent='أستمع إليك…';
  rec.onresult=function(e){
    const heard=skel(e.results[0][0].transcript).split(/\s+/).filter(Boolean),want=skel(tx).split(/\s+/).filter(Boolean);
    let hit=0;want.forEach(function(w){if(heard.indexOf(w)>=0)hit++});
    const p=want.length?Math.round(hit/want.length*100):0;
    btn.textContent='نطقي';
    toast('تطابق '+N(p)+'% '+(p>=85?'ممتاز، ما شاء الله':p>=50?'جيد، أعد المحاولة':'حاول مرة أخرى بوضوح')+' (تقدير آلي)');
    if(p>=85){SND.correct()}else SND.wrong();
  };
  rec.onerror=function(e){btn.textContent='نطقي';toast(e&&e.error==='not-allowed'?'لم يُسمح بالميكروفون في هذا العرض.':'تعذّر التعرّف على الصوت.')};
  rec.onend=function(){if(btn.textContent!=='نطقي')btn.textContent='نطقي'};
  try{rec.start()}catch(e){btn.textContent='نطقي'}
}

/* ================= ربط Google عبر Firebase (للنسخة المنشورة خارج claude.ai) ================= */
let FBCFG=null,FBAUTH=null,FBINIT=null;
const FBV='10.12.2';
function onClaude(){return !!(window.claude&&claude.use)}
function fbScript(u){return new Promise(function(res,rej){const s=document.createElement('script');s.src=u;s.async=true;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function fbConfig(){
  if(onClaude())return Promise.resolve(null);
  if(FBCFG)return Promise.resolve(FBCFG);
  return fetch('firebase-config.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    if(j&&typeof j.apiKey==='string'&&typeof j.projectId==='string'&&typeof j.authDomain==='string'&&!/^YOUR|^$/.test(j.apiKey)){FBCFG={apiKey:j.apiKey,authDomain:j.authDomain,projectId:j.projectId,appId:j.appId||'',storageBucket:j.storageBucket||'',messagingSenderId:j.messagingSenderId||''}}
    return FBCFG;
  }).catch(function(){return null});
}
function fbLoad(){
  if(FBINIT)return FBINIT;
  FBINIT=fbConfig().then(function(c){
    if(!c)return null;
    const b='https://www.gstatic.com/firebasejs/'+FBV+'/firebase-';
    return fbScript(b+'app-compat.js').then(function(){return Promise.all([fbScript(b+'auth-compat.js'),fbScript(b+'firestore-compat.js')])}).then(function(){
      if(!window.firebase)return null;
      if(!firebase.apps.length)firebase.initializeApp(c);
      FBAUTH=firebase.auth();
      return FBAUTH;
    });
  }).catch(function(){return null});
  return FBINIT;
}
function fbSetUser(u){
  UID=u.uid;ACCT={id:u.uid,name:u.displayName||'',email:u.email||''};
  DBH=firebase.firestore();
  S.acct={linked:true,fb:1};
  if(!S.prof||!S.prof.name){if(u.displayName){S.prof=S.prof||{};S.prof.name=(S.prof.name||u.displayName.split(' ')[0]).slice(0,24)}}
  save();
}
function fbBoard(){
  if(!DBH)return;
  try{
    DBH.collection('board').onSnapshot(function(snap){
      const rows=[];
      snap.docs.forEach(function(d){const v=d.data();if(v)rows.push({id:d.id,wk:v.wk,xp:+v.xp||0,has:+v.has||0,circle:v.circle||'',kh:+v.kh||0,kn:+v.kn||0,name:String(v.nm||'مستخدم').slice(0,24)})});
      BOARD=rows.filter(function(x){return x.wk===weekKey()}).sort(function(a,b){return b.xp-a.xp}).slice(0,10);
      CIRC=S.circle?rows.filter(function(x){return x.circle===S.circle}).sort(function(a,b){return (b.kn*6236+b.kh)-(a.kn*6236+a.kh)}).slice(0,12):[];
      if(typeof TAB!=='undefined'&&TAB==='ach')fillBoard();
    },function(){});
    syncBoard();
  }catch(e){}
}
function fbLink(){
  return fbLoad().then(function(auth){
    if(!auth){toast(g3(["الدخول بجوجل سيُفعَّل قريبًا في هذه النسخة (ينتظر إعداد المطوّر). تقدّمك محفوظ على جهازك.","Google sign-in will be enabled soon in this version (pending developer setup). Your progress is saved on your device.","La connexion Google sera bientôt activée (en attente de la configuration). Votre progression est enregistrée sur votre appareil."]));return false}
    const pr=new firebase.auth.GoogleAuthProvider();
    return auth.signInWithPopup(pr).then(function(r){
      fbSetUser(r.user);

function fbOut(del){
