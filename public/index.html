 ev:[['q','﴿سَنُرِيهِمْ آيَاتِنَا فِي الْآفَاقِ وَفِي أَنفُسِهِمْ حَتَّىٰ يَتَبَيَّنَ لَهُمْ أَنَّهُ الْحَقُّ﴾','فصلت 53'],['q','﴿لَقَدْ كَانَ فِي قَصَصِهِمْ عِبْرَةٌ لِّأُولِي الْأَلْبَابِ﴾','يوسف 111'],['q','﴿ادْعُ إِلَىٰ سَبِيلِ رَبِّكَ بِالْحِكْمَةِ وَالْمَوْعِظَةِ الْحَسَنَةِ وَجَادِلْهُم بِالَّتِي هِيَ أَحْسَنُ﴾','النحل 125']],
 q:[
  ['من وسائل القرآن في تثبيت العقيدة:','القصص القرآني','الإكراه على الإيمان','إهمال الأدلة العقلية','منع التفكير','القصص للعبرة والتثبيت.'],
  ['الآية الدالة على أسلوب النظر في آيات الكون والنفس:','﴿سَنُرِيهِمْ آيَاتِنَا فِي الْآفَاقِ وَفِي أَنفُسِهِمْ﴾','﴿وَأَقِيمُوا الصَّلَاةَ﴾','﴿وَلَا تَقْتُلُوا النَّفْسَ﴾','﴿أَوْفُوا بِالْعُقُودِ﴾','الآيات في الآفاق والأنفس دلائل على الخالق.'],
  ['قوله تعالى ﴿وَجَادِلْهُم بِالَّتِي هِيَ أَحْسَنُ﴾ يدلّ على أسلوب:','الحوار والجدال الحسن','الترهيب فقط','القصص','الأمثال فقط','النحل 125.'],
  ['﴿قُلْ هَاتُوا بُرْهَانَكُمْ﴾ يدلّ على:','طلب الدليل العقلي','التقليد','الإكراه','السكوت','القرآن يطالب كل مدّعٍ بالبرهان.'],
  ['من أغراض القصص القرآني:','العبرة وتثبيت قلب النبي والمؤمنين','التسلية فقط','سرد التاريخ للتاريخ','ذكر الأنساب','قال تعالى ﴿وَكُلًّا نَّقُصُّ عَلَيْكَ مِنْ أَنبَاءِ الرُّسُلِ مَا نُثَبِّتُ بِهِ فُؤَادَكَ﴾.'],
  ['الترغيب والترهيب يعني:','الوعد بالثواب والوعيد بالعقاب','الأمر بالصلاة فقط','تحريم الربا','الدعوة إلى الجهاد','أسلوب يربّي الرجاء والخوف معًا.'],
  ['ضرب الأمثال في القرآن غرضه:','تقريب المعاني إلى الأذهان','تعقيد الفكرة','التسلية','ذكر الأحكام الفقهية','﴿وَتِلْكَ الْأَمْثَالُ نَضْرِبُهَا لِلنَّاسِ لَعَلَّهُمْ يَتَفَكَّرُونَ﴾.'],
  ['من ثمار تثبيت العقيدة:','اليقين والتحصّن من الشبهات','الشك والحيرة','الغلو في الدين','التعصب','العقيدة الراسخة تحمي من الانحراف.']],
 es:['اذكر ثلاث وسائل استعملها القرآن في تثبيت العقيدة مع التمثيل.','1) التفكر في آيات الكون والنفس ﴿سَنُرِيهِمْ آيَاتِنَا فِي الْآفَاقِ﴾. 2) القصص للعبرة ﴿لَقَدْ كَانَ فِي قَصَصِهِمْ عِبْرَةٌ﴾. 3) الحوار والجدال بالحسنى ﴿وَجَادِلْهُم بِالَّتِي هِيَ أَحْسَنُ﴾. ويُضاف الترغيب والترهيب وضرب الأمثال وطلب البرهان.']},

{id:'S03',t:'من الرسالات السماوية المحرَّفة: اليهودية',tri:1,
 sec:[
  ['التعريف',['اليهودية: ديانة بني إسرائيل، نزل فيها كتاب التوراة على نبي الله موسى عليه السلام.','الأصل أنها رسالة سماوية جاءت بالتوحيد، ثم دخلها التحريف.']],
  ['مظاهر التحريف',['تحريف الكلم عن مواضعه وتبديل التوراة: ﴿يُحَرِّفُونَ الْكَلِمَ عَن مَّوَاضِعِهِ﴾.','التشبيه بنسبة الولد لله: ﴿وَقَالَتِ الْيَهُودُ عُزَيْرٌ ابْنُ اللَّهِ﴾.','دعوى أنهم شعب الله المختار وأبناؤه وأحباؤه.','قتل الأنبياء ونقض العهود وأكل الربا وأموال الناس بالباطل.']],
  ['موقف الإسلام',['الإيمان بموسى عليه السلام وبالتوراة الأصلية المنزلة.','بيّن القرآن التحريف وردّ الشبهات بالحجة، ودعا إلى العدل مع أهل الكتاب.']]],
 ev:[['q','﴿يُحَرِّفُونَ الْكَلِمَ عَن مَّوَاضِعِهِ﴾','المائدة 13'],['q','﴿وَقَالَتِ الْيَهُودُ عُزَيْرٌ ابْنُ اللَّهِ﴾','التوبة 30']],
 q:[
  ['الكتاب الذي أُنزل على موسى عليه السلام:','التوراة','الإنجيل','الزبور','الصحف','التوراة كتاب بني إسرائيل.'],
  ['مظهر من مظاهر تحريف اليهود:','تحريف الكلم عن مواضعه','التوحيد الخالص','الإيمان بجميع الرسل','العدل في الأموال','﴿يُحَرِّفُونَ الْكَلِمَ عَن مَّوَاضِعِهِ﴾.'],
  ['الآية التي تردّ على قول اليهود في عُزير:','﴿وَقَالَتِ الْيَهُودُ عُزَيْرٌ ابْنُ اللَّهِ﴾','﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾','﴿إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ﴾','﴿وَأَقِيمُوا الصَّلَاةَ﴾','التوبة 30 تذكر قولهم وتنكره.'],
  ['ادّعاء اليهود أنهم شعب الله المختار:','ادّعاء باطل لأن التفاضل بالتقوى','حقيقة ثابتة','أمر أقرّه القرآن','لا علاقة له بالعقيدة','﴿إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ﴾.'],
  ['موقف الإسلام من موسى عليه السلام:','الإيمان به نبيًّا ورسولًا','إنكار نبوّته','التقليل من شأنه','لا يذكره القرآن','المسلم يؤمن بجميع الأنبياء.'],
  ['من انحرافات بني إسرائيل التي ذكرها القرآن:','قتل الأنبياء ونقض العهد','طاعة الأنبياء','العمل بالتوراة كاملة','تحريم الربا','ذمّ القرآن قتلهم الأنبياء بغير حق.'],
  ['السبب الأساسي لتحريف الرسالات السابقة:','عدم حفظها وتدخل أهواء البشر','حفظ الله لها','اتفاق العلماء عليها','نزولها بلغة واحدة','لم يتعهد الله بحفظها كما تعهد بالقرآن.'],
  ['الكتاب الذي تكفّل الله بحفظه:','القرآن الكريم','التوراة','الإنجيل','الزبور','﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ﴾.']],
 es:['اذكر مظاهر انحراف اليهودية عن أصلها مع الدليل.','تحريف التوراة ﴿يُحَرِّفُونَ الْكَلِمَ عَن مَّوَاضِعِهِ﴾، ونسبة الولد لله ﴿عُزَيْرٌ ابْنُ اللَّهِ﴾، ودعوى الاصطفاء العنصري، وقتل الأنبياء ونقض العهود.']},

{id:'S04',t:'من الرسالات السماوية المحرَّفة: النصرانية',tri:1,
 sec:[
  ['التعريف',['النصرانية: ديانة أتباع عيسى عليه السلام، وكتابها الإنجيل.','عيسى عليه السلام عبد الله ورسوله، ولدته مريم عليها السلام بكلمة الله.']],
  ['مظاهر التحريف',['القول بالتثليث: ﴿لَقَدْ كَفَرَ الَّذِينَ قَالُوا إِنَّ اللَّهَ ثَالِثُ ثَلَاثَةٍ﴾.','ادّعاء ألوهية المسيح وبنوّته لله: ﴿لَقَدْ كَفَرَ الَّذِينَ قَالُوا إِنَّ اللَّهَ هُوَ الْمَسِيحُ ابْنُ مَرْيَمَ﴾.','عقيدة الصلب والفداء والخطيئة الأصلية.','تعدّد الأناجيل وفقدان الأصل وتدخل المجامع الكنسية.']],
  ['ردّ القرآن',['عيسى عبد الله: ﴿إِنْ هُوَ إِلَّا عَبْدٌ أَنْعَمْنَا عَلَيْهِ﴾.','نفي الصلب: ﴿وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ وَلَٰكِن شُبِّهَ لَهُمْ﴾.','خلق عيسى كخلق آدم: ﴿إِنَّ مَثَلَ عِيسَىٰ عِندَ اللَّهِ كَمَثَلِ آدَمَ﴾.']],
  ['موقف الإسلام',['الإيمان بعيسى عليه السلام وبالإنجيل المنزَّل، وإنكار ما أُدخل عليه من تحريف.']]],
 ev:[['q','﴿لَقَدْ كَفَرَ الَّذِينَ قَالُوا إِنَّ اللَّهَ ثَالِثُ ثَلَاثَةٍ﴾','المائدة 73'],['q','﴿وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ وَلَٰكِن شُبِّهَ لَهُمْ﴾','النساء 157'],['q','﴿إِنْ هُوَ إِلَّا عَبْدٌ أَنْعَمْنَا عَلَيْهِ﴾','الزخرف 59']],
 q:[
  ['الكتاب الذي أُنزل على عيسى عليه السلام:','الإنجيل','التوراة','الزبور','القرآن','الإنجيل كتاب النصارى.'],
  ['من مظاهر تحريف النصرانية:','القول بالتثليث','التوحيد الخالص','الإيمان بمحمد ﷺ','نفي ألوهية المسيح','التثليث: الأب والابن والروح القدس إلهًا واحدًا بثلاثة أقانيم.'],
  ['الآية التي تردّ على التثليث:','﴿لَقَدْ كَفَرَ الَّذِينَ قَالُوا إِنَّ اللَّهَ ثَالِثُ ثَلَاثَةٍ﴾','﴿وَأَحَلَّ اللَّهُ الْبَيْعَ﴾','﴿وَآتُوا الزَّكَاةَ﴾','﴿وَلَا تَقْرَبُوا الزِّنَا﴾','سورة المائدة الآية 73.'],
  ['موقف القرآن من صلب عيسى عليه السلام:','نفى الصلب وبيّن أنه رُفع','أثبته','سكت عنه','أمر بالاحتفال به','﴿وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ﴾.'],
  ['مكانة عيسى عليه السلام في الإسلام:','عبد الله ورسوله','ابن الله','ثالث ثلاثة','إله مع الله','﴿إِنْ هُوَ إِلَّا عَبْدٌ أَنْعَمْنَا عَلَيْهِ﴾.'],
  ['عقيدة الفداء والخطيئة الأصلية تتعارض مع:','أن كل نفس تتحمّل وزرها: ﴿وَلَا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَىٰ﴾','التوحيد فقط','وجود الأنبياء','الإيمان باليوم الآخر','القرآن يقرر المسؤولية الفردية.'],
  ['خلق عيسى عليه السلام من غير أب يشبه:','خلق آدم عليه السلام','خلق إبراهيم','خلق موسى','خلق نوح','﴿إِنَّ مَثَلَ عِيسَىٰ عِندَ اللَّهِ كَمَثَلِ آدَمَ﴾.'],
  ['موقف المسلم من الإنجيل المنزَّل:','الإيمان بأنه من عند الله مع إنكار التحريف','إنكاره كليًّا','العمل بما في الأناجيل الحالية','تجاهله','الإيمان بالكتب جميعها ركن من أركان الإيمان.']],
 es:['بيّن أهم مظاهر تحريف النصرانية وردّ القرآن عليها.','التثليث وألوهية المسيح وبنوّته والصلب والفداء. ردّ القرآن: ﴿لَقَدْ كَفَرَ الَّذِينَ قَالُوا إِنَّ اللَّهَ ثَالِثُ ثَلَاثَةٍ﴾، ﴿إِنْ هُوَ إِلَّا عَبْدٌ أَنْعَمْنَا عَلَيْهِ﴾، ﴿وَمَا قَتَلُوهُ وَمَا صَلَبُوهُ﴾.']},

{id:'S05',t:'الإسلام الرسالة الخاتمة',tri:1,
 sec:[
  ['معنى الخاتمية',['محمد ﷺ خاتم الأنبياء والمرسلين: ﴿وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ﴾.','لا نبي بعده، وشريعته ناسخة لما قبلها وباقية إلى قيام الساعة.']],
  ['خصائص الإسلام',['العالمية: ﴿وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِّلنَّاسِ﴾.','الكمال والشمول: ﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ﴾.','حفظ الوحي: ﴿إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ﴾.','اليسر والوسطية وصلاحيته لكل زمان ومكان.','القرآن مصدّق للكتب السابقة ومهيمن عليها.']],
  ['مقتضيات الإيمان بالخاتمية',['الاحتكام إلى القرآن والسنة، وعدم انتظار رسالة جديدة، والدعوة إلى الإسلام بالحكمة.']]],
 ev:[['q','﴿وَلَٰكِن رَّسُولَ اللَّهِ وَخَاتَمَ النَّبِيِّينَ﴾','الأحزاب 40'],['q','﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ وَأَتْمَمْتُ عَلَيْكُمْ نِعْمَتِي وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا﴾','المائدة 3'],['q','﴿وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِّلنَّاسِ بَشِيرًا وَنَذِيرًا﴾','سبأ 28']],
 q:[
  ['خاتم الأنبياء والمرسلين هو:','محمد ﷺ','عيسى عليه السلام','موسى عليه السلام','إبراهيم عليه السلام','﴿وَخَاتَمَ النَّبِيِّينَ﴾.'],
  ['الآية الدالة على عالمية الرسالة:','﴿وَمَا أَرْسَلْنَاكَ إِلَّا كَافَّةً لِّلنَّاسِ﴾','﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾','﴿وَأَقِيمُوا الصَّلَاةَ﴾','﴿وَلَا تَقْرَبُوا الزِّنَا﴾','سبأ 28.'],
  ['الآية الدالة على كمال الدين:','﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ﴾','﴿إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ﴾','﴿وَأَحَلَّ اللَّهُ الْبَيْعَ﴾','﴿وَجَادِلْهُم بِالَّتِي هِيَ أَحْسَنُ﴾','المائدة 3.'],
  ['الله تعالى تكفّل بحفظ:','القرآن الكريم','التوراة والإنجيل معًا','الأناجيل الأربعة','كل الكتب السابقة','﴿إِنَّا لَهُ لَحَافِظُونَ﴾.'],
  ['معنى أن القرآن «مهيمن» على الكتب السابقة:','شاهد عليها ورقيب يصحّح ما حُرّف منها','ناسخ لها بلا تصديق','مخالف لها كليًّا','لا علاقة له بها','﴿مُصَدِّقًا لِّمَا بَيْنَ يَدَيْهِ مِنَ الْكِتَابِ وَمُهَيْمِنًا عَلَيْهِ﴾.'],
  ['من خصائص الإسلام:','العالمية والصلاحية لكل زمان ومكان','أنه خاص بالعرب','أنه خاص بعصر النبوة','أنه يخالف الفطرة','رسالة عامة للناس كافة.'],
  ['معنى ختم النبوة:','لا نبي ولا رسول بعد محمد ﷺ','يأتي أنبياء بعده','النبوة للعرب فقط','انتهاء الدين','ختم الله به النبوة.'],
  ['من مقتضيات الإيمان بخاتمية الرسالة:','الاحتكام إلى القرآن والسنة','انتظار رسول جديد','ترك الأحكام الشرعية','الاكتفاء بالعقل','رسالة كاملة باقية.']],
 es:['اذكر خصائص الرسالة الإسلامية الخاتمة.','العالمية، الكمال والشمول، حفظ الوحي، اليسر والوسطية، صلاحيتها لكل زمان ومكان، وأن القرآن مصدّق ومهيمن على الكتب السابقة.']},

{id:'S06',t:'الدين عند الله الإسلام',tri:1,
 sec:[
  ['معنى الإسلام',['عامّ: الاستسلام لله بالتوحيد والانقياد له بالطاعة، وهو دين جميع الأنبياء.','خاصّ: الرسالة التي جاء بها محمد ﷺ، وهي الدين الذي يقبله الله اليوم.']],
  ['الأدلة',['﴿إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ﴾.','﴿وَمَن يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَن يُقْبَلَ مِنْهُ﴾.','إبراهيم عليه السلام: ﴿مَا كَانَ إِبْرَاهِيمُ يَهُودِيًّا وَلَا نَصْرَانِيًّا وَلَٰكِن كَانَ حَنِيفًا مُّسْلِمًا﴾.']],
  ['وحدة الدين وتعدد الشرائع',['الأصول واحدة: التوحيد والعبادة والأخلاق، والفروع والشرائع تختلف باختلاف الأمم: ﴿لِكُلٍّ جَعَلْنَا مِنكُمْ شِرْعَةً وَمِنْهَاجًا﴾.']]],
 ev:[['q','﴿إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ﴾','آل عمران 19'],['q','﴿وَمَن يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَن يُقْبَلَ مِنْهُ وَهُوَ فِي الْآخِرَةِ مِنَ الْخَاسِرِينَ﴾','آل عمران 85'],['q','﴿مَا كَانَ إِبْرَاهِيمُ يَهُودِيًّا وَلَا نَصْرَانِيًّا وَلَٰكِن كَانَ حَنِيفًا مُّسْلِمًا﴾','آل عمران 67']],
 q:[
  ['الآية: ﴿إِنَّ الدِّينَ عِندَ اللَّهِ الْإِسْلَامُ﴾ وردت في سورة:','آل عمران','البقرة','النساء','المائدة','الآية 19 من آل عمران.'],
  ['المعنى العام للإسلام:','الاستسلام لله بالتوحيد والانقياد له بالطاعة','الاسم الذي أُطلق على أتباع محمد ﷺ فقط','الانتماء إلى قومية','أداء الشعائر فقط','وهو دين جميع الأنبياء.'],
  ['المعنى الخاص للإسلام:','الرسالة التي جاء بها محمد ﷺ','دين نوح عليه السلام','دين موسى عليه السلام','دين عيسى عليه السلام','هي الدين الناسخ لما قبله.'],
  ['وصف القرآن لإبراهيم عليه السلام:','حنيفًا مسلمًا','يهوديًّا','نصرانيًّا','مشركًا','﴿وَلَٰكِن كَانَ حَنِيفًا مُّسْلِمًا﴾.'],
  ['الدين الذي لا يقبل الله غيره:','الإسلام','اليهودية','النصرانية','المجوسية','﴿وَمَن يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَن يُقْبَلَ مِنْهُ﴾.'],
  ['الأنبياء جميعًا اتفقوا في:','أصل الدين وهو التوحيد','كل الفروع والشرائع','لغة الكتب','الأمم المرسَل إليها','تختلف الشرائع وتتفق العقيدة.'],
  ['الآية الدالة على اختلاف الشرائع:','﴿لِكُلٍّ جَعَلْنَا مِنكُمْ شِرْعَةً وَمِنْهَاجًا﴾','﴿وَأَقِيمُوا الصَّلَاةَ﴾','﴿وَأَحَلَّ اللَّهُ الْبَيْعَ﴾','﴿وَلَا تَقْرَبُوا الزِّنَا﴾','المائدة 48.'],
  ['العلاقة بين الإسلام الخاص والعام:','الإسلام الخاص خاتمة وتمام للإسلام العام','تعارض تام','لا علاقة بينهما','الأول فقط صحيح','رسالة محمد ﷺ مصدّقة لما قبلها وناسخة.']],
 es:['وضّح معنى «الدين عند الله الإسلام» مع الدليل.','الإسلام بمعناه العام: الاستسلام لله وهو دين كل الأنبياء ﴿مَا كَانَ إِبْرَاهِيمُ يَهُودِيًّا وَلَا نَصْرَانِيًّا﴾. وبمعناه الخاص: رسالة محمد ﷺ الناسخة ﴿وَمَن يَبْتَغِ غَيْرَ الْإِسْلَامِ دِينًا فَلَن يُقْبَلَ مِنْهُ﴾.']},

{id:'S07',t:'الإسلام والرسالات السماوية السابقة',tri:1,
 sec:[
  ['أوجه الاتفاق',['المصدر الإلهي الواحد، والتوحيد أصل الدعوة.','الإيمان بالبعث والجزاء والقيم الأخلاقية العامة.','وحدة الهدف: إخراج الناس من عبادة العباد إلى عبادة رب العباد.']],
  ['موقف الإسلام منها',['الإيمان بجميع الأنبياء والكتب دون تفريق: ﴿لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ﴾.','القرآن مصدّق لما بين يديه ومهيمن عليه، وشريعة الإسلام ناسخة للشرائع قبلها.','الدعوة إلى كلمة سواء: ﴿قُلْ يَا أَهْلَ الْكِتَابِ تَعَالَوْا إِلَىٰ كَلِمَةٍ سَوَاءٍ بَيْنَنَا وَبَيْنَكُمْ﴾.','التسامح وعدم الإكراه: ﴿لَا إِكْرَاهَ فِي الدِّينِ﴾.']],
  ['أوجه الاختلاف',['التحريف الذي أصاب الكتب السابقة، وخصوصية رسالاتها بأقوامها وأزمانها.','القرآن محفوظ، ورسالة الإسلام عامة وخاتمة.']]],
 ev:[['q','﴿لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ﴾','البقرة 285'],['q','﴿قُلْ يَا أَهْلَ الْكِتَابِ تَعَالَوْا إِلَىٰ كَلِمَةٍ سَوَاءٍ بَيْنَنَا وَبَيْنَكُمْ أَلَّا نَعْبُدَ إِلَّا اللَّهَ﴾','آل عمران 64'],['q','﴿لَا إِكْرَاهَ فِي الدِّينِ﴾','البقرة 256']],
 q:[
  ['من أوجه الاتفاق بين الرسالات السماوية:','التوحيد','الشرائع والفروع كلها','لغة الكتب','أسماء الأنبياء','الأصل واحد وإن اختلفت الشرائع.'],
  ['موقف المسلم من الأنبياء السابقين:','الإيمان بهم جميعًا دون تفريق','الإيمان ببعضهم فقط','إنكارهم','تفضيل بعضهم بلا دليل','﴿لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِّن رُّسُلِهِ﴾.'],
  ['معنى كون الإسلام ناسخًا للشرائع السابقة:','حلّت شريعته محلّ ما قبلها','أنكر الأنبياء','حرّف الكتب','لا يعترف بها','تبقى أصولها في الإسلام وتُنسخ الأحكام.'],
  ['الدعوة القرآنية لأهل الكتاب إلى:','كلمة سواء: عبادة الله وحده','القتال دائمًا','ترك دينهم بالقوة','المقاطعة','آل عمران 64.'],
  ['القاعدة الشرعية في الدين:','﴿لَا إِكْرَاهَ فِي الدِّينِ﴾','﴿اقْتُلُوا الْمُشْرِكِينَ كَافَّةً﴾ بلا قيد','إكراه الناس على الإسلام','تحريم الحوار','البقرة 256.'],
  ['من أوجه الاختلاف بين الإسلام والرسالات السابقة:','القرآن محفوظ من التحريف','التوحيد','الإيمان باليوم الآخر','القيم الأخلاقية','الكتب السابقة لحقها التحريف.'],
  ['الرسالات السابقة كانت:','خاصة بأقوامها وأزمانها','عالمية','خاتمة','محفوظة بالتعهد الإلهي','خاتميتها وعالميتها للإسلام.'],
  ['الهدف المشترك لجميع الأنبياء:','دعوة الناس إلى عبادة الله وحده','جمع الأموال','الحكم والسلطان','تغيير اللغات','﴿وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَّسُولًا أَنِ اعْبُدُوا اللَّهَ﴾.']],
 es:['بيّن موقف الإسلام من الرسالات السماوية السابقة.','يؤمن المسلم بجميع الأنبياء والكتب دون تفريق، ويرى القرآن مصدّقًا ومهيمنًا عليها، ويدعو أهل الكتاب إلى كلمة سواء ولا إكراه في الدين، ويبيّن ما أصابها من تحريف، وأن الإسلام ناسخ للشرائع السابقة وخاتم لها.']},

{id:'S08',t:'العقل وموقف القرآن منه',tri:1,
 sec:[
  ['مفهوم العقل',['قوة في الإنسان بها يدرك ويفهم ويميّز بين الخير والشر، وهو مناط التكليف.','ورد في القرآن بصيغ الفعل: يعقلون، يتفكرون، يتدبرون، وبألفاظ: أولو الألباب، أولو النُّهى.']],
  ['مكانة العقل',['دعا القرآن إلى التفكر والنظر والتدبر: ﴿أَفَلَا يَتَدَبَّرُونَ الْقُرْآنَ﴾.','رفع العلم والعلماء: ﴿قُلْ هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ﴾.','ذمّ تعطيل العقل والتقليد الأعمى: ﴿إِنَّا وَجَدْنَا آبَاءَنَا عَلَىٰ أُمَّةٍ﴾.','ذمّ اتباع الظن والهوى: ﴿إِن يَتَّبِعُونَ إِلَّا الظَّنَّ﴾.']],
  ['حدود العقل ومجالاته',['العقل يُستعمل في التأمل في الكون والعلوم والاجتهاد وفهم النصوص.','الغيبيات تثبت بالوحي لا بالعقل وحده، ولا يعارض العقل الصريح النقل الصحيح.']]],
 ev:[['q','﴿أَفَلَا يَتَدَبَّرُونَ الْقُرْآنَ﴾','النساء 82'],['q','﴿قُلْ هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ﴾','الزمر 9'],['q','﴿إِنَّا وَجَدْنَا آبَاءَنَا عَلَىٰ أُمَّةٍ وَإِنَّا عَلَىٰ آثَارِهِم مُّهْتَدُونَ﴾','الزخرف 22']],
 q:[
  ['العقل في الإسلام هو:','مناط التكليف وأداة الفهم والتمييز','مصدر العقيدة الوحيد','مصدر الأحكام الوحيد','عدوّ الوحي','لا تكليف على فاقد العقل.'],
  ['من ألفاظ العقل في القرآن:','أولو الألباب','أهل الكتاب','أولو الأرحام','أولو الأمر فقط','أولو الألباب أصحاب العقول.'],
  ['ذمّ القرآن:','التقليد الأعمى للآباء','التفكر في الكون','طلب العلم','التدبر','﴿إِنَّا وَجَدْنَا آبَاءَنَا عَلَىٰ أُمَّةٍ﴾.'],
  ['الآية الدالة على تفاضل أهل العلم:','﴿قُلْ هَلْ يَسْتَوِي الَّذِينَ يَعْلَمُونَ وَالَّذِينَ لَا يَعْلَمُونَ﴾','﴿إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ﴾','﴿وَأَحَلَّ اللَّهُ الْبَيْعَ﴾','﴿وَأَقِيمُوا الصَّلَاةَ﴾','الزمر 9.'],
  ['اتباع الظن والهوى في العقيدة:','مذموم في القرآن','محمود','واجب','مباح دائمًا','﴿إِن يَتَّبِعُونَ إِلَّا الظَّنَّ﴾.'],
  ['حدّ العقل في الأمور الغيبية:','يعتمد فيها على الوحي','يستقل بإثباتها','لا يُسأل عنها أحد','تُترك للتجربة','لا تُدرك الغيبيات إلا بخبر الوحي.'],
  ['العلاقة بين العقل والنقل الصحيح:','لا تعارض بينهما','تناقض دائم','العقل مقدَّم دائمًا','النقل يلغي العقل','العقل الصريح لا يخالف النقل الصحيح.'],
  ['من مجالات استعمال العقل:','التفكر في الكون والاجتهاد في الأحكام','إنكار الغيب','تحريم العلم','التقليد المحض','القرآن يدعو إلى النظر والتدبر.']],
 es:['وضّح موقف القرآن من العقل.','القرآن يكرّم العقل ويجعله مناط التكليف، ويدعو إلى التفكر والتدبر والعلم، ويذمّ التقليد الأعمى واتباع الظن، ويجعل مجاله الكون والاجتهاد، ويجعل الغيبيات للوحي.']},

{id:'S09',t:'مقاصد الشريعة الإسلامية',tri:1,
 sec:[
  ['التعريف والأهمية',['هي الغايات والأهداف التي وضعت الشريعة لتحقيقها من مصالح العباد في الدنيا والآخرة.','تُعين على فهم النصوص والاجتهاد وإدراك حكمة التشريع. الأصل العام: ﴿وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِّلْعَالَمِينَ﴾.']],
  ['مراتب المقاصد',['الضروريات: ما لا بد منه لقيام الحياة، وهي خمس: حفظ الدين، النفس، العقل، النسل، المال.','الحاجيات: ما يرفع الحرج والمشقة عن الناس (كالرخص).','التحسينيات: ما يتعلق بمكارم الأخلاق وجمال العادات.']],
  ['أمثلة',['حفظ النفس: القصاص ﴿وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ﴾.','حفظ العقل: تحريم الخمر والمسكرات.','حفظ المال: تحريم السرقة وأكل المال بالباطل.','حفظ النسل: الزواج وتحريم الزنا.','حفظ الدين: الدعوة والجهاد المشروع وحرية العقيدة.']]],
 ev:[['q','﴿وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِّلْعَالَمِينَ﴾','الأنبياء 107'],['q','﴿وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ يَا أُولِي الْأَلْبَابِ﴾','البقرة 179']],
 q:[
  ['الضروريات الخمس هي:','الدين والنفس والعقل والنسل والمال','الدين والعلم والمال والجاه والقوة','الصلاة والصوم والزكاة والحج والجهاد','العقل والعلم والفن والسياسة والاقتصاد','هي أصول المصالح التي لا تقوم الحياة بدونها.'],
  ['القصاص يحقق مقصد حفظ:','النفس','المال','العقل','النسل','﴿وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ﴾.'],
  ['تحريم الخمر يحقق مقصد حفظ:','العقل','الدين','النسل','المال','المسكرات تُذهب العقل.'],
  ['الرخص الشرعية تدخل في مرتبة:','الحاجيات','الضروريات','التحسينيات','لا علاقة لها بالمقاصد','تُرفع بها المشقة والحرج.'],
  ['مكارم الأخلاق وآداب الطعام تدخل في:','التحسينيات','الضروريات','الحاجيات','المحرمات','تكمّل الحياة وتجمّلها.'],
  ['من فوائد دراسة المقاصد:','فهم النصوص والاجتهاد','تعطيل النصوص','إبطال الأحكام','ترك التقليد كليًّا','المقاصد تضبط الاجتهاد ولا تلغي النص.'],
  ['تحريم الزنا ومشروعية الزواج يحقق حفظ:','النسل','المال','العقل','الدين','حفظ الأنساب.'],
  ['تحريم السرقة وأكل أموال الناس بالباطل يحقق حفظ:','المال','النفس','العقل','الدين','حماية الملكية.']],
 es:['عرّف مقاصد الشريعة واذكر مراتبها.','المقاصد: غايات التشريع لتحقيق مصالح العباد في الدنيا والآخرة. مراتبها: ضروريات (الدين والنفس والعقل والنسل والمال)، وحاجيات (رفع الحرج)، وتحسينيات (مكارم الأخلاق).']},

{id:'S10',t:'منهج الإسلام في محاربة الانحراف والجريمة',tri:1,
 sec:[
  ['مفهوم الانحراف والجريمة',['الانحراف: الخروج عن السلوك القويم والقيم المعتبرة. الجريمة: فعل محرَّم شرعًا يستوجب عقوبة.']],
  ['من أسباب الانحراف',['ضعف الوازع الديني وغياب القدوة.','التفكك الأسري وسوء التربية.','رفقاء السوء والفراغ.','الفقر والبطالة، ووسائل إعلام وتواصل تروّج للفساد.']],
  ['منهج الإسلام',['الوقاية: التربية الإيمانية، وتقوية الأسرة، والرفقة الصالحة، وشغل الفراغ بالنافع، والتعليم.','العقوبات الرادعة: الحدود والقصاص والتعزير، مع درء الحدود بالشبهات وعدم عقاب إلا بنص. مثال: ﴿وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا﴾.','العلاج والإصلاح: فتح باب التوبة والتأهيل وإعادة الاندماج.','الأمر بالمعروف والنهي عن المنكر مسؤولية المجتمع.']]],
 ev:[['q','﴿وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا جَزَاءً بِمَا كَسَبَا نَكَالًا مِّنَ اللَّهِ﴾','المائدة 38'],['q','﴿وَلْتَكُن مِّنكُمْ أُمَّةٌ يَدْعُونَ إِلَى الْخَيْرِ وَيَأْمُرُونَ بِالْمَعْرُوفِ وَيَنْهَوْنَ عَنِ الْمُنكَرِ﴾','آل عمران 104']],
 q:[
  ['من أسباب الانحراف:','ضعف الوازع الديني والتفكك الأسري','التربية الإيمانية','الرفقة الصالحة','شغل الوقت بالنافع','الأسباب نفسية واجتماعية واقتصادية.'],
  ['يبدأ منهج الإسلام في مكافحة الجريمة بـ:','الوقاية والتربية','العقوبة فقط','الإهمال','التشهير','الوقاية خير من العلاج.'],
  ['العقوبات في الإسلام أنواعها:','حدود وقصاص وتعازير','زكاة وصيام','صلاة وحج','كفارات فقط','تتدرج بحسب الجريمة.'],
  ['من ضمانات العدالة في العقوبة:','درء الحدود بالشبهات','العقاب بلا بيّنة','العقاب بالظن','العقاب الجماعي','إذا قامت شبهة لا يُقام الحد.'],
  ['من أساليب العلاج في الإسلام:','فتح باب التوبة والإصلاح','نبذ المنحرف نهائيًّا','تجاهله','الانتقام','التوبة تمحو الذنب وتعيد الاندماج.'],
  ['الآية التي تتعلق بحدّ السرقة:','﴿وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا﴾','﴿وَأَحَلَّ اللَّهُ الْبَيْعَ﴾','﴿وَأَقِيمُوا الصَّلَاةَ﴾','﴿إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ﴾','المائدة 38.'],
  ['دور المجتمع في مكافحة الانحراف:','الأمر بالمعروف والنهي عن المنكر','الصمت','التبرير','تجاهل المنحرفين','مسؤولية جماعية.'],
  ['من وسائل الوقاية من الانحراف:','شغل أوقات الفراغ بالنافع ومصاحبة الصالحين','السهر مع رفقاء السوء','ترك الأبناء بلا رقابة','إهمال التعليم','التربية والرعاية والرفقة الصالحة.']],
 es:['بيّن منهج الإسلام في الوقاية من الجريمة وعلاجها.','الوقاية: تربية إيمانية وأسرة متماسكة ورفقة صالحة وشغل الفراغ. العلاج: عقوبات رادعة (حدود وقصاص وتعزير) مع ضمانات العدالة ودرء الحدود بالشبهات، وفتح باب التوبة وإعادة التأهيل.']},

{id:'S11',t:'المساواة أمام أحكام الشريعة الإسلامية',tri:1,
 sec:[
  ['مفهوم المساواة',['التسوية بين الناس في الحقوق والواجبات بلا تمييز بسبب الجنس أو اللون أو النسب أو المال.']],
  ['أساسها في الشريعة',['وحدة الأصل: الناس من آدم وآدم من تراب: ﴿يَا أَيُّهَا النَّاسُ إِنَّا خَلَقْنَاكُم مِّن ذَكَرٍ وَأُنثَىٰ﴾.','الكرامة الإنسانية: ﴿وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ﴾.','التفاضل بالتقوى والعمل: ﴿إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ﴾.']],
  ['مجالاتها',['أمام القضاء: قال النبي ﷺ في قصة المخزومية: «لو أن فاطمة بنت محمد سرقت لقطعت يدها» (متفق عليه).','في التكاليف والجزاء بين الرجل والمرأة: ﴿مَنْ عَمِلَ صَالِحًا مِّن ذَكَرٍ أَوْ أُنثَىٰ وَهُوَ مُؤْمِنٌ فَلَنُحْيِيَنَّهُ حَيَاةً طَيِّبَةً﴾.','في الحقوق العامة كالتعليم والتملك والعمل.']],
  ['ملاحظة',['المساواة لا تعني التطابق في كل شيء: فقد تختلف الأحكام تبعًا لاختلاف الأدوار والمسؤوليات مع بقاء العدل والكرامة للجميع.']]],
 ev:[['q','﴿إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ﴾','الحجرات 13'],['q','﴿وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ﴾','الإسراء 70'],['h','«لو أن فاطمة بنت محمد سرقت لقطعت يدها»','متفق عليه']],
 q:[
  ['أساس التفاضل بين الناس في الإسلام:','التقوى والعمل الصالح','النسب','اللون','المال','﴿إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ﴾.'],
  ['الآية التي تبيّن كرامة الإنسان:','﴿وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ﴾','﴿وَأَحَلَّ اللَّهُ الْبَيْعَ﴾','﴿وَأَقِيمُوا الصَّلَاةَ﴾','﴿وَلَا تَقْرَبُوا الزِّنَا﴾','الإسراء 70.'],
  ['مثال المساواة أمام القضاء:','حديث المرأة المخزومية','حديث جبريل','حديث النيات','حديث الربا','«لو أن فاطمة بنت محمد سرقت لقطعت يدها».'],
  ['من مجالات المساواة:','التكليف والجزاء بين الرجل والمرأة','الميراث مطابق في كل الحالات','لا مساواة في الإسلام','المساواة في اللون فقط','﴿مَنْ عَمِلَ صَالِحًا مِّن ذَكَرٍ أَوْ أُنثَىٰ﴾.'],
  ['وحدة الأصل الإنساني تعني:','الناس جميعًا من آدم وآدم من تراب','العرب أفضل من غيرهم','البيض أفضل','الأغنياء أفضل','﴿إِنَّا خَلَقْنَاكُم مِّن ذَكَرٍ وَأُنثَىٰ﴾.'],
  ['اختلاف بعض الأحكام بين الرجل والمرأة:','لا يناقض المساواة لأنه راجع إلى اختلاف الأدوار','يعني الظلم','ينفي الكرامة','دليل على التفاضل بالجنس','المساواة لا تعني التطابق.'],
  ['العلاقة بين المساواة والعدل:','المساواة صورة من صور العدل','تناقضان','لا علاقة بينهما','العدل يلغي المساواة','أمر الله بالعدل بين الناس.'],
  ['الأعراق والألوان في ميزان الإسلام:','لا فضل بها وإنما بالتقوى','أساس التفاضل','سبب الاستعباد','تحدد المكانة','«لا فضل لعربي على أعجمي إلا بالتقوى».']],
 es:['اشرح مبدأ المساواة أمام أحكام الشريعة مع الأدلة.','التسوية بين الناس في الحقوق والواجبات: وحدة الأصل ﴿إِنَّا خَلَقْنَاكُم مِّن ذَكَرٍ وَأُنثَىٰ﴾، الكرامة ﴿وَلَقَدْ كَرَّمْنَا بَنِي آدَمَ﴾، التفاضل بالتقوى ﴿إِنَّ أَكْرَمَكُمْ عِندَ اللَّهِ أَتْقَاكُمْ﴾، والمساواة أمام القضاء كقصة المخزومية.']}
];

/* ===== المدرسية: السنة الثالثة ثانوي — العلوم الإسلامية — الفصل الثاني ===== */
const SCH2=[
{id:'S12',t:'الصحة النفسية والجسمية في القرآن الكريم',tri:2,
 sec:[
  ['مفهوم الصحة في الإسلام',['الصحة نعمة عظيمة يُسأل عنها العبد، وهي سلامة البدن والنفس معًا.','الإسلام يوازن بين حاجات الجسد وحاجات الروح فلا رهبانية ولا إسراف.','حفظ النفس من الضرورات الخمس التي جاءت الشريعة بحمايتها.']],
  ['الصحة الجسمية',['الطهارة والنظافة: الوضوء والغسل وتحريم الخبائث.','الاعتدال في الأكل والشرب وتحريم الإسراف والمسكرات والمضارّ.','العلاج والتداوي مشروع، والأخذ بالأسباب لا ينافي التوكل.','القوة البدنية والرياضة والراحة والنوم وعدم تحميل البدن فوق طاقته.','الحجر الصحي وتجنب أسباب العدوى والنهي عن إلقاء النفس في التهلكة.']],
  ['الصحة النفسية',['الإيمان بالله والذكر والصلاة مصدر الطمأنينة.','الصبر عند البلاء والرضا بالقضاء والقدر ومحاربة اليأس والقنوط.','تزكية النفس من الحسد والحقد والكبر والقلق المرضي.','الصحبة الصالحة والتواصل الاجتماعي والتكافل يخفف الضغوط.','القرآن شفاء ورحمة للمؤمنين، وهو علاج لما في الصدور.']]],
 ev:[['q','﴿وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ﴾','الإسراء 82'],['q','﴿وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا﴾','الأعراف 31'],['q','﴿وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ﴾','البقرة 195'],['q','﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾','الرعد 28'],['h','«المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف، وفي كلٍّ خير»','رواه مسلم'],['h','«إن لبدنك عليك حقًّا»','رواه البخاري']],
 q:[
  ['الآية التي تدل على أن القرآن علاج للنفوس هي:','﴿وَنُنَزِّلُ مِنَ الْقُرْآنِ مَا هُوَ شِفَاءٌ وَرَحْمَةٌ لِّلْمُؤْمِنِينَ﴾','﴿وَأَحَلَّ اللَّهُ الْبَيْعَ﴾','﴿لَا إِكْرَاهَ فِي الدِّينِ﴾','﴿وَلَا تَقْرَبُوا الزِّنَا﴾','سورة الإسراء الآية 82.'],
  ['من مظاهر الاعتدال في الصحة الجسمية الذي أمر به القرآن:','عدم الإسراف في الأكل والشرب','ترك التداوي توكلًا','الامتناع عن الطعام للتعبد','الإكثار من الأكل لتقوية الجسم','﴿وَكُلُوا وَاشْرَبُوا وَلَا تُسْرِفُوا﴾.'],
  ['التداوي في الإسلام:','مشروع ولا ينافي التوكل','محرم لأنه ينافي القدر','واجب في كل حال','مكروه دائمًا','الأخذ بالأسباب من تمام التوكل.'],
  ['الآية التي تنهى عن تعريض النفس للخطر هي:','﴿وَلَا تُلْقُوا بِأَيْدِيكُمْ إِلَى التَّهْلُكَةِ﴾','﴿وَأَوْفُوا بِالْعَهْدِ﴾','﴿إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ﴾','﴿اقْرَأْ بِاسْمِ رَبِّكَ﴾','البقرة 195.'],
  ['أهم مصدر للطمأنينة النفسية في الإسلام:','الإيمان وذكر الله','جمع المال','كثرة الترفيه','الانعزال عن الناس','﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾.'],
  ['الحجر الصحي من الوقاية الجسمية لأن فيه:','تجنب أسباب العدوى وحفظ النفس','إثبات العجز عن القدر','مخالفة التوكل','عقابًا للمريض','حفظ النفس من مقاصد الشريعة.']],
 es:['بيّن كيف جمع القرآن الكريم بين الصحة الجسمية والصحة النفسية.','الصحة الجسمية: الطهارة، الاعتدال في الأكل والشرب، التداوي، تجنب التهلكة. الصحة النفسية: الإيمان والذكر والصبر والرضا وتزكية النفس، والقرآن شفاء لما في الصدور. وبذلك يتحقق التوازن بين الروح والجسد.']},

{id:'S13',t:'الإجماع',tri:2,
 sec:[
  ['تعريف الإجماع',['لغةً: العزم والاتفاق.','اصطلاحًا: اتفاق المجتهدين من أمة محمد ﷺ في عصر من العصور بعد وفاته على حكم شرعي.','هو الدليل الثالث من الأدلة المتفق عليها بعد الكتاب والسنة.']],
  ['أركانه وشروطه',['وجود مجتهدين متعددين في العصر.','اتفاق جميع المجتهدين فلا يُعتد بمخالفة واحد منهم.','أن يكون الاتفاق على حكم شرعي مستند إلى دليل (نص أو قياس أو مصلحة).','أن يكون بعد وفاة النبي ﷺ لأن الوحي كان ينزل في حياته.']],
  ['أنواعه',['الإجماع الصريح: يصرّح كل مجتهد برأيه قولًا أو فعلًا.','الإجماع السكوتي: يقول بعضهم ويسكت الباقون بعد العلم من غير إنكار (وفيه خلاف في حجيته).']],
  ['حجيته وأمثلته',['هو حجة قاطعة عند الجمهور، ويحرم مخالفته.','مثاله: جمع القرآن في مصحف واحد في عهد أبي بكر الصديق رضي الله عنه.','مثاله: توريث الجدة السدس، وتحريم شحم الخنزير.','مثاله: خلافة أبي بكر الصديق رضي الله عنه.']]],
 ev:[['q','﴿وَمَن يُشَاقِقِ الرَّسُولَ مِن بَعْدِ مَا تَبَيَّنَ لَهُ الْهُدَىٰ وَيَتَّبِعْ غَيْرَ سَبِيلِ الْمُؤْمِنِينَ نُوَلِّهِ مَا تَوَلَّىٰ﴾','النساء 115'],['h','«إن الله لا يجمع أمتي على ضلالة»','رواه ابن ماجه وغيره بمعناه']],
 q:[
  ['الإجماع اصطلاحًا هو:','اتفاق المجتهدين بعد وفاة النبي ﷺ على حكم شرعي','اتفاق عامة الناس على أمر','اتفاق الحكام على قانون','رأي الأغلبية في مجلس','التعريف الأصولي المشهور.'],
  ['ترتيب الإجماع بين الأدلة المتفق عليها:','الثالث','الأول','الثاني','الرابع','الكتاب ثم السنة ثم الإجماع ثم القياس.'],
  ['الإجماع الذي يصرّح فيه كل مجتهد برأيه يسمى:','الصريح','السكوتي','الظني','المرسل','الإجماع السكوتي يسكت فيه بعضهم.'],
  ['من أمثلة الإجماع:','جمع القرآن في مصحف واحد','وجوب الصلوات الخمس بنص صريح فقط دون اتفاق','فرض الحج بقياس','قصر الصلاة بالرأي المنفرد','أجمع الصحابة على جمع المصحف.'],
  ['من شروط الإجماع:','أن يكون بعد وفاة النبي ﷺ','أن يكون في حياة النبي ﷺ','اتفاق العوام دون المجتهدين','مخالفة بعض المجتهدين','لأن الوحي ينزل في حياته.'],
  ['الآية التي استدل بها العلماء على حجية الإجماع:','﴿وَيَتَّبِعْ غَيْرَ سَبِيلِ الْمُؤْمِنِينَ﴾','﴿وَأَقِيمُوا الصَّلَاةَ﴾','﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾','﴿وَلَا تَقْتُلُوا أَوْلَادَكُمْ﴾','النساء 115.']],
 es:['عرّف الإجماع ثم اذكر شروطه ومثالًا عليه.','الإجماع هو اتفاق مجتهدي الأمة بعد وفاة النبي ﷺ في عصر على حكم شرعي. من شروطه: تعدد المجتهدين، واتفاقهم جميعًا، واستناده إلى دليل، ووقوعه بعد وفاة النبي ﷺ. مثاله: جمع القرآن في مصحف واحد.']},

{id:'S14',t:'القياس',tri:2,
 sec:[
  ['تعريف القياس',['لغةً: التقدير والمساواة.','اصطلاحًا: إلحاق أمر غير منصوص على حكمه بأمر منصوص عليه لاشتراكهما في علة الحكم.','هو الدليل الرابع من الأدلة المتفق عليها عند الجمهور.']],
  ['أركانه الأربعة',['الأصل: المحل المنصوص على حكمه (الخمر).','الفرع: المحل الذي لا نص فيه (المخدرات).','حكم الأصل: الحكم الشرعي الثابت بالنص (التحريم).','العلة: الوصف الجامع بين الأصل والفرع (الإسكار وتغييب العقل).']],
  ['شروط العلة',['أن تكون ظاهرة يمكن إدراكها.','منضبطة غير مضطربة.','مناسبة للحكم.','متعدية أي توجد في غير الأصل.']],
  ['حجيته وأنواعه',['دل عليه الأمر بالاعتبار، وعمل الصحابة، وحديث معاذ بن جبل في الاجتهاد بالرأي.','قياس الأولى: كقياس تحريم ضرب الوالدين على تحريم التأفف لهما.','قياس المساواة: كقياس تحريم إتلاف مال اليتيم بالحرق على تحريم أكله.']]],
 ev:[['q','﴿فَاعْتَبِرُوا يَا أُولِي الْأَبْصَارِ﴾','الحشر 2'],['q','﴿فَلَا تَقُل لَّهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا﴾','الإسراء 23'],['h','حديث معاذ بن جبل: «أجتهد رأيي ولا آلو»','رواه أبو داود والترمذي']],
 q:[
  ['القياس هو إلحاق فرع بأصل في الحكم لاشتراكهما في:','العلة','الاسم','المكان','الزمان','العلة هي الوصف الجامع.'],
  ['من أركان القياس:','الأصل والفرع وحكم الأصل والعلة','الحاكم والمحكوم','الوارث والمورّث','الراوي والمروي','أركانه أربعة.'],
  ['في قياس المخدرات على الخمر تكون العلة:','الإسكار وتغييب العقل','اللون','الاسم','الثمن','العلة الجامعة بينهما.'],
  ['قياس تحريم ضرب الوالدين على التأفف هو:','قياس الأولى','قياس الشبه','قياس عكسي','استحسان','الضرب أشد من التأفف فهو أولى بالتحريم.'],
  ['من شروط العلة:','أن تكون ظاهرة منضبطة','أن تكون خفية مضطربة','أن تخص الأصل وحده','أن تخالف النص','حتى يمكن تعديتها إلى الفرع.'],
  ['الدليل على حجية القياس قوله تعالى:','﴿فَاعْتَبِرُوا يَا أُولِي الْأَبْصَارِ﴾','﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾','﴿وَأَقِيمُوا الصَّلَاةَ﴾','﴿لَا إِكْرَاهَ فِي الدِّينِ﴾','الحشر 2.']],
 es:['اذكر أركان القياس مع التمثيل.','أركانه: الأصل (الخمر)، والفرع (المخدرات)، وحكم الأصل (التحريم)، والعلة (الإسكار). فيُلحق الفرع بالأصل في التحريم لاشتراكهما في العلة.']},

{id:'S15',t:'المصلحة المرسلة',tri:2,
 sec:[
  ['تعريفها',['المصلحة: جلب نفع أو دفع ضرر بما يوافق مقاصد الشريعة.','المصلحة المرسلة: مصلحة لم يرد في الشرع نص باعتبارها ولا بإلغائها، وتحقق مقصودًا من مقاصد الشريعة.','سميت مرسلة لأنها مطلقة غير مقيدة بدليل خاص.']],
  ['أقسام المصالح',['معتبرة: شهد الشرع لها كحفظ النفس بالقصاص.','ملغاة: ألغاها الشرع كمصلحة الربا في زيادة المال.','مرسلة: سكت عنها الشرع فلا اعتبار ولا إلغاء.']],
  ['شروط العمل بها',['أن تلائم مقاصد الشريعة ولا تنافي أصلًا من أصولها.','أن تكون معقولة في ذاتها.','أن تحقق نفعًا حقيقيًّا أو تدفع ضررًا حقيقيًّا لا وهميًّا.','أن تكون عامة لا خاصة بفرد.','ألا تعارض نصًّا قطعيًّا أو إجماعًا.']],
  ['أمثلة',['جمع القرآن في مصحف واحد، وتدوين الدواوين.','اتخاذ السجون وسك النقود.','توثيق عقود الزواج والملكية، وتنظيم المرور.','المالكية أكثر المذاهب أخذًا بها.']]],
 ev:[['h','«لا ضرر ولا ضرار»','رواه ابن ماجه'],['q','﴿وَمَا جَعَلَ عَلَيْكُمْ فِي الدِّينِ مِنْ حَرَجٍ﴾','الحج 78']],
 q:[
  ['المصلحة المرسلة هي التي:','سكت عنها الشرع فلم يعتبرها ولم يلغها','اعتبرها الشرع بنص','ألغاها الشرع','تخالف النص','المرسلة أي المطلقة.'],
  ['من أمثلتها:','جمع القرآن في مصحف واحد','الصلاة الخمس','صوم رمضان','الزكاة','لم يرد نص بجمعه في مصحف.'],
  ['من شروط العمل بها:','ألا تعارض نصًّا قطعيًّا','أن تكون خاصة بشخص','أن تكون وهمية','أن تخالف المقاصد','يجب موافقتها للشرع.'],
  ['الذي اشتهر بالأخذ بالمصلحة المرسلة:','المالكية','لا أحد يأخذ بها','الظاهرية','المعتزلة','هو من أصول المذهب المالكي.'],
  ['المصلحة التي ألغاها الشرع مثالها:','مصلحة المال في الربا','القصاص','الحدود','الزكاة','الربا حرمه الشرع وإن ظن فيه الزيادة.'],
  ['يشترط في المصلحة أن تكون:','حقيقية وعامة','وهمية وخاصة','متعلقة بالهوى','مخالفة للإجماع','لتحقق المقصود الشرعي.']],
 es:['وضّح المقصود بالمصلحة المرسلة وشروط العمل بها.','هي مصلحة لم يرد نص باعتبارها ولا إلغائها وتحقق مقصدًا شرعيًّا. شروطها: ملاءمة مقاصد الشريعة، ومعقولية، وحقيقتها لا وهميتها، وعمومها، وعدم معارضتها نصًّا. مثالها جمع القرآن في مصحف.']},

{id:'S16',t:'القيم في القرآن الكريم',tri:2,
 sec:[
  ['مفهوم القيم',['القيم: مبادئ وأخلاق ثابتة تضبط السلوك وتحدد الحسن والقبيح.','مصدرها في الإسلام الوحي فهي ثابتة لا تتغير بتغير الأهواء.','هي أساس بناء الفرد والمجتمع وتحقق السعادة.']],
  ['أهم القيم القرآنية',['الصدق والأمانة والوفاء بالعهد.','العدل والإحسان.','التسامح والعفو والرحمة.','الصبر والحياء والتواضع.','التعاون على البر والتقوى والشورى.']],
  ['أثرها',['في الفرد: استقامة السلوك وصفاء النفس.','في المجتمع: الأمن والتماسك وانتشار الثقة.','في الأمة: قوة الحضارة وحسن العلاقات مع الآخرين.']],
  ['وسائل غرسها',['القدوة الحسنة (الرسول ﷺ).','التربية في الأسرة والمدرسة.','العبادات التي تهذب السلوك.','الأمر بالمعروف والنهي عن المنكر.']]],
 ev:[['q','﴿إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ وَإِيتَاءِ ذِي الْقُرْبَىٰ﴾','النحل 90'],['q','﴿وَأَوْفُوا بِالْعَهْدِ ۖ إِنَّ الْعَهْدَ كَانَ مَسْئُولًا﴾','الإسراء 34'],['q','﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَكُونُوا مَعَ الصَّادِقِينَ﴾','التوبة 119'],['q','﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا﴾','النساء 58'],['h','«إنما بُعثتُ لأتمم مكارم الأخلاق»','رواه أحمد']],
 q:[
  ['الآية التي جمعت العدل والإحسان:','﴿إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ﴾','﴿قُلْ هُوَ اللَّهُ أَحَدٌ﴾','﴿وَأَحَلَّ اللَّهُ الْبَيْعَ﴾','﴿إِنَّا فَتَحْنَا لَكَ﴾','النحل 90.'],
  ['من القيم التي دعت إليها آية الإسراء 34:','الوفاء بالعهد','الكرم','الشجاعة','الصبر','﴿وَأَوْفُوا بِالْعَهْدِ﴾.'],
  ['أمر القرآن بأداء الأمانات إلى أهلها في سورة:','النساء','الإخلاص','الفاتحة','الكوثر','النساء 58.'],
  ['القيم في الإسلام مصدرها:','الوحي','العرف وحده','الأهواء','التجارب','فهي ثابتة وربانية.'],
  ['من وسائل غرس القيم:','القدوة الحسنة','الإهمال','التقليد الأعمى','ترك الأبناء','النبي ﷺ قدوة.'],
  ['معنى قوله تعالى ﴿وَكُونُوا مَعَ الصَّادِقِينَ﴾ الدعوة إلى:','الصدق ومصاحبة أهله','الكذب','الغش','الحسد','التوبة 119.']],
 es:['اذكر ثلاث قيم قرآنية مع دليل لكل منها وأثرها في المجتمع.','العدل والإحسان: ﴿إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ﴾. الوفاء بالعهد: ﴿وَأَوْفُوا بِالْعَهْدِ﴾. الأمانة: ﴿أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا﴾. أثرها: الأمن والثقة والتماسك.']},

{id:'S17',t:'الوقف في الإسلام',tri:2,
 sec:[
  ['تعريفه',['لغةً: الحبس والمنع.','اصطلاحًا: حبس العين عن التصرف فيها بالتمليك والانتفاع بثمرتها في وجوه الخير.','هو من الصدقة الجارية التي يستمر أجرها بعد الموت.']],
  ['مشروعيته',['ثبت بالسنة: وقف عمر بن الخطاب أرضه بخيبر بإذن النبي ﷺ.','وقف عثمان بئر رومة وغيره من الصحابة.','يدخل في عموم الحث على الإنفاق والبر.']],
  ['أركانه وشروطه',['الواقف: أهل للتبرع، عاقل بالغ مختار.','الموقوف: مال معلوم ينتفع به مع بقاء عينه.','الموقوف عليه: جهة بر أو أشخاص معينون.','الصيغة: لفظ يدل على الوقف.']],
  ['أنواعه وآثاره',['وقف خيري (على جهات البر) ووقف أهلي أو ذري (على الذرية).','دور الوقف: بناء المساجد والمدارس والمستشفيات وكفالة الأيتام وطلبة العلم.','الوقف في الجزائر: ينظمه القانون 91-10 المتعلق بالأوقاف.']]],
 ev:[['h','«إذا مات ابن آدم انقطع عمله إلا من ثلاث: صدقة جارية، أو علم ينتفع به، أو ولد صالح يدعو له»','رواه مسلم'],['h','قال النبي ﷺ لعمر: «إن شئت حبست أصلها وتصدقت بها»','متفق عليه'],['q','﴿لَن تَنَالُوا الْبِرَّ حَتَّىٰ تُنفِقُوا مِمَّا تُحِبُّونَ﴾','آل عمران 92']],
 q:[
  ['الوقف لغةً:','الحبس والمنع','البيع','الهبة','الإرث','حبس الأصل.'],
  ['الوقف اصطلاحًا:','حبس الأصل وتسبيل المنفعة','بيع العين','تمليك العين لشخص','قسمة التركة','يحبس الأصل وتصرف الثمرة.'],
  ['الصحابي الذي وقف أرضه بخيبر:','عمر بن الخطاب','أبو بكر','علي','أبو هريرة','وقف أرضًا بخيبر بإشارة النبي ﷺ.'],
  ['الحديث الذي يدل على أن الوقف صدقة جارية:','«إذا مات ابن آدم انقطع عمله...»','«إنما الأعمال بالنيات»','«الدين النصيحة»','«لا ضرر ولا ضرار»','رواه مسلم.'],
  ['من شروط الموقوف أن يكون:','مالًا معلومًا ينتفع به مع بقاء عينه','مالًا مجهولًا','مما يستهلك بالانتفاع','محرمًا','لأن الوقف تحبيس للأصل.'],
  ['القانون الجزائري المنظم للأوقاف:','القانون 91-10','القانون 84-11','الأمر 75-58','القانون 08-09','قانون الأوقاف الصادر سنة 1991.']],
 es:['عرّف الوقف مبيّنًا مشروعيته وأثره في المجتمع.','الوقف حبس الأصل وتسبيل ثمرته في وجوه الخير. مشروعيته: حديث وقف عمر بخيبر وحديث الصدقة الجارية. أثره: بناء المساجد والمدارس والمستشفيات ورعاية الفقراء والأيتام ودوام الأجر للواقف.']},

{id:'S18',t:'مدخل إلى علم الميراث',tri:2,
 sec:[
  ['تعريفه وأهميته',['الميراث لغةً: البقاء وانتقال الشيء من قوم إلى قوم.','علم الميراث (الفرائض): علم بقواعد تعرف بها أنصبة الورثة من التركة.','تولّى الله تعالى بنفسه تقسيم التركة في كتابه عدلًا بين الورثة، فهو من أحكام القرآن القطعية.']],
  ['الحقوق المتعلقة بالتركة (بالترتيب)',['1) تجهيز الميت ودفنه بالمعروف.','2) قضاء ديونه.','3) تنفيذ وصيته في حدود ثلث التركة للأجنبي.','4) توزيع الباقي على الورثة.']],
  ['أركان الإرث وشروطه',['الأركان: المورِّث والوارث والحق الموروث.','الشروط: تحقق موت المورِّث، وتحقق حياة الوارث بعده، والعلم بجهة الإرث.']],
  ['أسباب الإرث وموانعه',['الأسباب: النكاح (الزوجية الصحيحة)، والنسب (القرابة)، والولاء.','الموانع: القتل العمد، واختلاف الدين، والرق.','الأنصبة المقدرة ستة: النصف والربع والثمن والثلثان والثلث والسدس.']]],
 ev:[['q','﴿يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ﴾','النساء 11'],['q','﴿مِن بَعْدِ وَصِيَّةٍ يُوصِي بِهَا أَوْ دَيْنٍ﴾','النساء 11'],['h','«لا يرث المسلمُ الكافرَ ولا الكافرُ المسلمَ»','متفق عليه']],
 q:[
  ['أول حق يتعلق بالتركة:','تجهيز الميت ودفنه','قضاء الدين','الوصية','توزيع الميراث','ثم الدين ثم الوصية ثم الميراث.'],
  ['الوصية للأجنبي تنفذ في حدود:','ثلث التركة','نصف التركة','كل التركة','ربع التركة','الثلث والثلث كثير.'],
  ['من أسباب الإرث:','النكاح والنسب والولاء','الصداقة','الجوار','المهنة','هذه الأسباب الثلاثة.'],
  ['من موانع الإرث:','القتل العمد','الفقر','السفر','المرض','القاتل لا يرث.'],
  ['عدد الأنصبة المقدرة في كتاب الله:','ستة','ثلاثة','أربعة','عشرة','النصف والربع والثمن والثلثان والثلث والسدس.'],
  ['من شروط الإرث:','تحقق حياة الوارث بعد موت المورث','وفاة الوارث قبل المورث','الجهل بالقرابة','اختلاف الدين','يجب أن يكون الوارث حيًّا.']],
 es:['اذكر الحقوق المتعلقة بالتركة مرتبة، ثم موانع الإرث.','الحقوق: تجهيز الميت، ثم قضاء الديون، ثم تنفيذ الوصية في حدود الثلث، ثم توزيع الباقي على الورثة. الموانع: القتل العمد، واختلاف الدين، والرق.']},

{id:'S19',t:'الورثة وطرق ميراثهم',tri:2,
 sec:[
  ['أصحاب الفروض (أهم أنصبتهم)',['الزوج: النصف إن لم يكن للميتة ولد، والربع إن كان لها ولد.','الزوجة: الربع إن لم يكن للميت ولد، والثمن إن كان له ولد.','الأب: السدس مع الولد الذكر، والسدس والتعصيب مع البنت وحدها، والتعصيب عند عدم الولد.','الأم: السدس مع الولد أو جمع من الإخوة، والثلث عند عدمهما.','البنت: النصف إن انفردت، والثلثان لاثنتين فأكثر، ومع الابن تعصيبًا للذكر مثل حظ الأنثيين.','الجدة: السدس.']],
  ['العصبة',['العصبة: من يأخذ التركة كلها أو ما بقي بعد أصحاب الفروض.','عصبة بالنفس: الابن والأب والأخ والعم.','عصبة بالغير: البنت مع الابن، والأخت مع الأخ.','عصبة مع الغير: الأخوات مع البنات.']],
  ['الحجب',['حجب حرمان: منع الوارث من الإرث كليًّا (الابن يحجب الإخوة).','حجب نقصان: تنقيص نصيبه إلى نصيب أقل (الزوج من النصف إلى الربع بوجود الولد).','الأقرب يحجب الأبعد من العصبة.']],
  ['أمثلة تطبيقية',['زوجة + أم + ابنان: للزوجة الثمن (3/24)، وللأم السدس (4/24)، وللابنين الباقي (17/24).','زوج + أم + أب (العمرية): للزوج النصف، وللأم ثلث الباقي أي السدس، وللأب الباقي أي الثلث.','زوجة + 3 أبناء + 2 بنتان والتركة 160000: للزوجة 20000، ولكل ابن 35000، ولكل بنت 17500.']]],
 ev:[['q','﴿وَلَكُمْ نِصْفُ مَا تَرَكَ أَزْوَاجُكُمْ إِن لَّمْ يَكُن لَّهُنَّ وَلَدٌ﴾','النساء 12'],['q','﴿وَلِأَبَوَيْهِ لِكُلِّ وَاحِدٍ مِّنْهُمَا السُّدُسُ مِمَّا تَرَكَ إِن كَانَ لَهُ وَلَدٌ﴾','النساء 11'],['h','«ألحقوا الفرائض بأهلها فما بقي فهو لأولى رجل ذكر»','متفق عليه']],
 q:[
  ['نصيب الزوج إذا كان للمتوفاة ولد:','الربع','النصف','الثمن','الثلث','النصف عند عدم الولد.'],
  ['نصيب الزوجة إذا كان للمتوفى ولد:','الثمن','الربع','النصف','السدس','الربع عند عدم الولد.'],
  ['في مسألة: زوجة + أم + ابنان، نصيب الأم:','السدس','الثلث','الثمن','الربع','لوجود الولد.'],
  ['الذكر في أولاد الميت يأخذ:','مثل حظ الأنثيين','مثل الأنثى','ثلاثة أمثالها','نصفها','﴿لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ﴾.'],
  ['العصبة هم الذين:','يأخذون الباقي بعد أصحاب الفروض','يأخذون السدس فقط','لا يرثون','يأخذون الثلث دائمًا','التعصيب أخذ الباقي.'],
  ['في تركة 160000 عن زوجة وثلاثة أبناء وبنتين، نصيب الابن الواحد:','35000','20000','17500','40000','الباقي 140000 يقسم على 8 أسهم.']],
 es:['زوج وأم وأب ماتت عنهم امرأة؛ بيّن نصيب كل منهم مع التعليل.','للزوج النصف لعدم الولد، وللأم ثلث الباقي بعد فرض الزوج أي السدس (العمرية)، وللأب الباقي تعصيبًا وهو الثلث. المجموع: 1/2 + 1/6 + 1/3 = 1.']}
];

/* ===== المدرسية: السنة الثالثة ثانوي — العلوم الإسلامية — الفصل الثالث ===== */
const SCH3=[
{id:'S20',t:'الربا وأحكامه',tri:3,
 sec:[
  ['تعريفه',['لغةً: الزيادة والنماء.','اصطلاحًا: زيادة مشروطة في عقد مبادلة مال بمال أو في قرض مقابل الأجل من غير عوض.','هو من كبائر الذنوب وأعظم المعاملات المحرمة.']],
  ['أنواعه',['ربا النسيئة (الأجل): الزيادة مقابل التأجيل، ومنه ربا الجاهلية: «أتقضي أم تُربي؟».','ربا الفضل: بيع الجنس الربوي بجنسه مع التفاضل، كالذهب بالذهب متفاضلًا.','ربا القروض: كل قرض جرّ نفعًا مشروطًا للمقرض.']],
  ['حكمه وأدلته',['حرمه الله تعالى في القرآن وأعلن الحرب على المرابين.','لعن النبي ﷺ آكل الربا وموكله وكاتبه وشاهديه.','الأصناف الستة: الذهب والفضة والبر والشعير والتمر والملح.']],
  ['أضراره وبدائله',['أضراره: استغلال المحتاج وتراكم الديون وتركز الثروة وتعطيل العمل والإنتاج وقطع التراحم.','البدائل الشرعية: القرض الحسن والمضاربة والمشاركة والبيع بأنواعه والزكاة والصدقة.']]],
 ev:[['q','﴿وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا﴾','البقرة 275'],['q','﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اتَّقُوا اللَّهَ وَذَرُوا مَا بَقِيَ مِنَ الرِّبَا إِن كُنتُم مُّؤْمِنِينَ﴾','البقرة 278'],['h','«لعن رسول الله ﷺ آكل الربا وموكله وكاتبه وشاهديه، وقال: هم سواء»','رواه مسلم'],['h','«الذهب بالذهب، والفضة بالفضة... مثلًا بمثل، سواءً بسواء، يدًا بيد»','رواه مسلم']],
 q:[
  ['الربا لغةً:','الزيادة','النقص','الحبس','الدين','يقال: ربا المال إذا زاد.'],
  ['الآية التي تحرم الربا وتحل البيع:','﴿وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا﴾','﴿وَأَقِيمُوا الصَّلَاةَ﴾','﴿وَأَوْفُوا بِالْعَهْدِ﴾','﴿لَا إِكْرَاهَ فِي الدِّينِ﴾','البقرة 275.'],
  ['ربا النسيئة هو الزيادة مقابل:','تأجيل السداد','اختلاف الجنس','قيمة السلعة','الخدمة','النسيئة التأخير.'],
  ['كل قرض جرّ نفعًا مشروطًا للمقرض هو:','ربا القروض','مضاربة','قرض حسن','هبة','القرض الحسن لا زيادة فيه.'],
  ['من البدائل الشرعية للتعامل الربوي:','القرض الحسن والمضاربة','القمار','الغش','الاحتكار','وهي معاملات خالية من الربا.'],
  ['الذين لعنهم النبي ﷺ في الحديث:','آكل الربا وموكله وكاتبه وشاهداه','المسافر والمقيم','التاجر الصدوق','المتصدق والمنفق','رواه مسلم.'],
  ['من أضرار الربا:','تراكم الديون وتركز الثروة','نشر التراحم','تشجيع الإنتاج','العدل في توزيع المال','الربا يضر الفرد والمجتمع.'],
  ['حديث «الذهب بالذهب مثلًا بمثل يدًا بيد» يتعلق بـ:','ربا الفضل','الوصية','الميراث','الوقف','لأنه عن التفاضل في الجنس الواحد.']],
 es:['عرّف الربا وبيّن أنواعه وأضراره.','الربا زيادة مشروطة بلا عوض في القرض أو المبادلة. أنواعه: النسيئة والفضل والقروض. أضراره: استغلال المحتاج، وتراكم الديون، وتركز الثروة، وتعطيل الإنتاج، وقطع التراحم.']},

{id:'S21',t:'من المعاملات المالية الجائزة (الصرف - المرابحة - التقسيط)',tri:3,
 sec:[
  ['الأصل في المعاملات',['الأصل في المعاملات الإباحة ما لم يرد دليل على التحريم.','يشترط الرضا والعلم بالثمن والسلعة وخلوّ العقد من الغرر والربا والغش.']],
  ['الصرف',['تعريفه: بيع نقد بنقد، كبيع الدينار بالدولار أو الذهب بالفضة.','شروطه: التقابض في مجلس العقد، والتماثل إن اتحد الجنس (ذهب بذهب).','إن اختلف الجنس جاز التفاضل مع التقابض.']],
  ['المرابحة',['تعريفها: بيع السلعة بمثل الثمن الأول مع زيادة ربح معلوم.','شروطها: أن يعلم المشتري ثمن الشراء والربح، وأن يملك البائع السلعة قبل بيعها.','المرابحة للآمر بالشراء: تستعمل في المصارف الإسلامية بشروطها.']],
  ['التقسيط',['هو بيع السلعة بثمن مؤجل يُدفع على أقساط معلومة.','جائز عند جمهور العلماء ولو زاد الثمن عن الثمن الحال بشرط تحديد الثمن عند العقد.','تحرم الزيادة على الثمن عند التأخر في سداد الأقساط لأنها ربا.']]],
 ev:[['q','﴿وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا﴾','البقرة 275'],['q','﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَأْكُلُوا أَمْوَالَكُم بَيْنَكُم بِالْبَاطِلِ إِلَّا أَن تَكُونَ تِجَارَةً عَن تَرَاضٍ مِّنكُمْ﴾','النساء 29'],['q','﴿إِذَا تَدَايَنتُم بِدَيْنٍ إِلَىٰ أَجَلٍ مُّسَمًّى فَاكْتُبُوهُ﴾','البقرة 282'],['h','«البيّعان بالخيار ما لم يتفرقا»','متفق عليه']],
 q:[
  ['الصرف هو:','بيع نقد بنقد','بيع سلعة بسلعة','إجارة','قرض','كبيع الدينار بالدولار.'],
  ['من شروط الصرف:','التقابض في المجلس','التأجيل','الغرر','الجهالة','لئلا يقع ربا النسيئة.'],
  ['المرابحة هي بيع السلعة:','بمثل ثمنها الأول مع ربح معلوم','بأقل من ثمنها','بثمن مجهول','دون علم المشتري','تشترط معرفة الربح.'],
  ['من شروط المرابحة:','علم المشتري بثمن الشراء والربح','إخفاء الثمن الأول','ألا يملك البائع السلعة','وجود الغش','العلم أساس الرضا.'],
  ['البيع بالتقسيط جائز بشرط:','تحديد الثمن عند العقد وعدم الزيادة عند التأخر','زيادة الثمن كلما تأخر المدين','جهالة الثمن','وجود غرامة تأخير','لأن الزيادة عند التأخر ربا.'],
  ['الأصل في المعاملات:','الإباحة','التحريم','الكراهة','الوجوب','ما لم يرد دليل على المنع.'],
  ['من صور بيع الصرف:','الذهب بالفضة مع التقابض','الذهب بالذهب مؤجلًا','القمح بالشعير','الأرض بالدار','لا بد من التقابض في المجلس.']],
 es:['اشرح البيع بالتقسيط وبيّن شروطه وما يحرم فيه.','هو بيع بثمن مؤجل يدفع على أقساط معلومة. شروطه: تحديد الثمن عند العقد، ووضوح الأقساط. ويحرم زيادة الثمن عند تأخر المشتري في السداد لأنها ربا.']},

{id:'S22',t:'الحرية الشخصية ومدى ارتباطها بحقوق الآخرين',tri:3,
 sec:[
  ['مفهوم الحرية',['الحرية: قدرة الإنسان على التصرف باختياره دون إكراه ولا استعباد.','كرّم الله الإنسان وخلقه حرًّا، فلا عبودية إلا لله.','الإسلام قرر الحرية وجعل لها ضوابط تحفظ الحقوق.']],
  ['صور الحرية في الإسلام',['حرية الاعتقاد: ﴿لَا إِكْرَاهَ فِي الدِّينِ﴾.','حرية الرأي والتعبير في إطار الأدب والنصيحة.','حرية التملك والعمل والتنقل.','حرية الفرد في بيته وحرمة مسكنه وعرضه.']],
  ['ضوابطها',['ألا تضر بالآخرين: «لا ضرر ولا ضرار».','ألا تخالف مقاصد الشريعة وأحكامها القطعية.','ألا تخل بالنظام العام والآداب العامة.','التوازن بين الحق والواجب: حقي ينتهي حيث يبدأ حق غيري.']],
  ['مسؤولية الفرد والمجتمع',['حديث السفينة: ترك أصحاب الأسفل يخرقون السفينة يهلك الجميع، فللمجتمع حق منع الضرر.','الحرية مسؤولية يحاسب عليها الإنسان أمام الله وأمام القانون.']]],
 ev:[['q','﴿لَا إِكْرَاهَ فِي الدِّينِ ۖ قَد تَّبَيَّنَ الرُّشْدُ مِنَ الْغَيِّ﴾','البقرة 256'],['q','﴿وَقُلِ الْحَقُّ مِن رَّبِّكُمْ ۖ فَمَن شَاءَ فَلْيُؤْمِن وَمَن شَاءَ فَلْيَكْفُرْ﴾','الكهف 29'],['h','«لا ضرر ولا ضرار»','رواه ابن ماجه'],['h','«كل المسلم على المسلم حرام: دمه وماله وعرضه»','رواه مسلم']],
 q:[
  ['الآية الدالة على حرية الاعتقاد:','﴿لَا إِكْرَاهَ فِي الدِّينِ﴾','﴿وَأَحَلَّ اللَّهُ الْبَيْعَ﴾','﴿وَأَقِيمُوا الصَّلَاةَ﴾','﴿وَلَا تَقْرَبُوا الزِّنَا﴾','البقرة 256.'],
  ['القاعدة التي تضبط الحرية الشخصية:','لا ضرر ولا ضرار','الغاية تبرر الوسيلة','لكل فرد أن يفعل ما يشاء','لا حرية في الإسلام','حديث ابن ماجه.'],
  ['حديث السفينة يبين:','حق المجتمع في منع الضرر','حرية الفرد المطلقة','تحريم السفر','حكم الصيد','لو تُركوا لهلكوا جميعًا.'],
  ['من حدود الحرية:','عدم الإضرار بحقوق الآخرين','مخالفة النظام العام','التعدي على الأعراض','إسقاط الواجبات','حقك ينتهي عند حق غيرك.'],
  ['حرية التملك في الإسلام:','مشروعة بضوابط الحلال','محرمة','مطلقة بلا قيد','للأغنياء فقط','فيها أحكام الزكاة وتحريم الربا والغش.'],
  ['الحرية في الإسلام مقترنة بـ:','المسؤولية','الفوضى','الأهواء','الإكراه','يحاسب العبد على تصرفه.']],
 es:['وضّح ضوابط الحرية الشخصية في الإسلام مع الدليل.','ضوابطها: عدم الإضرار بالآخرين («لا ضرر ولا ضرار»)، وعدم مخالفة مقاصد الشريعة، وعدم الإخلال بالنظام العام والآداب، والتوازن بين الحق والواجب. ومثاله حديث السفينة.']},

{id:'S23',t:'من أحكام الأسرة: النسب والتبني والكفالة',tri:3,
 sec:[
  ['النسب',['النسب: القرابة بالولادة، وهو من الضروريات التي حفظها الشرع (حفظ النسل).','يثبت بالزواج الصحيح، وبالإقرار، وبالبينة.','حق الولد على أبيه: أن يُنسب إليه ويُنفق عليه ويُربى.']],
  ['التبني',['هو أن ينسب الرجل ولدًا معروف النسب أو مجهوله إلى نفسه ويعامله كابنه في كل الأحكام.','حرمه الإسلام لأنه يختلط به النسب وتضيع به الحقوق ويُدخل في الميراث من ليس وارثًا.','ينص قانون الأسرة الجزائري على منع التبني شرعًا وقانونًا (المادة 46).']],
  ['الكفالة',['هي التزام على وجه التبرع بالقيام بطفل قاصر من نفقة وتربية ورعاية، كما يقوم الأب بابنه.','أفضل الأعمال: كافل اليتيم مرافق للنبي ﷺ في الجنة.','تكون بعقد شرعي أمام القاضي أو الموثق، ولا تُثبت نسبًا ولا ميراثًا.','يمكن للكافل أن يوصي للمكفول في حدود الثلث أو يهبه شيئًا.']],
  ['الفرق بين التبني والكفالة',['التبني: ينسب إليه ويرث ويرث منه، وهو محرم.','الكفالة: يحتفظ بنسبه الأصلي ولا يرث بالنسب، وهي مشروعة ومندوب إليها.']]],
 ev:[['q','﴿ادْعُوهُمْ لِآبَائِهِمْ هُوَ أَقْسَطُ عِندَ اللَّهِ﴾','الأحزاب 5'],['q','﴿وَمَا جَعَلَ أَدْعِيَاءَكُمْ أَبْنَاءَكُمْ﴾','الأحزاب 4'],['h','«أنا وكافل اليتيم في الجنة هكذا» وأشار بالسبابة والوسطى','رواه البخاري']],
 q:[
  ['حكم التبني في الإسلام:','محرم','مباح','مندوب','واجب','﴿ادْعُوهُمْ لِآبَائِهِمْ﴾.'],
  ['الكفالة هي التزام بالقيام بشؤون طفل قاصر على وجه:','التبرع','الميراث','التبني','البيع','لا تثبت نسبًا.'],
  ['الفرق بين الكفالة والتبني أن المكفول:','يحتفظ بنسبه الأصلي','ينسب للكافل','يرث بالنسب من الكافل','يغير اسم أبيه','لا يثبت للمكفول نسب الكافل.'],
  ['الحديث الذي يبين فضل كفالة اليتيم:','«أنا وكافل اليتيم في الجنة هكذا»','«إنما الأعمال بالنيات»','«الدين النصيحة»','«لا ضرر ولا ضرار»','رواه البخاري.'],
  ['يثبت النسب بـ:','الزواج الصحيح والإقرار والبينة','التبني','الصداقة','الجوار','هذه طرق ثبوته.'],
  ['المادة التي تمنع التبني في قانون الأسرة الجزائري:','المادة 46','المادة 100','المادة 1','المادة 200','تمنع التبني شرعًا وقانونًا.']],
 es:['قارن بين التبني والكفالة من حيث الحكم والآثار.','التبني محرم: ينسب فيه الولد لغير أبيه ويرث ويورث. أما الكفالة فمشروعة ومندوب إليها: رعاية ونفقة وتربية دون تغيير النسب ولا إثبات الميراث.']},

{id:'S24',t:'العلاقات الاجتماعية بين المسلمين وغيرهم',tri:3,

/* ---------- محرك الاختبار ---------- */
function schStart(kind){
  let qs=[],limit=0,title='';
  if(kind==='f'){
    qs=shuffle([].concat.apply([],SCH.map(schQs))).slice(0,40);limit=45*60;title=sg(['الاختبار الشامل للسنة','Final exam of the year','Examen final']);
  }else if(/^t[123]$/.test(kind)){
    const n=+kind[1];qs=shuffle([].concat.apply([],schOf(n).map(schQs))).slice(0,20);limit=20*60;title=sg(['اختبار','Exam','Examen'])+' — '+SCHTRI[n-1].t[0];
  }else if(kind==='rv'){
    qs=schReview();if(!qs.length){toast(sg(['لا أخطاء مسجلة بعد، ابدأ باختبار أولًا.','No mistakes recorded yet.','Aucune erreur enregistrée.']));return}title=sg(['مراجعة أخطائي','My mistakes review','Révision de mes erreurs']);
  }else{
    const l=schLes(kind);if(!l)return;qs=shuffle(schQs(l));title=l.t;
  }
  SX={kind:kind,title:title,qs:qs.map(schMk),i:0,sel:null,checked:false,ok:0,wrong:[],limit:limit,left:limit,done:false,timer:0};
  if(limit){SX.timer=setInterval(function(){
    if(!SX||SX.done){clearInterval(SX&&SX.timer);return}
    SX.left--;const el=$('#sxclock');if(el)el.textContent=schClock(SX.left);
    if(SX.left<=0)schFinish();
  },1000)}
  openOverlay();renderSchQ();
}
function schClock(t){t=Math.max(0,t);return Math.floor(t/60)+':'+('0'+(t%60)).slice(-2)}
function renderSchQ(){
  const x=SX,q=x.qs[x.i],pct=Math.round(x.i/x.qs.length*100);
  let h='<div class="ltop"><button class="xbtn" data-sc="quit" aria-label="'+esc(sg(['خروج','Exit','Quitter']))+'">'+IC.x+'</button>'+
   '<div class="bar" role="progressbar" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+
   (x.limit?'<div class="chip" style="min-width:64px;justify-content:center"><span id="sxclock">'+schClock(x.left)+'</span></div>':'<div class="chip"><span>'+(x.i+1)+'/'+x.qs.length+'</span></div>')+'</div>'+
   '<div class="lmain"><small class="muted">'+esc(x.title)+' — '+(x.i+1)+'/'+x.qs.length+'</small><h2 class="qtext">'+esc(q.q)+'</h2><div class="opts">'+
   q.opts.map(function(o,i){
     let c='';
     if(x.checked){if(o===q.c)c=' right';else if(i===x.sel)c=' wrong'}else if(i===x.sel)c=' sel';
     return '<button class="opt'+c+'" data-sc="opt:'+i+'" '+(x.checked?'disabled':'')+'><span class="k">'+(i+1)+'</span><span>'+esc(o)+'</span></button>'}).join('')+'</div></div>';
  if(!x.checked)h+='<div class="lfoot"><div class="in"><button class="btn" data-sc="check" '+(x.sel===null?'disabled':'')+'>'+esc(sg(['تحقق','Check','Vérifier']))+'</button></div></div>';
  else{
    const ok=q.opts[x.sel]===q.c;
    h+='<div class="lfoot '+(ok?'ok':'bad')+'" aria-live="polite"><div class="in"><div class="fb">'+(ok?'<h3>'+esc(sg(['إجابة صحيحة','Correct','Correct']))+'</h3>':'<h3>'+esc(sg(['الإجابة الصحيحة','Correct answer','Bonne réponse']))+'</h3><p><b>'+esc(q.c)+'</b></p>')+(q.n?'<p>'+esc(q.n)+'</p>':'')+'</div>'+
     '<button class="btn '+(ok?'':'bad')+'" data-sc="next">'+(x.i+1>=x.qs.length?esc(sg(['النتيجة','Result','Résultat'])):esc(sg(['متابعة','Next','Suivant'])))+'</button></div></div>';
  }
  $('#lesson').innerHTML=h;
}
function schFinish(){
  const x=SX;if(!x||x.done)return;x.done=true;if(x.timer)clearInterval(x.timer);
  const answered=x.i+(x.checked?1:0),tot=x.qs.length;
  const sc=schScore(x.ok,tot),s=schS();
  const key=x.kind==='f'?'bf':(/^t[123]$/.test(x.kind)?'bt'+x.kind[1]:'b:'+x.kind);
  if(s[key]===undefined||sc>s[key])s[key]=sc;
  try{save()}catch(e){}
  try{SND[sc>=10?'correct':'wrong']()}catch(e){}
  const mood=sc>=16?'wow':(sc>=10?'cheer':'sad');
  const lab=sc>=16?sg(['ممتاز، ما شاء الله!','Excellent!','Excellent !']):sc>=14?sg(['جيد جدًا','Very good','Très bien']):sc>=10?sg(['مقبول، واصل المراجعة','Pass — keep revising','Passable, continuez']):sg(['تحتاج إلى مراجعة','Needs revision','À réviser']);
  const wl={};x.wrong.forEach(function(w){wl[w.l]=1});
  let es=[];
  if(x.kind==='f')es=shuffle(SCH).slice(0,4);else if(/^t[123]$/.test(x.kind))es=shuffle(schOf(+x.kind[1])).slice(0,3);else{const l=schLes(x.kind);if(l)es=[l]}
  let h='<div class="ltop"><button class="xbtn" data-act="leave" aria-label="'+esc(sg(['إغلاق','Close','Fermer']))+'">'+IC.x+'</button><h2 style="flex:1;font-size:1.1rem">'+esc(x.title)+'</h2></div><div class="lmain">'+
   '<div class="card" style="text-align:center;display:grid;gap:6px"><div style="display:grid;place-items:center">'+hoopoe(mood,84)+'</div>'+
   '<div class="bigs">'+schFmt(sc)+' / 20</div><b>'+esc(lab)+'</b><small class="muted">'+esc(sg(['إجابات صحيحة','Correct answers','Bonnes réponses']))+': '+x.ok+' / '+tot+(answered<tot?' ('+esc(sg(['لم تُجب عن الباقي','unanswered left blank','sans réponse']))+')':'')+'</small></div>';
  if(x.wrong.length){
    h+='<section class="sec"><h2>'+esc(sg(['أخطاؤك','Your mistakes','Vos erreurs']))+'</h2>'+x.wrong.map(function(w){
      return '<div class="card sch-sec"><p><b>'+esc(w.q)+'</b></p><p class="sch-bad">✗ '+esc(w.a)+'</p><p class="sch-good">✓ '+esc(w.c)+'</p>'+(w.n?'<p class="muted">'+esc(w.n)+'</p>':'')+'</div>'}).join('')+
     '<h3 style="margin:10px 0 4px">'+esc(sg(['راجع هذه الدروس','Review these lessons','Révisez ces leçons']))+'</h3><div style="display:grid;gap:8px">'+Object.keys(wl).map(function(id){const l=schLes(id);return '<button class="card sch-it" data-sc="open:'+id+'"><span class="sch-n">↺</span><span class="sch-t">'+esc(l.t)+'</span></button>'}).join('')+'</div></section>';
  }
  if(es.length)h+='<section class="sec"><h2>'+esc(sg(['أسئلة مقالية للتدرب','Essay practice','Questions rédactionnelles']))+'</h2>'+es.map(function(l){
    return '<details class="card sch-sec"><summary><b>'+esc(l.es[0])+'</b></summary><p>'+esc(l.es[1])+'</p></details>'}).join('')+'</section>';
  h+='<div style="display:grid;gap:8px;margin:12px 0 90px"><button class="btn" data-sc="again">'+esc(sg(['أعد الاختبار','Retake','Recommencer']))+'</button><button class="btn ghost" data-act="leave">'+esc(sg(['العودة إلى المدرسية','Back to School','Retour']))+'</button></div></div>';
  $('#lesson').innerHTML=h;
}

(function(){

    const v=b.dataset.sc,k=v.split(':'),a=k[0],p=k.slice(1).join(':');
    if(a==='tab'){SCHTAB=p;return pageSchool()}
    if(a==='open'){if($('#lesson').hidden)openOverlay();SX=null;return renderSchLesson(p)}
    if(a==='read'){const s=schS();if(s['r:'+p])delete s['r:'+p];else s['r:'+p]=1;save();return renderSchLesson(p)}
    if(a==='ex'){if(SX&&SX.timer)clearInterval(SX.timer);return schStart(p)}
    if(a==='again'&&SX)return schStart(SX.kind);
    if(!SX||SX.done)return;
    if(a==='opt'){if(SX.checked)return;SX.sel=+p;return renderSchQ()}
    if(a==='check'){
      const q=SX.qs[SX.i];SX.checked=true;

      if(q.opts[SX.sel]===q.c){SX.ok++;try{SND.correct()}catch(e){}}
      else{SX.wrong.push({q:q.q,a:q.opts[SX.sel],c:q.c,n:q.n,l:q.l});try{SND.wrong()}catch(e){}}
      return renderSchQ();
    }
    if(a==='next'){
      if(SX.i+1>=SX.qs.length){SX.i=SX.qs.length-1;return schFinish()}
      SX.i++;SX.sel=null;SX.checked=false;return renderSchQ();

    }
  });
})();

    ['e','m','h'].forEach(function(l){((B[k]||{})[l]||[]).forEach(function(x){if(x[0]&&x[1])pool.push({k:k,x:x})})})});

function kbScore(docs,df,avg,qt,qn){
  const N=docs.length,out=[];
  docs.forEach(function(x){
    let sc=0,hit=0;
    qt.forEach(function(w){const f=x.tf[w];if(!f)return;hit++;const idf=Math.log(1+(N-df[w]+.5)/(df[w]+.5));sc+=idf*(f*2.2)/(f+1.2*(.25+.75*x.len/avg))});

const RULING=/حكم|يجوز|حلال|حرام|فتو|يبطل|يصح|هل يحق|ما حكم|جائز|مكروه|كفاره/;
function askLocal(q){
  const nq=aNorm(q).replace(/[^ء-ي0-9: ]+/g,' ').replace(/\s+/g,' ').trim(),qt=aTok(q);
  return loadQ().then(function(){return Promise.all([loadTF('muy').catch(function(){return null}),loadTF('jal').catch(function(){return null})])}).then(function(){
    kbBuild();
    const parts=[],ctx=[];let used=false,shortS=false;
    /* 1) مرجع آية: 2:255 أو البقرة 255 */
    let s=0,a=0,m=nq.match(/(\d{1,3}) ?: ?(\d{1,3})/);
    if(m){s=+m[1];a=+m[2]}
    const sf=surahFind(nq);
    if(!s&&sf){const m2=nq.match(/(?:اي[هة]|رقم)? ?(\d{1,3})/);if(m2&&+m2[1]>0&&+m2[1]<=AYC[sf-1]&&!/كم|عدد/.test(nq)){s=sf;a=+m2[1]}}
    if(s>=1&&s<=114&&a>=1&&a<=AYC[s-1]){const p=ayahPart(s,a);if(p){parts.push(p);ctx.push(p.c);used=true}}

    /* 2) البحث بنص آية */
    if(!used||qt.length>=3){
      const qs=used?[]:quoteSearch(nq,qt);
      qs.forEach(function(r){const p=ayahPart(r[0],r[1]);if(p){parts.push(p);ctx.push(p.c);used=true}});
    }
    /* 3) محتوى التطبيق */

        parts.push({h:'<p>'+esc(clip(r.x.d,420))+'</p><div class="muted">'+esc(r.x.s)+'</div>',c:r.x.d+' ['+r.x.s+']'});ctx.push(r.x.d+' ['+r.x.s+']');n++;used=true;
      }
    }

    if(!used&&(!res.length||res[0].cov<.6)&&TF.muy&&qt.length){
      if(!KB.tafDocs){const td=[];TF.muy.forEach(function(sv,i){sv.forEach(function(t,j){if(t)kbAdd(td,tafOf(TF.muy,i+1,j+1),tafOf(TF.muy,i+1,j+1),SN[i]+' '+(j+1),1)})});KB.tafDocs=td;const r=kbIndex(td);KB.tafDf=r.df;KB.tafAvg=r.avg;
        td.forEach(function(x,k){});}
      const tr=kbScore(KB.tafDocs,KB.tafDf,KB.tafAvg,qt,nq);
      if(tr.length&&tr[0].cov>=.5){
        let n=0;for(let i=0;i<tr.length&&n<2;i++){

}

/* ===== إحساس التطبيق الأصلي: زر الرجوع، النوافذ السفلية ===== */
(function(){
  let pushed=0;
  function lessonOpen(){const l=document.getElementById('lesson');return l&&!l.hidden}
  function celeOpen(){const c=document.getElementById('cele');return c&&!c.hidden}
  function sync(){
    const open=lessonOpen()||celeOpen();
    if(open&&!pushed){try{history.pushState({ov:1},'')}catch(e){}pushed=1}
    if(!open&&pushed){pushed=0;try{if(history.state&&history.state.ov)history.back()}catch(e){}}
  }
  const mo=new MutationObserver(sync);
  ['lesson','cele'].forEach(function(id){const el=document.getElementById(id);if(el)mo.observe(el,{attributes:true,attributeFilter:['hidden']})});
  window.addEventListener('popstate',function(){
    if(!pushed)return;
    pushed=0;
    if(celeOpen()){document.getElementById('cele').hidden=true;if(lessonOpen())sync();return}
    if(lessonOpen()){
      if(typeof L!=='undefined'&&L&&L.queue&&L.state==='ask'&&!L.review){L.confirm=true;renderLesson();pushed=0;sync();return}
      if(typeof CD!=='undefined'&&CD){CD=null}
      closeOverlay();
    }
  });
})();
