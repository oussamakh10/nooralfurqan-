var D={"t": ["سياسة الخصوصية", "Privacy Policy", "Politique de confidentialité"], "s": [[["من نحن", "Who we are", "Qui sommes-nous"], ["«نور الفرقان» تطبيق تعليمي إسلامي مجاني، ناشره ومسؤول معالجة البيانات: خلوفي أسامة (الجزائر). التواصل: [contact email]. تسري هذه السياسة على الموقع وتطبيق الويب المثبّت (PWA) وتطبيق أندرويد المبني منه. آخر تحديث: 2026-10-29.", "“Nur al-Furqan” is a free Islamic learning app. The publisher and data controller is Khelloufi Oussama (Algeria). Contact: [contact email]. This policy covers the website, the installed web app (PWA) and the Android app built from it. Last updated: 2026-10-29.", "« Nur al-Furqan » est une application éducative islamique gratuite. L’éditeur et responsable du traitement est Khelloufi Oussama (Algérie). Contact : [contact email]. Cette politique couvre le site, l’application web installée (PWA) et l’application Android qui en est issue. Dernière mise à jour : 2026-10-29."]], [["مبدؤنا: أقل بيانات ممكنة", "Our principle: minimum data", "Notre principe : un minimum de données"], ["لا نبيع بياناتك ولا نستعمل أدوات تحليل أو تتبّع أو إعلانات مخصّصة. التطبيق يعمل بدون حساب، وكل تقدّمك يبقى على جهازك افتراضيًا.", "We never sell your data and use no analytics, tracking or personalised advertising. The app works without an account and your progress stays on your device by default.", "Nous ne vendons jamais vos données et n’utilisons ni outil d’analyse, ni pistage, ni publicité personnalisée. L’application fonctionne sans compte et votre progression reste sur votre appareil par défaut."]], [["ما نحفظه على جهازك", "What is stored on your device", "Ce qui est enregistré sur votre appareil"], ["الاسم الذي تكتبه، وعمرك (رقم يحدد وضع الأطفال أو العادي)، والمدينة لأوقات الصلاة، والتقدّم والنقاط والإعدادات والمشتريات الافتراضية. يُحفظ في التخزين المحلي للمتصفح/الجهاز (localStorage) لأنه ضروري لعمل التطبيق، ولا يُرسل إلينا. تحذفه من الإعدادات أو بمسح بيانات التطبيق.", "The name you type, your age (a number that selects kids or standard mode), your city for prayer times, progress, points, settings and virtual purchases. It is kept in the browser/device local storage (localStorage), which is strictly necessary for the app to work, and is not sent to us. Delete it from Settings or by clearing the app data.", "Le prénom saisi, votre âge (un nombre qui choisit le mode enfant ou standard), votre ville pour les horaires de prière, la progression, les points, les réglages et les achats virtuels. Ces données sont conservées dans le stockage local (localStorage), strictement nécessaire au fonctionnement, et ne nous sont pas envoyées. Supprimez-les dans les Réglages ou en effaçant les données de l’application."]], [["الحساب والمزامنة (اختياري، لمن بلغ 16 سنة فأكثر)", "Account and sync (optional, age 16+)", "Compte et synchronisation (facultatif, 16 ans et plus)"], ["إن اخترت الدخول بحساب جوجل نحفظ على Firebase (Google LLC): معرّف الحساب، الاسم، البريد، التقدّم، وإدخالك في اللوحة الأسبوعية (الاسم والنقاط). الأساس القانوني: موافقتك، ويمكنك سحبها بتسجيل الخروج وحذف بياناتك. تُحفظ حتى تحذفها أنت، وإدخال اللوحة الأسبوعية يُستبدل كل أسبوع. قد تُعالَج البيانات على خوادم خارج الجزائر والاتحاد الأوروبي والمملكة المتحدة، وتعتمد Google ضمانات نقل قانونية (بنود تعاقدية نموذجية).", "If you choose to sign in with Google, Firebase (Google LLC) stores: account ID, name, email, progress and your weekly leaderboard entry (name and points). Legal basis: your consent, which you can withdraw by signing out and deleting your data. Data is kept until you delete it; the weekly leaderboard entry is replaced each week. Data may be processed on servers outside Algeria, the EU and the UK; Google relies on lawful transfer safeguards (standard contractual clauses).", "Si vous vous connectez avec Google, Firebase (Google LLC) enregistre : identifiant du compte, nom, e-mail, progression et votre entrée au classement hebdomadaire (nom et points). Base légale : votre consentement, que vous pouvez retirer en vous déconnectant et en supprimant vos données. Conservation jusqu’à suppression par vos soins ; l’entrée du classement est remplacée chaque semaine. Les données peuvent être traitées hors d’Algérie, de l’UE et du Royaume-Uni ; Google s’appuie sur des garanties de transfert licites (clauses contractuelles types)."]], [["الأطفال", "Children", "Enfants"], ["نطلب العمر في البداية. من هم دون 13 سنة يعملون بوضع الأطفال، ومن هم دون 16 سنة لا تُتاح لهم ميزات السحابة (تسجيل الدخول واللوحة الأسبوعية والتحدي المباشر)، فلا نجمع بياناتهم الشخصية على خوادمنا ولا نعرض لهم إعلانات مخصّصة. نشجّع ولي الأمر على مرافقة الطفل. إن علمت أن طفلًا أرسل بيانات دون إذن وليّه فراسلنا لنحذفها فورًا. نتبع روح قانون حماية البيانات الجزائري 18-07 واللائحة الأوروبية (المادة 8) والقانون الفرنسي (سن 15) ومدوّنة التصميم المناسب للعمر في بريطانيا.", "We ask for age at the start. Under-13s use kids mode, and under-16s do not get cloud features (sign-in, weekly leaderboard, live duels): we collect no personal data from them on our servers and show them no personalised ads. We encourage parents to accompany children. If you believe a child sent data without parental permission, contact us and we will delete it promptly. We follow Algerian data law 18-07, GDPR (Art. 8), French law (age 15) and the UK Age Appropriate Design Code.", "Nous demandons l’âge au départ. Les moins de 13 ans utilisent le mode enfant et les moins de 16 ans n’ont pas accès aux fonctions cloud (connexion, classement hebdomadaire, duels en direct) : nous ne collectons aucune donnée personnelle les concernant sur nos serveurs et n’affichons aucune publicité personnalisée. Nous encourageons l’accompagnement par un parent. Si un enfant a transmis des données sans accord parental, contactez-nous et nous les supprimerons rapidement. Nous suivons la loi algérienne 18-07, le RGPD (art. 8), la loi française (15 ans) et l’Age Appropriate Design Code britannique."]], [["خدمات الأطراف الثالثة", "Third-party services", "Services tiers"], ["عند استعمالك للميزات التالية يرى مزوّد الخدمة عنوان IP وبيانات الجهاز التقنية: (1) التلاوات من EveryAyah وMP3Quran. (2) ترجمة فرنسية للآيات من api.alquran.cloud عند طلبها. (3) خطوط Google Fonts عند فتح الموقع. (4) خدمة ntfy.sh لبدء التحدي المباشر بين جهازين (رمز مؤقت فقط، وهي معطّلة لمن هم دون 16). (5) Firebase إن سجّلت الدخول. لا نشارك معهم اسمك أو تقدّمك إلا ما ذُكر في (5). راجع سياساتهم الخاصة.", "When you use these features the provider sees your IP address and technical device data: (1) recitations from EveryAyah and MP3Quran; (2) French verse translation from api.alquran.cloud when requested; (3) Google Fonts when the site opens; (4) ntfy.sh to start a live duel between two devices (temporary code only; disabled for under-16s); (5) Firebase if you sign in. We share nothing else with them beyond (5). See their own policies.", "Lorsque vous utilisez ces fonctions, le prestataire voit votre adresse IP et des données techniques de l’appareil : (1) récitations d’EveryAyah et MP3Quran ; (2) traduction française des versets via api.alquran.cloud sur demande ; (3) Google Fonts à l’ouverture du site ; (4) ntfy.sh pour lancer un duel en direct entre deux appareils (code temporaire uniquement, désactivé pour les moins de 16 ans) ; (5) Firebase si vous vous connectez. Nous ne partageons rien d’autre avec eux, hormis (5). Voir leurs politiques."]], [["الموقع والإشعارات والإعلانات", "Location, notifications, ads", "Localisation, notifications, publicités"], ["الموقع التقريبي يُستعمل داخل جهازك فقط لأوقات الصلاة والقبلة بعد إذنك، ولا نخزّنه. الإشعارات اختيارية ويمكن إيقافها من الجهاز. لا توجد إعلانات حاليًا؛ وإن أضفنا إعلانات مكافِئة اختيارية فستكون غير مخصّصة ومعالَجة كموجّهة للأطفال حيث يلزم، وتُحدَّث هذه السياسة قبل ذلك.", "Approximate location is used on your device only, after your permission, for prayer times and qibla; we do not store it. Notifications are optional and can be turned off in your device. There are currently no ads; if we add optional rewarded ads they will be non-personalised and treated as child-directed where required, and this policy will be updated first.", "La localisation approximative est utilisée uniquement sur votre appareil, avec votre accord, pour les horaires de prière et la qibla ; nous ne la stockons pas. Les notifications sont facultatives et désactivables. Il n’y a actuellement aucune publicité ; si nous ajoutons des publicités récompensées facultatives, elles seront non personnalisées et traitées comme destinées aux enfants là où c’est requis, et cette politique sera mise à jour avant."]], [["حقوقك", "Your rights", "Vos droits"], ["لك الحق في الاطلاع على بياناتك وتصحيحها وحذفها وتقييد معالجتها وتسلّمها بصيغة قابلة للنقل والاعتراض وسحب الموافقة في أي وقت دون أثر رجعي. داخل التطبيق: الإعدادات ← نسخة احتياطية (تصدير)، «حذف بياناتي من السحابة»، وإعادة الضبط. أو راسلنا على [contact email] ونردّ خلال 30 يومًا. لك الحق في الشكوى لدى السلطة المختصة: الجزائر: السلطة الوطنية لحماية المعطيات الشخصية (ANPDP)، فرنسا: CNIL، بريطانيا: ICO.", "You may access, correct, erase, restrict, port and object to the processing of your data and withdraw consent at any time without retroactive effect. In the app: Settings → Backup (export), “Delete my cloud data”, and reset. Or write to [contact email]; we reply within 30 days. You may complain to your authority: Algeria: ANPDP (national authority for personal data protection); France: CNIL; UK: ICO.", "Vous pouvez accéder à vos données, les rectifier, les effacer, limiter leur traitement, les récupérer, vous opposer au traitement et retirer votre consentement à tout moment sans effet rétroactif. Dans l’application : Réglages → Sauvegarde (export), « Supprimer mes données cloud » et réinitialisation. Ou écrivez à [contact email] ; réponse sous 30 jours. Vous pouvez saisir votre autorité : Algérie : ANPDP ; France : CNIL ; Royaume-Uni : ICO."]], [["الأمان والتعديلات", "Security and changes", "Sécurité et modifications"], ["نستعمل HTTPS وقواعد وصول صارمة في Firebase بحيث لا يقرأ أحد بياناتك الخاصة. لا يوجد نظام آمن بالكامل، ونُبلغ الجهات والمستخدمين المعنيين عند أي خرق وفق القانون. نعلن أي تغيير جوهري في هذه الصفحة وداخل التطبيق.", "We use HTTPS and strict Firebase access rules so nobody else can read your private data. No system is fully secure; we will notify authorities and affected users of any breach as the law requires. Material changes will be announced on this page and in the app.", "Nous utilisons HTTPS et des règles d’accès strictes sur Firebase afin que nul ne lise vos données privées. Aucun système n’est totalement sûr ; nous informerons les autorités et les utilisateurs concernés de toute violation comme la loi l’exige. Les changements importants seront annoncés sur cette page et dans l’application."]]]};
