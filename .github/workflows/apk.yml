name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [unit-sequence, main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Icons
        run: |
          for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp public/icon-512.png android/app/src/main/res/$d/$n.png || true
            done
          done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/*.xml
      - name: Build
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nooralfurqan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
