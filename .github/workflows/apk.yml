name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [unit-sequence, main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Icons and splash
        run: |
          R=android/app/src/main/res
          find $R -name 'ic_launcher*' -delete
          rm -f $R/drawable*/splash.png
          cp -r android-res/* $R/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:allowBackup="false" android:usesCleartextTraffic="false" android:fullBackupContent="false"/' $M
          sed -i 's/android:allowBackup="true"//' $M
      - name: Build
        working-directory: android
        run: |
          sed -i 's#https\\://github.com/gradle/gradle-distributions/releases/download/v\([0-9.]*\)/#https\\://services.gradle.org/distributions/#' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=.*/networkTimeout=120000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4 5 6; do ./gradlew assembleDebug --no-daemon && exit 0; sleep 30; done; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: nooralfurqan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk nooralfurqan.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest nooralfurqan.apk -t "نور الفرقان APK" -n "ثبّت الملف على أندرويد"
